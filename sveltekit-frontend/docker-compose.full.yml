version: '3.8'

services:
  # ============================================================================
  # PostgreSQL 18 + pgvector (Vector Database)
  # ============================================================================
  postgres:
    image: pgvector/pgvector:pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
    container_name: legal-ai-postgres
    environment:
      POSTGRES_DB: legal_ai_db
      POSTGRES_USER: legal_admin
      POSTGRES_PASSWORD: 123456
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    command:
      - postgres
      - -c
      - shared_preload_libraries=vector
      - -c
      - io_method=worker
      - -c
      - io_workers=4
      - -c
      - jit=off
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=256MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal_admin -d legal_ai_db"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - legal-ai-network

  # ============================================================================
  # Valkey Cache (Redis-compatible, AGPL-free)
  # ============================================================================
  valkey:
    image: valkey/valkey-bundle:8.1.1@sha256:8b6501bf71570ee597e621628b141500d9ad24a4137296dbd92ff7791c14367f
    container_name: legal-ai-valkey
    command: valkey-server --requirepass redis --maxmemory 2gb --maxmemory-policy allkeys-lru --io-threads 4
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "redis", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - legal-ai-network

  # ============================================================================
  # MinIO Object Storage
  # ============================================================================
  minio:
    image: minio/minio:latest
    container_name: legal-ai-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - legal-ai-network

  # ============================================================================
  # Qdrant Vector Database
  # ============================================================================
  qdrant:
    image: qdrant/qdrant:v1.19.0@sha256:057ee3a8da769fe7310dd3537b4dc7583bf87a95ce8ac43c0af5a46bc580d1fc
    container_name: legal-ai-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - legal-ai-network

  # ============================================================================
  # Ollama embeddings service (GPU-accelerated, optional profile)
  # ============================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: legal-ai-ollama
    profiles:
      - embeddings
    environment:
      - OLLAMA_HOST=0.0.0.0
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - legal-ai-network

  # ============================================================================
  # TensorRT-LLM Service
  # ============================================================================
  tensorrt-llm:
    image: nvcr.io/nvidia/tensorrt-llm/release:latest
    container_name: legal-ai-tensorrt
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - legal-ai-network

  # ============================================================================
  # FastAPI RAG Backend Service (Port 8005)
  # ============================================================================
  fastapi-rag:
    build:
      context: .
      dockerfile: Dockerfile.fastapi
    container_name: legal-ai-fastapi
    environment:
      # Database
      DATABASE_URL: postgresql://legal_admin:123456@postgres:5432/legal_ai_db
      # Redis
      REDIS_URL: redis://:redis@valkey:6379/0
      # MinIO
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      # Qdrant
      QDRANT_URL: http://qdrant:6333
      # Ollama embeddings-only lane
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_EMBED_ENDPOINT: http://host.docker.internal:11434/api/embed
      # TensorRT-LLM
      TRT_LLM_ENDPOINT: http://tensorrt-llm:8000/api/infer
      # SIMD/Performance
      USE_SIMDJSON_NODE: "1"
      USE_JSON_FAST: "1"
    ports:
      - "8005:8005"
    volumes:
      - ./fastapi-app:/app
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      tensorrt-llm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - legal-ai-network

  # ============================================================================
  # RabbitMQ Message Queue
  # ============================================================================
  rabbitmq:
    image: rabbitmq:3-management-alpine@sha256:606d8c0d6b3c18d1da9afc53bc7cdb2a8d5486df91b5a9830e9e07626c9ae281
    container_name: legal-ai-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - legal-ai-network

  # ============================================================================
  # CouchDB (MapReduce/Graph Analysis)
  # ============================================================================
  couchdb:
    image: couchdb:3.3@sha256:307a3f5276f64c0db28f226b7b5c180b8f2c851afa681cfb4fbb1b1fe7fd5587
    container_name: legal-ai-couchdb
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=password
    ports:
      - "5984:5984"
    volumes:
      - couchdb_data:/opt/couchdb/data
      - ../docker/couchdb/local.d/10-single-node.ini:/opt/couchdb/etc/local.d/10-single-node.ini:ro
    healthcheck:
      test: curl -f http://127.0.0.1:5984/_up || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - legal-ai-network

volumes:
  postgres_data:
  redis_data:
  valkey_data:
  minio_data:
  qdrant_data:
  ollama_data:
  rabbitmq_data:
  couchdb_data:

networks:
  legal-ai-network:
    driver: bridge
