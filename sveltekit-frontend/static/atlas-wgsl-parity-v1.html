<!doctype html><html lang="en"><meta charset="utf-8"><title>Parent Atlas WGSL CPU parity fixture</title>
<h1>Parent Atlas WGSL fixture (no model weights)</h1><button id="run">Run one WebGPU kernel</button><pre id="out">Ready; no GPU device allocated.</pre>
<script type="module">
const out=document.querySelector('#out');
document.querySelector('#run').addEventListener('click',async()=>{
  let device; const started=performance.now();
  const receipt={schema:'atlas.wgsl.browser.parity.v1',testId:'WGSL-BROWSER-01',backend:'webgpu-wgsl',
   status:'BLOCKED',reason:null,durationMs:null,maxAbsError:null,modelLoaded:false,weightsDownloaded:false,
   userGesture:true,adapterLimitBytes:null,availableVramBytes:null};
  const a=new Float32Array([0,1,-2,3.5,.125,100,-64,1]);
  const b=new Float32Array([1,-1,2,.5,-.125,-100,63,2]);
  const expected=Float32Array.from(a,(x,i)=>Math.fround(x+b[i]));
  let shader='';
  const buffers=[];
  try {
   shader=await fetch('/atlas-kernels/add-f32-v1.wgsl',{cache:'no-store'}).then(async response=>{if(!response.ok)throw Error('SHADER_ASSET_UNAVAILABLE');return response.text()});
    if (!isSecureContext || !navigator.gpu) throw Error('WEBGPU_NOT_AVAILABLE');
    const adapter=await navigator.gpu.requestAdapter();
    if(!adapter) throw Error('WEBGPU_ADAPTER_MISSING');
    receipt.adapterLimitBytes=adapter.limits.maxBufferSize; // NOT free VRAM
    device=await adapter.requestDevice();
    const module=device.createShaderModule({code:shader});
    const errors=await module.getCompilationInfo();
    if(errors.messages.some(m=>m.type==='error')) throw Error('WGSL_COMPILATION_FAILED: '+errors.messages.map(m=>m.message).join('; '));
    const mk=(bytes,usage)=>{const x=device.createBuffer({size:bytes,usage});buffers.push(x);return x};
    const aa=mk(a.byteLength,GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_DST);
    const bb=mk(b.byteLength,GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_DST);
    const cc=mk(a.byteLength,GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_SRC);
    const params=mk(16,GPUBufferUsage.UNIFORM|GPUBufferUsage.COPY_DST);
    const read=mk(a.byteLength,GPUBufferUsage.COPY_DST|GPUBufferUsage.MAP_READ);
    device.queue.writeBuffer(aa,0,a);device.queue.writeBuffer(bb,0,b);
    device.queue.writeBuffer(params,0,new Uint32Array([a.length,0,0,0]));
    const pipeline=device.createComputePipeline({layout:'auto',compute:{module,entryPoint:'main'}});
    const group=device.createBindGroup({layout:pipeline.getBindGroupLayout(0),entries:[
      {binding:0,resource:{buffer:aa}},{binding:1,resource:{buffer:bb}},
      {binding:2,resource:{buffer:cc}},{binding:3,resource:{buffer:params}}
    ]});
    const encoder=device.createCommandEncoder();
    const pass=encoder.beginComputePass();pass.setPipeline(pipeline);pass.setBindGroup(0,group);pass.dispatchWorkgroups(1);pass.end();
    encoder.copyBufferToBuffer(cc,0,read,0,a.byteLength);
    device.queue.submit([encoder.finish()]);
    await read.mapAsync(GPUMapMode.READ);
    const actual=new Float32Array(read.getMappedRange().slice(0));read.unmap();
    const maxErr=Math.max(...actual.map((v,i)=>Math.abs(v-expected[i])));
    receipt.maxAbsError=maxErr;
    receipt.status=maxErr<=1e-6?'PASS':'FAIL';
    if(receipt.status==='FAIL') receipt.reason='NUMERICAL_MISMATCH';
  }catch(e){receipt.status='BLOCKED';receipt.reason=String(e?.message??e)}
  finally{receipt.durationMs=performance.now()-started;for(const b of buffers)b.destroy();out.textContent=JSON.stringify(receipt,null,2);
    console.log('[ATLAS_WGSL_TELEMETRY]',JSON.stringify(receipt));}
});
</script></html>
