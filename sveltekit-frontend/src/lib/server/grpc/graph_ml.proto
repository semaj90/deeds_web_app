syntax = "proto3";
package graphml;
option go_package = "github.com/deeds/graphml";

// -- Shared types --

message FloatVector {
  repeated float values = 1;
}

message EmbeddingRecord {
  string id = 1;
  string file_path = 2;
  int32 chunk_index = 3;
  repeated float vector = 4;
  repeated string tags = 5;
  string summary = 6;
}

// -- K-Means --

message KMeansRequest {
  repeated float embeddings = 1; // flat n*dim row-major
  int32 n = 2;
  int32 dim = 3;
  int32 k = 4;
  int32 max_iters = 5;
}

message KMeansResponse {
  repeated int32 assignments = 1; // length n
  repeated float centroids = 2;   // length k*dim row-major
  string source = 3;              // "gpu" | "cpu"
}

// -- SOM --

message SOMRequest {
  repeated float embeddings = 1;
  int32 n = 2;
  int32 dim = 3;
  int32 grid_w = 4;
  int32 grid_h = 5;
  int32 iters = 6;
  float lr_init = 7;
  float lr_final = 8;
  float rad_init = 9;
  float rad_final = 10;
}

message SOMResponse {
  repeated float weights = 1; // length grid_w*grid_h*dim
  repeated int32 bmu = 2;     // length n
  string source = 3;
}

// -- Attention scoring --

message AttentionRequest {
  repeated float query = 1; // length dim
  repeated float keys = 2;  // length n*dim row-major
  int32 n = 3;
  int32 dim = 4;
}

message AttentionResponse {
  repeated float scores = 1; // softmax weights, length n
  string source = 2;
}

// -- PageRank --

message PageRankRequest {
  repeated float adj = 1;  // n*n adjacency matrix, row-major
  int32 n = 2;
  float damping = 3;
  int32 iters = 4;
}

message PageRankResponse {
  repeated float scores = 1; // length n, sums to 1
  string source = 2;
}

// -- Memory Checkpoint (QLoRA / LoRA adapter selection) --
// Published after every hypergraph build for each Grade A/B hyperedge.
// The gRPC server stores X_prime centroids and maps them to the nearest
// fine-tuned LoRA adapter — enabling per-query adapter loading at inference time.

message MemoryCheckpointRequest {
  string hyperedge_hash = 1;  // 8-char FNV-1a key
  repeated float x_prime = 2; // 768-dim HGNN-enriched centroid (reward-weighted mean)
  float grade_score = 3;       // [0,1] GRPO reward signal
  string grade_label = 4;      // "A" | "B" | "C" | "D"
  string pipeline = 5;         // dominant pipeline: ace|rag|kag|dag|codebase
  int32 member_count = 6;      // number of research summaries in this cluster
  string lora_hint = 7;        // suggested LoRA adapter: legal_rag|legal_kag|etc.
}

message MemoryCheckpointResponse {
  bool accepted = 1;      // false = rejected (grade too low, duplicate, etc.)
  string adapter_id = 2;  // nearest LoRA adapter UUID found by the server (optional)
}

// -- RL Analytics Signal (self-modification feedback) --
// Emitted on user interaction (thumbs up/down, citation saved, dwell time).
// Server adjusts pipeline weight deltas and can trigger re-clustering.

message AnalyticsSignalRequest {
  string signal = 1;          // thumbs_up|thumbs_down|dwell_long|dwell_short|citation_saved
  string pipeline = 2;        // which pipeline produced the response
  string hyperedge_hash = 3;  // active memory module hash at signal time (optional)
  string user_id = 4;
  string session_id = 5;
}

message AnalyticsSignalResponse {
  float updated_weight = 1;   // new pipeline weight after delta applied
  bool rebuild_triggered = 2; // true if pending count reached rebuild threshold
}

// -- Service --

service GraphMLService {
  rpc RunKMeans(KMeansRequest) returns (KMeansResponse);
  rpc RunSOM(SOMRequest) returns (SOMResponse);
  rpc ScoreAttention(AttentionRequest) returns (AttentionResponse);
  rpc RunPageRank(PageRankRequest) returns (PageRankResponse);

  // Memory module / self-modification RPCs
  rpc PublishMemoryCheckpoint(MemoryCheckpointRequest) returns (MemoryCheckpointResponse);
  rpc RecordAnalyticsSignal(AnalyticsSignalRequest) returns (AnalyticsSignalResponse);
}
