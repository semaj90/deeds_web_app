syntax = "proto3";
package graphml;
option go_package = "github.com/deeds/graphml";

// -- Shared types --

message FloatVector {
  repeated float values = 1;
}

message EmbeddingRecord {
  string id = 1;
  string file_path = 2;
  int32 chunk_index = 3;
  repeated float vector = 4;
  repeated string tags = 5;
  string summary = 6;
}

// -- K-Means --

message KMeansRequest {
  repeated float embeddings = 1; // flat n*dim row-major
  int32 n = 2;
  int32 dim = 3;
  int32 k = 4;
  int32 max_iters = 5;
}

message KMeansResponse {
  repeated int32 assignments = 1; // length n
  repeated float centroids = 2;   // length k*dim row-major
  string source = 3;              // "gpu" | "cpu"
}

// -- SOM --

message SOMRequest {
  repeated float embeddings = 1;
  int32 n = 2;
  int32 dim = 3;
  int32 grid_w = 4;
  int32 grid_h = 5;
  int32 iters = 6;
  float lr_init = 7;
  float lr_final = 8;
  float rad_init = 9;
  float rad_final = 10;
}

message SOMResponse {
  repeated float weights = 1; // length grid_w*grid_h*dim
  repeated int32 bmu = 2;     // length n
  string source = 3;
}

// -- Attention scoring --

message AttentionRequest {
  repeated float query = 1; // length dim
  repeated float keys = 2;  // length n*dim row-major
  int32 n = 3;
  int32 dim = 4;
}

message AttentionResponse {
  repeated float scores = 1; // softmax weights, length n
  string source = 2;
}

// -- PageRank --

message PageRankRequest {
  repeated float adj = 1;  // n*n adjacency matrix, row-major
  int32 n = 2;
  float damping = 3;
  int32 iters = 4;
}

message PageRankResponse {
  repeated float scores = 1; // length n, sums to 1
  string source = 2;
}

// -- Service --

service GraphMLService {
  rpc RunKMeans(KMeansRequest) returns (KMeansResponse);
  rpc RunSOM(SOMRequest) returns (SOMResponse);
  rpc ScoreAttention(AttentionRequest) returns (AttentionResponse);
  rpc RunPageRank(PageRankRequest) returns (PageRankResponse);
}
