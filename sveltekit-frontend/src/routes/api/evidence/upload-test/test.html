<!DOCTYPE html>
<html>
<head>
  <title>Evidence Upload Test</title>
  <style>
    body { font-family: system-ui; max-width: 600px; margin: 50px auto; padding: 20px; }
    .result { margin-top: 20px; padding: 15px; border-radius: 4px; }
    .success { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
    .error { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
    pre { background: #f5f5f5; padding: 10px; border-radius: 4px; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>Evidence Upload Test</h1>
  <p>Test file upload to diagnose issues with multipart form data.</p>

  <form id="testForm">
    <div>
      <label>Select a file:</label><br>
      <input type="file" name="file" id="fileInput" required>
    </div>
    <div style="margin-top: 20px;">
      <button type="submit">Test Upload</button>
    </div>
  </form>

  <div id="result"></div>

  <script>
    document.getElementById('testForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const result = document.getElementById('result');
      const fileInput = document.getElementById('fileInput');
      const file = fileInput.files[0];

      if (!file) {
        result.innerHTML = '<div class="error">No file selected</div>';
        return;
      }

      result.innerHTML = '<div>Uploading...</div>';

      try {
        const formData = new FormData();
        formData.append('file', file);

        const response = await fetch('/api/evidence/upload-test', {
          method: 'POST',
          body: formData,
        });

        const data = await response.json();

        if (response.ok) {
          result.innerHTML = `
            <div class="success">
              <h3>✓ Upload Test Successful</h3>
              <pre>${JSON.stringify(data, null, 2)}</pre>
            </div>
          `;
        } else {
          result.innerHTML = `
            <div class="error">
              <h3>✗ Upload Test Failed</h3>
              <p><strong>Status:</strong> ${response.status}</p>
              <pre>${JSON.stringify(data, null, 2)}</pre>
            </div>
          `;
        }
      } catch (err) {
        result.innerHTML = `
          <div class="error">
            <h3>✗ Network Error</h3>
            <p>${err.message}</p>
          </div>
        `;
      }
    });
  </script>
</body>
</html>
