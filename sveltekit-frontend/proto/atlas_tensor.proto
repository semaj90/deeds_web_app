syntax = "proto3";
package parent_atlas.tensor.v1;

message RevisionEnvelope {
  string request_id = 1;
  string packet_key = 2;
  string workspace_revision = 3;
  string source_revision = 4;
  string representation_revision = 5;
  string graph_revision = 6;
  string producer = 7;
  string producer_revision = 8;
  string pass_name = 9;
  string pass_revision = 10;
  string idempotency_key = 11;
}

message TileRequest {
  RevisionEnvelope envelope = 1;
  string tile_key = 2;
}

message TileDescriptor {
  string tile_key = 1;
  string artifact_id = 2;
  uint32 record_batch_index = 3;
  uint32 row_count = 4;
  uint64 byte_length = 5;
  string content_hash = 6;
}

service AtlasTensorService {
  rpc ResolveTile(TileRequest) returns (TileDescriptor);
}
