# ============================================================================
# Critical Rules (DO NOT VIOLATE)
# ============================================================================

hard_rules:
  rule_1_naive_bayes_does_not_execute_repairs:
    description: "Naive Bayes classifies packets; it does NOT run repairs"
    enforcement: "Naive Bayes output goes to HMM, NOT directly to ACP"
    consequence: "Violating this breaks the three-tier decision flow"

  rule_2_tier_sequencing_is_mandatory:
    description: "Tiers must execute in order: 1 → 2 → 3 → 4. No shortcuts."
    enforcement: "Tier 2 requires Tier 1 output (features), Tier 3 requires Tier 2 output (predictions), Tier 4 requires Tier 3 output (recommendations)"
    consequence: "Skipping tiers causes cascade failures and invalid diagnoses"

  rule_3_postgres_is_truth:
    description: "Postgres is the single source of truth for all decisions"
    enforcement: "Qdrant/Redis/Neo4j are mirrors only. Never join across mirrors without Postgres as fallback."
    consequence: "Violating this causes stale predictions and cascade failures"

  rule_4_json_safe_serialization:
    description: "Models saved as JSON (secure), never pickle"
    enforcement: "infer-naive-bayes.py loads models from JSON, no pickle.load()"
    consequence: "Pickle allows arbitrary code execution on deserialization; unsafe for untrusted data"

  rule_5_confidence_threshold_for_acp:
    description: "ACP only executes repairs if HMM confidence ≥ 0.70"
    enforcement: "acp-repair-dispatcher filters by confidence threshold before enqueuing"
    consequence: "Low-confidence recommendations can corrupt data; threshold prevents cascade failures"

  rule_6_semantic_evidence_before_repair:
    description: "Repair lanes only execute if semantic evidence validator passes"
    enforcement: "validate-semantic-evidence.mjs gates every repair decision (identity + semantic lanes + HMM state)"
    consequence: "Repairs without evidence validation cause blind patching and data corruption"

