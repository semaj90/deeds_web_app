# Phase 106: Deterministic Packet Operating System
# Routing Contract (YAML reference for multi-system coordination)
# Status: WIRED & TESTED (Session 106)

version: 1.0
last_updated: 2026-07-05
mission: "Implement Phase 106 as deterministic packet OS using three-tier decision flow"

# ============================================================================
# Three-Tier Decision Flow (IMMUTABLE CONTRACT)
# ============================================================================

tiers:
  tier_1_feature_extraction:
    name: "Feature Extraction (Stage 1-3)"
    responsibility: "Extract structural, lexical, semantic features"
    scripts:
      - phase1.5-ast-grep-extraction.mjs (ast_symbols)
      - phase1.5-lexical-extraction.mjs (lexical_features)
      - langextract-phase3 (used_concepts)
    input_tables:
      - atlas_packets (packet_key, source_ref)
    output_tables:
      - atlas_packet_features (ast_symbols, lexical_features, used_concepts, entities)
    coverage_target: 95% of 58,304 extractable packets
    current_status:
      ast_symbols: 0.9% (516/58,304)
      lexical_features: 2.4% (1,418/58,304)
      used_concepts: 100% (58,361/58,365)

  tier_2_naive_bayes_classification:
    name: "Naive Bayes Classification (Phase 106.2)"
    responsibility: "Classify packet type and predict initial error state"
    motto: "Naive Bayes answers: What kind of packet is this?"
    scripts:
      - train-naive-bayes-packet-classifier.py (training)
      - infer-naive-bayes.py (inference engine, JSON-based)
      - apply-naive-bayes-packet-classifier.mjs (apply to all packets)
    input_tables:
      - atlas_packet_features (vectorized via TF-IDF)
    output_tables:
      - atlas_packet_metrics.naive_bayes_predictions (JSONB)
    predictions:
      domain_class:
        description: "Packet domain (auth, data, ui, infra, network, config, other)"
        sample_accuracy: 80.8%
        used_by: HMM for topology-aware reranking
      feature_type:
        description: "Feature classification (core, utility, test, config, migration)"
        sample_accuracy: 83.8%
        used_by: ACE context filtering
      likely_error_state:
        description: "Initial error diagnosis (StructureError, LexicalError, SemanticError, TopologyError, VectorError)"
        sample_accuracy: 99.3%
        used_by: HMM for priority-based repair selection
      candidate_repair_lane:
        description: "Recommended repair action (ast_extraction, lexical_extraction, concept_extraction, embedding_bridge, topology_repair)"
        sample_accuracy: 99.3%
        used_by: ACP for bounded action dispatch
    model_format:
      type: "JSON (secure, human-readable, no code execution)"
      files:
        naive_bayes_models.json: "Trained classifier coefficients and class priors"
        tfidf_vectorizer.json: "Feature vocabulary and IDF values"
    current_status: WIRED & TESTED (dry-run 100%)

  tier_3_hmm_diagnosis:
    name: "HMM State Machine (Phase 8.8, wiring pending)"
    responsibility: "Infer diagnostic state and emit repair recommendations"
    motto: "HMM answers: What should happen next?"
    scripts:
      - phase8.8-hmm-semantic-compiler.mjs (pending wire to Naive Bayes input)
    input_tables:
      - atlas_packet_metrics.naive_bayes_predictions (from Tier 2)
    output_tables:
      - atlas_packet_metrics.hmm_recommendations (pending creation)
    state_machine:
      description: "Priority-based error state detection with confidence scoring"
      states:
        - IdentityError (packet_key missing/corrupt)
        - StructureError (ast_symbols missing/incomplete)
        - LexicalError (lexical_features missing)
        - SemanticError (used_concepts missing)
        - TopologyError (graph edges missing)
        - VectorError (embedding missing/invalid)
        - QdrantBridgeError (Qdrant sync failed)
      recommendations:
        hmm_state: "Diagnosed state"
        confidence: "0.0-1.0"
        recommended_repair_lane: "Tool to run (ast-grep, lexical extractor, concept extractor, embedding bridge, topology repair)"
        recommended_tool_call: "Exact command/RabbitMQ job"
        evidence: "Supporting signals (Naive Bayes scores, feature coverage)"
    current_status: PENDING WIRING (script exists, needs Naive Bayes input integration)

  tier_4_acp_execution:
    name: "ACP Repair Dispatcher (Phase 106.4, pending implementation)"
    responsibility: "Execute bounded repair actions via RabbitMQ"
    motto: "ACP answers: What tool runs now?"
    scripts:
      - acp-repair-dispatcher.mjs (PENDING CREATION)
    input_tables:
      - atlas_packet_metrics.hmm_recommendations (from Tier 3)
    output_tables:
      - rabbitmq (job queue for repair tools)
    dispatch_rules:
      confidence_threshold: 0.70 (only execute if HMM confidence >= 0.70)
      scope_limit: "100 packets max per tool call (prevent cascade failures)"
      tool_mapping:
        StructureError: "atlas:phase1.5:ast-grep:apply"
        LexicalError: "atlas:phase1.5:lexical:apply"
        SemanticError: "atlas:langextract:concepts:apply"
        TopologyError: "atlas:topology:repair:apply"
        VectorError: "atlas:qdrant:embedding:bridge:apply"
    current_status: NOT_YET_IMPLEMENTED

# ============================================================================
# Data Contracts (Routing Reference)
# ============================================================================

packet_flow:
  identity_layer:
    canonical_table: atlas_packets
    key_fields:
      packet_key: "Primary identity (UUID)"
      source_ref: "File path or reference (src/lib/...)"
      feature_id: "Feature label (auth.sessions, ui.forms, ...)"
      title_id: "Packet title"
    notes: "Immutable identity. Join point for all mirrors."

  feature_extraction_layer:
    canonical_table: atlas_packet_features
    join_key: packet_key
    extracted_fields:
      ast_symbols: "Array of function/class/import names from ast-grep"
      lexical_features: "Array of top-20 keywords from code text"
      used_concepts: "Array of semantic concepts from LangExtract"
      entities: "Array of named entities (User, Session, ...)"
    dependency: "Joined to atlas_packets via packet_key"

  classification_layer:
    canonical_table: atlas_packet_metrics
    join_key: packet_key
    prediction_fields:
      naive_bayes_predictions: "JSONB containing domain_class, feature_type, likely_error_state, candidate_repair_lane + confidence scores"
    dependency: "Read from atlas_packet_features, write to atlas_packet_metrics"

  diagnosis_layer:
    canonical_table: atlas_packet_metrics (hmm_recommendations column, PENDING)
    join_key: packet_key
    recommendation_fields:
      hmm_state: "Diagnosed error state"
      confidence: "Confidence score (0.0-1.0)"
      recommended_repair_lane: "Repair action to execute"
      recommended_tool_call: "RabbitMQ job or CLI command"
      evidence: "Supporting signals"
    dependency: "Read from naive_bayes_predictions, write to hmm_recommendations"

  execution_layer:
    canonical_queue: RabbitMQ (routing keys: atlas:phase1.5:*, atlas:topology:*, atlas:qdrant:*)
    join_key: packet_key (via audit trail)
    job_fields:
      packet_id: "Packet to repair"
      tool: "Tool to execute"
      scope: "Max packets to process"
      params: "Tool-specific parameters"
    dependency: "Read from hmm_recommendations, enqueue to RabbitMQ"

# ============================================================================
# Storage Decision Tree (WHERE DATA LIVES)
# ============================================================================

storage_allocation:
  postgres_canonical:
    tables:
      - atlas_packets (58,365 rows, identity)
      - atlas_packet_features (40,754 rows, features)
      - atlas_packet_metrics (growing, predictions)
    responsibility: "Source of truth for all decisions"
    update_policy: "Transactional, immutable history"

  qdrant_mirror:
    collection: codebase_chunks_768
    points: 40,568 (subset of chunks with embeddings)
    payload_fields:
      - packet_key
      - source_ref
      - feature_id
      - domain_class (from Naive Bayes)
      - som_cluster (from topology)
    responsibility: "Fast ANN search, NOT identity"
    rebuild_policy: "From atlas_packet_features on divergence"

  redis_cache:
    keyspace: bitfrost:* (warm cache for frequent queries)
    ttl: Variable (packet cache 24h, centroid cache 6h)
    responsibility: "L1 hot memory, NOT identity"
    rebuild_policy: "From Postgres on cache miss"

  neo4j_topology:
    nodes: Directory, Feature, Packet (identity copy via mirror)
    edges: IMPORTS, BELONGS_TO_CLUSTER, SIMILAR_TOPOLOGY, SHARES_TAGS
    responsibility: "Graph reasoning, NOT identity"
    rebuild_policy: "From Postgres on divergence"

