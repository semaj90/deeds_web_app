# 🚀 Phase 96: Langfuse v3 + ClickHouse + Neo4j + PyTorch
# Advanced LLM Observability with Knowledge Graph Integration
# Uses your existing: Postgres 17, Neo4j, PyTorch
# Usage: docker-compose -f docker/langfuse.yml up -d

version: '3.8'

services:
  # ClickHouse - Fast analytics database for traces (Langfuse v3 requirement)
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: langfuse-clickhouse
    restart: unless-stopped
    ports:
      - "5123:8123"  # HTTP interface on port 5123 (safe range)
      - "5900:9000"  # Native protocol on port 5900 (fallback range)
    environment:
      CLICKHOUSE_DB: langfuse
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse_password
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d  # Auto-create tables on first start
      - ./clickhouse/config/keeper.xml:/etc/clickhouse-server/config.d/keeper.xml
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # Langfuse v3 - Main observability server
  langfuse-server:
    image: langfuse/langfuse:2
    container_name: langfuse-server
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      - "3030:3000"  # Langfuse UI at http://localhost:3030
    environment:
      # Postgres (metadata) - Uses existing deeds-postgres-prod container
      DATABASE_URL: postgresql://legal_admin:123456@deeds-postgres-prod:5432/langfuse?connect_timeout=10&pool_timeout=10

      # ClickHouse disabled for v2 (Postgres-only mode)
      # CLICKHOUSE_URL: http://clickhouse:8123
      # CLICKHOUSE_MIGRATION_URL: clickhouse://default:clickhouse_password@clickhouse:9000/langfuse

      # Server
      NEXTAUTH_URL: http://localhost:3030
      NEXTAUTH_SECRET: langfuse-secret-key-change-in-production-min-32-chars
      SALT: langfuse-salt-change-in-production
      ENCRYPTION_KEY: 8754be3c748398a38dd9a797fbb84747cb8b94d34dd15a2d5237851dbbe1b671

      # Redis (existing deeds-redis-prod on host port 6379)
      REDIS_CONNECTION_STRING: redis://deeds-redis-prod:6379

      # Auth (disable for local dev)
      AUTH_DISABLE_USERNAME_PASSWORD: "false"
      AUTH_DISABLE_SIGNUP: "false"

      # Telemetry
      TELEMETRY_ENABLED: "false"

      # Feature flags
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "true"

      # Auto-seed project with API keys (runs on first boot only)
      LANGFUSE_INIT_ORG_ID: deeds-legal-ai
      LANGFUSE_INIT_ORG_NAME: Deeds Legal AI
      LANGFUSE_INIT_PROJECT_ID: deeds-observability
      LANGFUSE_INIT_PROJECT_NAME: Deeds LLM Observability
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-4e3db8a0107de7872b894e309494252b
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-3941aba7500ce9fabbe0c513ad6c3a58
      LANGFUSE_INIT_USER_EMAIL: admin@deeds-legal.ai
      LANGFUSE_INIT_USER_NAME: Admin
      LANGFUSE_INIT_USER_PASSWORD: admin123
    networks:
      - default
      - deeds-bridge
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/public/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Data Mirror Service - Syncs Postgres/Qdrant → ClickHouse with Ollama auto-tagging
  clickhouse-mirror:
    build:
      context: ./clickhouse-mirror
      dockerfile: Dockerfile
    container_name: clickhouse-mirror
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      POSTGRES_URL: postgresql://user:pass@172.23.32.1:5434/legal
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"  # Internal Docker network port
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse_password
      OLLAMA_URL: http://172.23.32.1:11434
      OLLAMA_MODEL: gemma3-legal:latest
      SYNC_INTERVAL: "60"  # Sync every 60 seconds
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  deeds-bridge:
    external: true

volumes:
  clickhouse-data:
    name: langfuse-clickhouse-data

