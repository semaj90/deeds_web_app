# Langfuse v3 — LLM Observability with ClickHouse
# Integrates with: Neo4j (traceGraph), RabbitMQ (traceQueue), Ollama (traceLLM/traceEmbedding)
# Reuses existing: deeds-postgres-prod, deeds-redis-prod, phase66-minio
# Only adds: ClickHouse + Langfuse Web + Langfuse Worker
# Usage: docker compose -f docker/langfuse.yml up -d

services:
  # ClickHouse — OLAP store for traces/observations/scores (required by Langfuse v3)
  langfuse-clickhouse:
    image: clickhouse/clickhouse-server
    container_name: langfuse-clickhouse
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse_langfuse
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    ports:
      - "127.0.0.1:8124:8123"   # HTTP (8124 to avoid conflicts)
      - "127.0.0.1:9009:9000"   # Native (9009 to avoid MinIO on 9000)
    networks:
      - default
      - deeds-bridge
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # Langfuse Worker — async trace processing
  langfuse-worker:
    image: langfuse/langfuse-worker:3
    container_name: langfuse-worker
    restart: unless-stopped
    depends_on:
      langfuse-clickhouse:
        condition: service_healthy
    environment: &langfuse-env
      # Postgres (metadata) — reuses existing deeds-postgres-prod
      DATABASE_URL: postgresql://legal_admin:123456@deeds-postgres-prod:5432/langfuse?connect_timeout=10&pool_timeout=10

      # ClickHouse (traces/observations/scores)
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:clickhouse_langfuse@langfuse-clickhouse:9000
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse_langfuse
      CLICKHOUSE_CLUSTER_ENABLED: "false"

      # S3/MinIO — reuses existing phase66-minio
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: admin
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: password
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://phase66-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: admin
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: password
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://phase66-minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      LANGFUSE_USE_AZURE_BLOB: "false"

      # Redis — reuses existing deeds-redis-prod (no auth)
      REDIS_HOST: deeds-redis-prod
      REDIS_PORT: "6379"
      # REDIS_AUTH not set — deeds-redis-prod has no auth
      REDIS_TLS_ENABLED: "false"

      # Server
      NEXTAUTH_URL: http://localhost:3030
      SALT: langfuse-salt-change-in-production
      ENCRYPTION_KEY: 8754be3c748398a38dd9a797fbb84747cb8b94d34dd15a2d5237851dbbe1b671

      # Telemetry
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "true"
    networks:
      - default
      - deeds-bridge
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # Langfuse Web — UI + API on port 3030
  langfuse-web:
    image: langfuse/langfuse:3
    container_name: langfuse-server
    restart: unless-stopped
    depends_on:
      langfuse-clickhouse:
        condition: service_healthy
    ports:
      - "3030:3000"
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: langfuse-secret-key-change-in-production-min-32-chars

      # Auto-seed project with API keys (first boot only)
      LANGFUSE_INIT_ORG_ID: deeds-legal-ai
      LANGFUSE_INIT_ORG_NAME: Deeds Legal AI
      LANGFUSE_INIT_PROJECT_ID: deeds-observability
      LANGFUSE_INIT_PROJECT_NAME: Deeds LLM Observability
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-4e3db8a0107de7872b894e309494252b
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-3941aba7500ce9fabbe0c513ad6c3a58
      LANGFUSE_INIT_USER_EMAIL: admin@deeds-legal.ai
      LANGFUSE_INIT_USER_NAME: Admin
      LANGFUSE_INIT_USER_PASSWORD: admin123
    networks:
      - default
      - deeds-bridge
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://$(hostname):3000/api/public/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

networks:
  deeds-bridge:
    external: true

volumes:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:

# ARCHITECTURE (v3 — ClickHouse + existing infra):
#   Langfuse Web (Port 3030) ──→ Langfuse Worker (async processing)
#     ├── deeds-postgres-prod (metadata, langfuse DB)
#     ├── langfuse-clickhouse (traces/observations/scores)
#     ├── deeds-redis-prod (cache/queues, no auth)
#     └── phase66-minio (S3 event/media upload, langfuse bucket)
#
#   SDK Trace Wrappers (in SvelteKit — langfuse.ts):
#     traceLLM()        → Ollama inference calls
#     traceEmbedding()  → embeddinggemma/nomic embedding calls
#     traceRAG()        → Qdrant vector search + retrieval pipeline
#     traceGraph()      → Neo4j knowledge graph queries
#     traceQueue()      → RabbitMQ publish/consume operations
#     traceDB()         → PostgreSQL database queries
#     traceCache()      → Redis cache operations
#     traceCouchDB()    → CouchDB document operations
#     traceWorker()     → Worker thread operations
#     traceVectorSearch() → Qdrant direct search calls
#
# USAGE:
#   docker compose -f docker/langfuse.yml up -d
#   UI: http://localhost:3030 (admin@deeds-legal.ai / admin123)
#   Keys auto-seeded via LANGFUSE_INIT_PROJECT_* env vars
#
# COMMANDS:
#   Start: docker compose -f docker/langfuse.yml up -d
#   Stop:  docker compose -f docker/langfuse.yml down
#   Logs:  docker compose -f docker/langfuse.yml logs -f langfuse-server
#   CH:    docker compose -f docker/langfuse.yml logs -f langfuse-clickhouse