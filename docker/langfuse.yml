# SELECT name, avg(latency) FROM langfuse.traces GROUP BY name ORDER BY avg(latency) DESC LIMIT 10
#
# # Neo4j: Agent interaction graph
# MATCH (a1:Agent)-[r:CALLED]->(a2:Agent) RETURN a1, r, a2
#
# 🐳 COMMANDS:
# - Start: docker-compose -f docker/langfuse.yml up -d
