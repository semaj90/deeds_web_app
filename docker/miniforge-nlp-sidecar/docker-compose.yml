services:
  miniforge-nlp-sidecar:
    build:
      context: ../..
      dockerfile: docker/miniforge-nlp-sidecar/Dockerfile
    image: deeds-miniforge-nlp-sidecar:latest
    container_name: miniforge-nlp-sidecar
    ports:
      - "8095:8095"
    networks:
      - default
      - legal-ai-network
    volumes:
      - ../..:/workspace:ro
      # Source-only changes are visible without rebuilding the dependency image.
      - ../../python:/app/python:ro
      # Domain-classifier checkpoint (openspec/changes/parent-atlas-search-classifier-sidecar):
      # trained offline by python/train_domain_classifier.py (run on the host, outside this
      # container), read-only mount so the sidecar can load it without a rebuild.
      - ../../models/domain-classifier:/models/domain-classifier:ro
    environment:
      MINIFORGE_SIDECAR_HOST: 0.0.0.0
      MINIFORGE_SIDECAR_PORT: 8095
      LANGEXTRACT_URL: http://127.0.0.1:8095
      MINIFORGE_SIDECAR_URL: http://127.0.0.1:8095
      NLP_SIDECAR_URL: http://127.0.0.1:8095
      LANGEXTRACT_RUNTIME: official
      # The embedding model server runs on the Windows host, same as LLAMA_SERVER_URL below —
      # 127.0.0.1 inside this container would NOT reach the host's Ollama instance.
      OLLAMA_URL: http://host.docker.internal:11434
      DOMAIN_CLASSIFIER_CHECKPOINT_PATH: /models/domain-classifier/checkpoint.joblib
      LANGEXTRACT_PROVIDER: ${LANGEXTRACT_PROVIDER:-openai}
      LANGEXTRACT_MODEL: ${LANGEXTRACT_MODEL_ID:-ornith-1.5-9b}
      LANGEXTRACT_MODEL_ID: ${LANGEXTRACT_MODEL_ID:-ornith-1.5-9b}
      # The model server runs on the Windows host. Do not allow a .env value
      # of 127.0.0.1 to redirect container-local LangExtract inference back to
      # the NLP sidecar itself.
      LANGEXTRACT_BASE_URL: http://host.docker.internal:8090/v1
      LANGEXTRACT_API_KEY: ${LANGEXTRACT_API_KEY:-local}
      LLAMA_SERVER_URL: http://host.docker.internal:8090/v1
      # Optional explicit read-only PostgreSQL OaK adapter. Keep empty by default;
      # production must provide a reviewed, revision-qualified locator explicitly.
      ATLAS_OAK_ADAPTER: ${ATLAS_OAK_ADAPTER:-}
      UVICORN_LOG_LEVEL: info
      # Dev-only: python/ is bind-mounted above, but uvicorn does not pick up source
      # edits without --reload (found live 2026-09-03 -- a bind-mounted change was
      # silently invisible until a manual `docker restart`). Opt in with
      # UVICORN_RELOAD=true in .env for local dev; stays off by default so this
      # compose file's behavior is unchanged for anyone not opting in.
      UVICORN_RELOAD: ${UVICORN_RELOAD:-false}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request, json; r = urllib.request.urlopen('http://localhost:8095/health', timeout=5); payload = json.loads(r.read().decode('utf-8')); sys.exit(0 if r.status == 200 and payload.get('status') == 'ok' else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

networks:
  legal-ai-network:
    external: true
    name: deeds-web-app_legal-ai-network
