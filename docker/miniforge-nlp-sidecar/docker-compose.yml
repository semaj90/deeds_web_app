services:
  miniforge-nlp-sidecar:
    build:
      context: ../..
      dockerfile: docker/miniforge-nlp-sidecar/Dockerfile
    image: deeds-miniforge-nlp-sidecar:latest
    container_name: miniforge-nlp-sidecar
    ports:
      - "8095:8095"
    volumes:
      - ../..:/workspace:ro
    environment:
      MINIFORGE_SIDECAR_HOST: 0.0.0.0
      MINIFORGE_SIDECAR_PORT: 8095
      LANGEXTRACT_URL: http://127.0.0.1:8095
      MINIFORGE_SIDECAR_URL: http://127.0.0.1:8095
      NLP_SIDECAR_URL: http://127.0.0.1:8095
      LANGEXTRACT_RUNTIME: official
      LANGEXTRACT_PROVIDER: ${LANGEXTRACT_PROVIDER:-openai}
      LANGEXTRACT_MODEL: ${LANGEXTRACT_MODEL_ID:-ornith-1.5-9b}
      LANGEXTRACT_MODEL_ID: ${LANGEXTRACT_MODEL_ID:-ornith-1.5-9b}
      # The model server runs on the Windows host. Do not allow a .env value
      # of 127.0.0.1 to redirect container-local LangExtract inference back to
      # the NLP sidecar itself.
      LANGEXTRACT_BASE_URL: http://host.docker.internal:8090/v1
      LANGEXTRACT_API_KEY: ${LANGEXTRACT_API_KEY:-local}
      LLAMA_SERVER_URL: http://host.docker.internal:8090/v1
      UVICORN_LOG_LEVEL: info
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request, json; r = urllib.request.urlopen('http://localhost:8095/health', timeout=5); payload = json.loads(r.read().decode('utf-8')); sys.exit(0 if r.status == 200 and payload.get('status') == 'ok' else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
