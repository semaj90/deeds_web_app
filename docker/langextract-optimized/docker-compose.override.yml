version: '3.9'

# Optimized LangExtract Override
# Usage: docker-compose -f docker-compose.deeds.yml -f docker/langextract-optimized/docker-compose.override.yml up -d langextract

services:
  langextract-optimized:
    build:
      context: ./docker/langextract-optimized
      dockerfile: Dockerfile
    image: deeds-langextract-optimized:latest
    container_name: langextract-optimized
    ports:
      - "8095:8095"
    environment:
      - LANGEXTRACT_PROVIDER=openai
      - LANGEXTRACT_MODEL_ID=ornith-1.5-9b
      - LANGEXTRACT_BASE_URL=http://host.docker.internal:8090/v1
      - LANGEXTRACT_API_KEY=local
      - LLAMA_SERVER_URL=http://host.docker.internal:8090/v1
      - SPACY_MODEL=en_core_web_md
      - ENABLE_SPACY=true
    deploy:
      resources:
        limits:
          memory: 512M  # Down from 1.5GB
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; r = urllib.request.urlopen('http://localhost:8095/health', timeout=5); sys.exit(0 if r.status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

volumes: {}
