# Local trace path for OMR-OTEL-01. Receives OTLP from the dev app and forwards traces to Jaeger.
# Metadata only: the app exporter emits spans with IDs, status and digests, not prompt bodies or source code.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch: {}

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger]
