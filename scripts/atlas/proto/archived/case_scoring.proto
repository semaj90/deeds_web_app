syntax = "proto3";

package legal_ai.case_scoring;

option go_package = "legal-ai-production/proto/case_scoring";

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

// Case Scoring Service for AI-powered case evaluation with binary protocol optimization
service CaseScoringService {
  // Single case scoring with binary optimized request/response
  rpc ScoreCase(CaseScoringRequest) returns (CaseScoringResponse);

  // Stream multiple cases for batch scoring (60% performance improvement target)
  rpc StreamCaseScoring(stream CaseScoringRequest) returns (stream CaseScoringResponse);

  // Real-time scoring updates during evidence processing
  rpc StreamScoringUpdates(ScoringSubscriptionRequest) returns (stream ScoringUpdate);

  // Historical scoring data retrieval
  rpc GetScoringHistory(ScoringHistoryRequest) returns (ScoringHistoryResponse);

  // Comparative analysis across multiple cases
  rpc CompareCaseScores(ComparativeScoringRequest) returns (ComparativeScoringResponse);
}

// Core Scoring Messages
message CaseScoringRequest {
  string case_id = 1;
  bytes case_metadata = 2; // Binary serialized case data for efficiency
  ScoringCriteria criteria = 3;
  ScoringParameters parameters = 4;
  google.protobuf.Timestamp request_time = 5;
  string requester_id = 6;
  Priority priority = 7;
}

message CaseScoringResponse {
  string case_id = 1;
  int32 score = 2; // 0-100 scale
  float confidence = 3; // 0.0-1.0 confidence level
  ScoringCriteria detailed_scores = 4;
  bytes ai_analysis = 5; // Binary encoded AI analysis for efficiency
  repeated Recommendation recommendations = 6;
  ScoringMetadata metadata = 7;
  google.protobuf.Timestamp scoring_date = 8;
}

// Scoring Criteria (matching TypeScript interface)
message ScoringCriteria {
  float evidence_strength = 1;
  float witness_reliability = 2;
  float legal_precedent = 3;
  float public_interest = 4;
  float case_complexity = 5;
  float resource_requirements = 6;
  // Additional custom criteria as binary map for extensibility
  map<string, float> custom_criteria = 7;
}

message ScoringParameters {
  string model = 1; // e.g., "gemma3-legal"
  float temperature = 2;
  int32 max_tokens = 3;
  bool use_cached_embeddings = 4; // Enable binary embedding cache
  bool enable_streaming = 5; // Enable real-time streaming updates
  CompressionType compression = 6; // Binary compression type
}

// Real-time Streaming Messages
message ScoringSubscriptionRequest {
  repeated string case_ids = 1;
  repeated ScoringEventType event_types = 2;
  bool include_partial_updates = 3;
  google.protobuf.Duration update_interval = 4;
}

message ScoringUpdate {
  string case_id = 1;
  ScoringEventType event_type = 2;
  oneof update {
    PartialScore partial_score = 3;
    CriteriaUpdate criteria_update = 4;
    RecommendationUpdate recommendation_update = 5;
    ProcessingStatus processing_status = 6;
  }
  google.protobuf.Timestamp timestamp = 7;
  int64 sequence_number = 8; // For ordered streaming
}

message PartialScore {
  int32 current_score = 1;
  float completion_percentage = 2;
  repeated string completed_criteria = 3;
  repeated string pending_criteria = 4;
}

message CriteriaUpdate {
  string criteria_name = 1;
  float old_value = 2;
  float new_value = 3;
  string reason = 4;
  float impact_on_total = 5;
}

message RecommendationUpdate {
  RecommendationType type = 1;
  string recommendation = 2;
  float priority_score = 3;
  repeated string affected_criteria = 4;
}

message ProcessingStatus {
  ProcessingPhase phase = 1;
  float progress = 2;
  google.protobuf.Duration estimated_remaining = 3;
  repeated string completed_steps = 4;
}

// Historical Analysis Messages
message ScoringHistoryRequest {
  string case_id = 1;
  google.protobuf.Timestamp start_date = 2;
  google.protobuf.Timestamp end_date = 3;
  bool include_detailed_analysis = 4;
  int32 max_results = 5;
}

message ScoringHistoryResponse {
  string case_id = 1;
  repeated HistoricalScore scores = 2;
  ScoreTrend trend_analysis = 3;
  repeated SignificantChange significant_changes = 4;
  ScoringStatistics statistics = 5;
}

message HistoricalScore {
  int32 score = 1;
  float confidence = 2;
  ScoringCriteria criteria = 3;
  google.protobuf.Timestamp timestamp = 4;
  string scorer_id = 5;
  string model_version = 6;
  bytes compressed_analysis = 7; // Compressed for historical storage
}

message ScoreTrend {
  TrendDirection direction = 1;
  float average_change = 2;
  int32 peak_score = 3;
  int32 lowest_score = 4;
  google.protobuf.Timestamp peak_date = 5;
  google.protobuf.Timestamp lowest_date = 6;
  repeated TrendPoint trend_points = 7;
}

message TrendPoint {
  google.protobuf.Timestamp timestamp = 1;
  int32 score = 2;
  string event_description = 3;
}

message SignificantChange {
  google.protobuf.Timestamp timestamp = 1;
  int32 score_change = 2;
  string trigger_event = 3;
  repeated string affected_criteria = 4;
  float significance_score = 5;
}

message ScoringStatistics {
  float mean_score = 1;
  float median_score = 2;
  float standard_deviation = 3;
  int32 total_scorings = 4;
  map<string, float> criteria_averages = 5;
}

// Comparative Analysis Messages
message ComparativeScoringRequest {
  repeated string case_ids = 1;
  ComparisonType comparison_type = 2;
  repeated string comparison_criteria = 3;
  bool include_visualizations = 4; // Binary visualization data
}

message ComparativeScoringResponse {
  repeated CaseComparison comparisons = 1;
  ComparisonSummary summary = 2;
  bytes visualization_data = 3; // Binary chart/graph data
  repeated ComparisonInsight insights = 4;
}

message CaseComparison {
  string case_id = 1;
  int32 score = 2;
  ScoringCriteria criteria = 3;
  int32 rank = 4;
  float percentile = 5;
  repeated string strengths = 6;
  repeated string weaknesses = 7;
}

message ComparisonSummary {
  string highest_scoring_case = 1;
  string lowest_scoring_case = 2;
  float average_score = 3;
  map<string, float> criteria_correlations = 4;
  repeated string common_patterns = 5;
}

message ComparisonInsight {
  string insight_type = 1;
  string description = 2;
  repeated string affected_cases = 3;
  float confidence = 4;
  string recommendation = 5;
}

// Supporting Messages
message Recommendation {
  string text = 1;
  RecommendationType type = 2;
  float priority = 3;
  repeated string supporting_evidence = 4;
  EstimatedImpact impact = 5;
}

message EstimatedImpact {
  int32 potential_score_change = 1;
  google.protobuf.Duration implementation_time = 2;
  float success_probability = 3;
  repeated string affected_criteria = 4;
}

message ScoringMetadata {
  string model_name = 1;
  string model_version = 2;
  int64 processing_time_ms = 3;
  int32 tokens_used = 4;
  float temperature_used = 5;
  bool used_cache = 6;
  CompressionStats compression_stats = 7;
  PerformanceMetrics performance = 8;
}

message CompressionStats {
  int64 original_size_bytes = 1;
  int64 compressed_size_bytes = 2;
  float compression_ratio = 3;
  CompressionType type = 4;
}

message PerformanceMetrics {
  int64 ai_inference_ms = 1;
  int64 database_query_ms = 2;
  int64 serialization_ms = 3;
  int64 network_latency_ms = 4;
  int64 total_processing_ms = 5;
  float throughput_cases_per_second = 6;
}

// Risk Assessment (extension of scoring)
message RiskAssessment {
  RiskLevel overall_risk = 1;
  repeated RiskFactor risk_factors = 2;
  float risk_score = 3;
  repeated Mitigation mitigations = 4;
}

message RiskFactor {
  string factor_name = 1;
  float severity = 2;
  float likelihood = 3;
  string description = 4;
  repeated string evidence_references = 5;
}

message Mitigation {
  string strategy = 1;
  float effectiveness = 2;
  google.protobuf.Duration implementation_time = 3;
  repeated string resources_required = 4;
}

// Enums
enum Priority {
  PRIORITY_LOW = 0;
  PRIORITY_NORMAL = 1;
  PRIORITY_HIGH = 2;
  PRIORITY_URGENT = 3;
  PRIORITY_CRITICAL = 4;
}

enum CompressionType {
  NONE = 0;
  GZIP = 1;
  ZSTD = 2;
  LZ4 = 3;
  BROTLI = 4;
}

enum ScoringEventType {
  SCORING_STARTED = 0;
  CRITERIA_EVALUATED = 1;
  AI_ANALYSIS_COMPLETE = 2;
  RECOMMENDATIONS_GENERATED = 3;
  SCORING_COMPLETE = 4;
  SCORING_FAILED = 5;
  PARTIAL_UPDATE = 6;
}

enum ProcessingPhase {
  INITIALIZATION = 0;
  DATA_VALIDATION = 1;
  AI_ANALYSIS = 2;
  CRITERIA_CALCULATION = 3;
  RECOMMENDATION_GENERATION = 4;
  FINALIZATION = 5;
}

enum RecommendationType {
  EVIDENCE_COLLECTION = 0;
  WITNESS_PREPARATION = 1;
  LEGAL_RESEARCH = 2;
  STRATEGY_ADJUSTMENT = 3;
  RESOURCE_ALLOCATION = 4;
  RISK_MITIGATION = 5;
  SETTLEMENT_CONSIDERATION = 6;
}

enum TrendDirection {
  STABLE = 0;
  IMPROVING = 1;
  DECLINING = 2;
  VOLATILE = 3;
}

enum ComparisonType {
  SCORE_BASED = 0;
  CRITERIA_BASED = 1;
  TEMPORAL = 2;
  JURISDICTION = 3;
  CASE_TYPE = 4;
}

enum RiskLevel {
  RISK_MINIMAL = 0;
  RISK_LOW = 1;
  RISK_MODERATE = 2;
  RISK_HIGH = 3;
  RISK_CRITICAL = 4;
}

// Batch Processing Messages (for enterprise scale)
message BatchScoringRequest {
  repeated CaseScoringRequest requests = 1;
  BatchProcessingOptions options = 2;
  google.protobuf.Timestamp deadline = 3;
}

message BatchScoringResponse {
  repeated CaseScoringResponse responses = 1;
  BatchProcessingStats stats = 2;
  repeated ProcessingError errors = 3;
}

message BatchProcessingOptions {
  int32 parallel_workers = 1;
  bool fail_fast = 2;
  int32 retry_attempts = 3;
  google.protobuf.Duration timeout_per_case = 4;
  bool use_gpu_acceleration = 5;
}

message BatchProcessingStats {
  int32 total_cases = 1;
  int32 successful_cases = 2;
  int32 failed_cases = 3;
  google.protobuf.Duration total_processing_time = 4;
  float average_score = 5;
  PerformanceMetrics aggregate_performance = 6;
}

message ProcessingError {
  string case_id = 1;
  string error_code = 2;
  string error_message = 3;
  google.protobuf.Timestamp timestamp = 4;
  bool retryable = 5;
}