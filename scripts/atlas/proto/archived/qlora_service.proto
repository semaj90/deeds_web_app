syntax = "proto3";

package qlora;
option cc_generic_services = true;

// Training batch data
message TrainingBatch {
  repeated float input_ids = 1;
  repeated float labels = 2;
  int32 batch_size = 3;
  int32 seq_length = 4;
}

// Training metrics
message TrainingMetrics {
  float loss = 1;
  double tokens_processed = 2;
  double tokens_per_second = 3;
  double elapsed_seconds = 4;
  int32 current_step = 5;
}

// Training configuration
message TrainingConfig {
  string model_name = 1;
  int32 lora_r = 2;
  int32 lora_alpha = 3;
  float learning_rate = 4;
  int32 max_steps = 5;
  int32 batch_size = 6;
}

// Training status
message TrainingStatus {
  enum Status {
    IDLE = 0;
    TRAINING = 1;
    PAUSED = 2;
    COMPLETED = 3;
    ERROR = 4;
  }
  Status status = 1;
  string message = 2;
  TrainingMetrics metrics = 3;
}

// Empty message for requests without parameters
message Empty {}

// Training service
service QLoRATrainer {
  // Start training with configuration
  rpc StartTraining(TrainingConfig) returns (TrainingStatus);

  // Submit training batch
  rpc SubmitBatch(TrainingBatch) returns (TrainingMetrics);

  // Get current training status
  rpc GetStatus(Empty) returns (TrainingStatus);

  // Pause training
  rpc PauseTraining(Empty) returns (TrainingStatus);

  // Resume training
  rpc ResumeTraining(Empty) returns (TrainingStatus);

  // Stop training
  rpc StopTraining(Empty) returns (TrainingStatus);

  // Stream training metrics
  rpc StreamMetrics(Empty) returns (stream TrainingMetrics);
}