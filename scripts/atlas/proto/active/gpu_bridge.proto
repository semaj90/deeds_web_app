syntax = "proto3";

package gpubridge;

enum RepresentationKind {
  REPRESENTATION_KIND_UNSPECIFIED = 0;
  SEMANTIC_768 = 1;
  MRL_512 = 2;
  MRL_256 = 3;
  MRL_128 = 4;
  LATENT_256 = 5;
  LATENT_128 = 6;
  LATENT_64 = 7;
}

// LibTorch/CUDA N-API operations. Requires tensorrt_bridge.node.
// Separate from TurboVecService (ANN index) — these are matrix/GPU workloads.
service GpuBridgeService {
  rpc Health (HealthRequest) returns (HealthResponse);
  rpc EncodeLatentBundle (LatentEncodeRequest) returns (LatentEncodeResponse);

  // Batch cosine similarity: one query vs N flattened candidate vectors
  rpc BatchCosine (BatchCosineRequest) returns (BatchCosineResponse);

  // Project vectors through the 768→64 autoencoder (SOM latent encoding)
  rpc EncodeLatent (EncodeLatentRequest) returns (EncodeLatentResponse);

  // Assign vectors to SOM BMU cluster IDs
  rpc AssignSom (AssignSomRequest) returns (AssignSomResponse);
}

message HealthRequest {}
message HealthResponse {
  bool ok = 1;
  string backend = 2;
  uint32 indexed_count = 3;
  string active_kmeans_revision = 4;
}

message LatentEncodeRequest {
  repeated float semantic_768 = 1; // Strictly 768 floats
  repeated float mrl_128 = 2;      // Strictly 128 floats
}

message LatentEncodeResponse {
  repeated float latent_256 = 1;
  repeated float latent_128 = 2;
  repeated float latent_64 = 3;
  int32 kmeans_cluster_id = 4;
  int32 nes_lut_byte = 5;
  string kmeans_revision = 6;
}

// ── BatchCosine ───────────────────────────────────────────────────────────────

message BatchCosineRequest {
  repeated float query_vector = 1;       // single dim-dimensional query
  repeated float candidate_vectors = 2;  // flattened N x dim candidates
  int32 candidate_count = 3;             // N
  int32 dim = 4;                         // vector dimension (default 768)
}

message BatchCosineResponse {
  repeated float scores = 1;  // N cosine similarity scores
  int32 count = 2;
}

// ── EncodeLatent ──────────────────────────────────────────────────────────────

message EncodeLatentRequest {
  repeated float vectors = 1;  // flattened N x in_dim
  int32 count = 2;
  int32 in_dim = 3;            // input dimension (default 768)
  int32 out_dim = 4;           // latent dimension (default 64)
}

message EncodeLatentResponse {
  repeated float encoded = 1;  // flattened N x out_dim
  int32 count = 2;
  int32 out_dim = 3;
}

// ── AssignSom ─────────────────────────────────────────────────────────────────

message AssignSomRequest {
  repeated float vectors = 1;  // flattened N x 768
  int32 count = 2;
}

message AssignSomResponse {
  repeated int32 cluster_ids = 1;  // BMU cluster per vector
  repeated float bmu_scores = 2;   // distance to BMU centroid
}
