services:
  caddy-quic:
    image: caddy:latest
    container_name: legal-ai-caddy-quic
    restart: unless-stopped
    ports:
      - "8443:8443/tcp"
      - "8443:8443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  caddy_data:
  caddy_config:
