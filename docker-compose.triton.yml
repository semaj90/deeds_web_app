# Docker Compose for Legal AI with NVIDIA Triton Inference Server
# Optimized for RTX 3060 with TensorRT acceleration

version: '3.8'

services:
  # NVIDIA Triton Inference Server with TRT-LLM backend
  # Gemma 3 12B INT4 AWQ (primary) + SigLIP vision (VLM)
  triton-legal-ai:
    image: nvcr.io/nvidia/tritonserver:24.10-trtllm-python-py3
    container_name: triton-legal-ai
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - CUDA_LAUNCH_BLOCKING=0
    ports:
      - "8099:8000"  # HTTP — matches TRTLLMClient (PUBLIC_TRT_LLM_ENDPOINT)
      - "8098:8001"  # gRPC
      - "8097:8002"  # Metrics (Prometheus)
    volumes:
      - ./triton-models:/models:ro
      - ./triton-logs:/logs
    command: >
      tritonserver
        --model-repository=/models
        --strict-model-config=false
        --backend-config=tensorrtllm,batching_type=inflight_fused_batching
        --backend-config=tensorrtllm,max_queue_delay_microseconds=1000
        --log-verbose=1
        --log-info=true
        --log-warning=true
        --log-error=true
        --metrics-port=8002
        --allow-metrics=true
        --allow-gpu-metrics=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v2/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 8G
    networks:
      - triton-net

  # PostgreSQL with pgvector
  postgres-triton:
    image: pgvector/pgvector:pg17
    container_name: postgres-triton
    environment:
      POSTGRES_DB: legal_ai_db
      POSTGRES_USER: legal_admin
      POSTGRES_PASSWORD: 123456
    ports:
      - "5434:5432"
    volumes:
      - postgres_triton_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal_admin -d legal_ai_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - triton-net

  # Redis Cache for Triton results
  redis-triton:
    image: redis:7-alpine
    container_name: redis-triton
    command: redis-server --requirepass redis --maxmemory 2gb --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"
    volumes:
      - redis_triton_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - triton-net

  # Legal AI Gateway with Triton Client
  legal-gateway:
    build:
      context: .
      dockerfile: Dockerfile.triton-gateway
    container_name: legal-gateway
    ports:
      - "8080:8080"
    depends_on:
      triton-legal-ai:
        condition: service_healthy
      postgres-triton:
        condition: service_healthy
      redis-triton:
        condition: service_healthy
    environment:
      - TRITON_HTTP_ENDPOINT=triton-legal-ai:8000
      - TRITON_GRPC_ENDPOINT=triton-legal-ai:8001
      - DATABASE_URL=postgresql://legal_admin:123456@postgres-triton:5432/legal_ai_db
      - REDIS_URL=redis://:redis@redis-triton:6379
      - LOG_LEVEL=info
      - ENABLE_TRACING=true
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - triton-net

  # Prometheus for monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-triton
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - triton-net

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: grafana-triton
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=redis-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - prometheus
    networks:
      - triton-net

volumes:
  postgres_triton_data:
  redis_triton_data:
  prometheus_data:
  grafana_data:

networks:
  triton-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16