global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: 'advanced-ai-api'
    static_configs:
      - targets: ['advanced-ai-api:8001']
    scrape_interval: 5s
    metrics_path: '/metrics'

  - job_name: 'sveltekit-frontend'
    static_configs:
      - targets: ['sveltekit-frontend:3000']
    scrape_interval: 10s

  - job_name: 'ray-head'
    static_configs:
      - targets: ['ray-head:8265']
    scrape_interval: 15s

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 10s

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
    scrape_interval: 30s

  - job_name: 'minio'
    static_configs:
      - targets: ['minio:9000']
    scrape_interval: 30s
    metrics_path: '/minio/v2/metrics/cluster'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']