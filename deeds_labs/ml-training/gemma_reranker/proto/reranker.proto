syntax = "proto3";

package reranker;
option go_package = "legal-ai/gemma-reranker/proto";

service Reranker {
  // Rerank documents based on relevance to query using Gemma
  rpc RerankDocuments(RerankRequest) returns (RerankResponse);

  // Fuse vision and text embeddings using Gemma
  rpc FuseEmbeddings(FusionRequest) returns (FusionResponse);
}

message Document {
  string id = 1;
  string title = 2;
  string content = 3;
  repeated string tags = 4;
  map<string, string> metadata = 5;
}

message Embedding {
  repeated float values = 1;
  int32 dim = 2;
}

message RerankRequest {
  string query = 1;
  repeated Document documents = 2;
  int32 top_k = 3;
  map<string, string> parameters = 4;
}

message RankedDocument {
  Document document = 1;
  float score = 2;
  int32 rank = 3;
  string explanation = 4;
}

message RerankResponse {
  repeated RankedDocument ranked_documents = 1;
  string query = 2;
  int32 total_documents = 3;
  double processing_time_ms = 4;
}

message FusionRequest {
  repeated Embedding vision_embeddings = 1;
  repeated Embedding text_embeddings = 2;
  string fusion_method = 3;
  map<string, string> parameters = 4;
}

message FusionResponse {
  repeated Embedding fused_embeddings = 1;
  string fusion_method = 2;
  double processing_time_ms = 3;
  string model_version = 4;
}