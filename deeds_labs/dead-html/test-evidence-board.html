<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evidence Board Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 20px; border: 1px solid #ccc; }
        .success { color: green; }
        .error { color: red; }
        pre { background: #f5f5f5; padding: 10px; overflow: auto; }
    </style>
</head>
<body>
    <h1>Evidence Board Integration Test</h1>

    <div class="test-section">
        <h2>Test 1: Check Evidence Board Route</h2>
        <button onclick="testEvidenceBoard()">Test Evidence Board</button>
        <div id="result1"></div>
    </div>

    <div class="test-section">
        <h2>Test 2: Check Contextual Chat API</h2>
        <button onclick="testContextualChat()">Test Contextual Chat</button>
        <div id="result2"></div>
    </div>

    <div class="test-section">
        <h2>Test 3: Check Qdrant Collection</h2>
        <button onclick="testQdrant()">Test Qdrant</button>
        <div id="result3"></div>
    </div>

    <script>
        async function testEvidenceBoard() {
            const resultDiv = document.getElementById('result1');
            try {
                const response = await fetch('/cases/test-case-123/evidence');
                if (response.ok) {
                    const html = await response.text();
                    resultDiv.innerHTML = '<span class="success">✅ Evidence board route accessible</span>';
                } else {
                    resultDiv.innerHTML = '<span class="error">❌ Evidence board route failed: ' + response.status + '</span>';
                }
            } catch (error) {
                resultDiv.innerHTML = '<span class="error">❌ Error: ' + error.message + '</span>';
            }
        }

        async function testContextualChat() {
            const resultDiv = document.getElementById('result2');
            try {
                const response = await fetch('/api/ai/yorha/context-chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: 'test-user',
                        caseId: 'test-case',
                        message: 'Test message',
                        evidenceIds: []
                    })
                });
                const data = await response.json();
                if (response.ok) {
                    resultDiv.innerHTML = '<span class="success">✅ Contextual chat API working</span><pre>' + JSON.stringify(data, null, 2) + '</pre>';
                } else {
                    resultDiv.innerHTML = '<span class="error">❌ Contextual chat API failed: ' + response.status + '</span><pre>' + JSON.stringify(data, null, 2) + '</pre>';
                }
            } catch (error) {
                resultDiv.innerHTML = '<span class="error">❌ Error: ' + error.message + '</span>';
            }
        }

        async function testQdrant() {
            const resultDiv = document.getElementById('result3');
            try {
                const response = await fetch('http://localhost:6333/collections/phase72_evidence_embeddings');
                const data = await response.json();
                if (response.ok) {
                    resultDiv.innerHTML = '<span class="success">✅ Qdrant collection exists</span><pre>' + JSON.stringify(data, null, 2) + '</pre>';
                } else {
                    resultDiv.innerHTML = '<span class="error">❌ Qdrant collection issue: ' + response.status + '</span>';
                }
            } catch (error) {
                resultDiv.innerHTML = '<span class="error">❌ Error: ' + error.message + '</span>';
            }
        }
    </script>
</body>
</html>
