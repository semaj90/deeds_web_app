[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langextract"
version = "0.1.0"
description = "Text extraction and error self-healing service for legal documents"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "YoRHa Legal AI", email = "dev@yorha-legal.ai"}
]

dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "pydantic>=2.0",
    "aiofiles>=23.2.1",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
]

[tool.setuptools]
packages = ["langextract"]
