syntax = "proto3";

package enhanced_rag.v1;

option go_package = "github.com/legal-ai/enhanced-rag/pkg/proto";

// Legal AI Enhanced RAG Service
// Optimized for legal document processing with embeddings

// Vector Search Request
message VectorSearchRequest {
  string user_id = 1;
  string query = 2;
  string search_type = 3; // "content", "cases", "evidence"
  float threshold = 4;
  int32 limit = 5;
  repeated float query_embedding = 6; // Optional pre-computed embedding
  map<string, string> filters = 7; // Additional filters
}

// Vector Search Result
message VectorSearchResult {
  string id = 1;
  string content = 2;
  string content_type = 3;
  float similarity_score = 4;
  string source = 5;
  map<string, string> metadata = 6;
  string case_id = 7;
  string evidence_id = 8;
}

// Vector Search Response
message VectorSearchResponse {
  repeated VectorSearchResult results = 1;
  SearchMetadata metadata = 2;
  bool success = 3;
  string error = 4;
}

// Citation Search Request
message CitationSearchRequest {
  string user_id = 1;
  string query = 2;
  string case_id = 3;
  string citation_type = 4; // "case", "statute", "regulation"
  int32 limit = 5;
}

// Citation Result
message CitationResult {
  string id = 1;
  string citation_type = 2;
  string formatted_citation = 3;
  string quoted_text = 4;
  string legal_principle = 5;
  float relevance_score = 6;
  bool is_key_authority = 7;
  string document_title = 8;
}

// Citation Search Response
message CitationSearchResponse {
  repeated CitationResult citations = 1;
  SearchMetadata metadata = 2;
  bool success = 3;
  string error = 4;
}

// Legal Statute Search Request
message StatuteSearchRequest {
  string user_id = 1;
  string query = 2;
  string jurisdiction = 3;
  string statute_type = 4; // "statutes", "precedents"
  string category = 5;
  int32 limit = 6;
}

// Legal Statute Result
message StatuteResult {
  string id = 1;
  string title = 2;
  string code = 3;
  string citation = 4;
  string description = 5;
  string summary = 6;
  string category = 7;
  string court = 8;
  string jurisdiction = 9;
  int32 year = 10;
  map<string, string> penalties = 11;
  repeated string legal_principles = 12;
  bool is_active = 13;
}

// Statute Search Response
message StatuteSearchResponse {
  repeated StatuteResult statutes = 1;
  SearchMetadata metadata = 2;
  bool success = 3;
  string error = 4;
}

// Embedding Generation Request
message EmbeddingRequest {
  string user_id = 1;
  string text = 2;
  string model = 3; // "embeddinggemma:latest", "nomic-embed-text"
  string content_type = 4; // "legal", "evidence", "general"
}

// Embedding Generation Response
message EmbeddingResponse {
  repeated float embedding = 1;
  int32 dimensions = 2;
  string model_used = 3;
  float processing_time_ms = 4;
  bool success = 5;
  string error = 6;
}

// Evidence Analysis Request
message EvidenceAnalysisRequest {
  string user_id = 1;
  string evidence_id = 2;
  string analysis_type = 3; // "forensic", "legal", "similarity"
  map<string, string> options = 4;
  bytes evidence_data = 5; // Optional binary data
}

// Evidence Analysis Response
message EvidenceAnalysisResponse {
  string evidence_id = 1;
  string analysis_type = 2;
  map<string, string> results = 3;
  float confidence_score = 4;
  repeated string extracted_entities = 5;
  repeated string key_findings = 6;
  bool success = 7;
  string error = 8;
}

// Search Metadata
message SearchMetadata {
  string query = 1;
  string search_type = 2;
  int32 result_count = 3;
  float threshold = 4;
  string source = 5; // "enhanced-rag", "database", "cache"
  float processing_time_ms = 6;
  string timestamp = 7;
  string model_used = 8;
}

// Health Check Request
message HealthCheckRequest {
  string service_name = 1;
}

// Health Check Response
message HealthCheckResponse {
  string status = 1; // "healthy", "degraded", "unhealthy"
  bool enhanced_rag_connected = 2;
  bool redis_connected = 3;
  bool postgres_connected = 4;
  bool ollama_connected = 5;
  float response_time_ms = 6;
  string version = 7;
  map<string, string> details = 8;
}

// Enhanced RAG Service Definition
service EnhancedRAGService {
  // Vector similarity search with streaming results
  rpc VectorSearch(VectorSearchRequest) returns (stream VectorSearchResult);

  // Batch vector search (non-streaming)
  rpc VectorSearchBatch(VectorSearchRequest) returns (VectorSearchResponse);

  // Legal citation search
  rpc SearchCitations(CitationSearchRequest) returns (CitationSearchResponse);

  // Legal statute and precedent search
  rpc SearchStatutes(StatuteSearchRequest) returns (StatuteSearchResponse);

  // Generate embeddings for text
  rpc GenerateEmbeddings(EmbeddingRequest) returns (EmbeddingResponse);

  // Analyze evidence with AI
  rpc AnalyzeEvidence(EvidenceAnalysisRequest) returns (EvidenceAnalysisResponse);

  // Health check
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);

  // Streaming health monitoring
  rpc HealthStream(HealthCheckRequest) returns (stream HealthCheckResponse);
}

// Batch Operations Service (for bulk processing)
service BatchOperationsService {
  // Batch embedding generation
  rpc BatchGenerateEmbeddings(stream EmbeddingRequest) returns (stream EmbeddingResponse);

  // Batch evidence analysis
  rpc BatchAnalyzeEvidence(stream EvidenceAnalysisRequest) returns (stream EvidenceAnalysisResponse);
}