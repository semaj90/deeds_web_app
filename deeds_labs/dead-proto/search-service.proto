syntax = "proto3";

package search_service;

option go_package = "github.com/legal-ai/proto/search";
option java_package = "com.legal_ai.proto.search";
option java_outer_classname = "SearchServiceProto";

// High-performance search service using protobuffers
// Optimized for 3-5x faster serialization vs JSON
service SearchService {
    // Multi-type search across cases, evidence, messages
    rpc Search(SearchRequest) returns (SearchResponse);

    // Streaming search for large result sets
    rpc StreamSearch(SearchRequest) returns (stream SearchResult);

    // Advanced search with filters and facets
    rpc AdvancedSearch(AdvancedSearchRequest) returns (SearchResponse);

    // Search suggestions/autocomplete
    rpc GetSuggestions(SuggestionsRequest) returns (SuggestionsResponse);

    // Search health check
    rpc Health(HealthRequest) returns (HealthResponse);
}

// Search Request
message SearchRequest {
    string query = 1;                          // Search query (min 2 chars)
    string type = 2;                           // Filter: "cases", "evidence", "messages", "all"
    string case_id = 3;                        // Optional: filter by case
    int32 limit = 4;                           // Results limit (default 20, max 100)
    int32 offset = 5;                          // Pagination offset
    map<string, string> filters = 6;           // Additional filters
    bool include_metadata = 7;                 // Include full metadata
}

// Individual Search Result
message SearchResult {
    string id = 1;
    string type = 2;                           // "case", "evidence", "message"
    string title = 3;
    string description = 4;
    string case_id = 5;
    float relevance_score = 6;
    int64 created_at = 7;                      // Unix timestamp
    map<string, string> metadata = 8;
    repeated string highlights = 9;            // Highlighted snippets
}

// Search Response
message SearchResponse {
    bool success = 1;
    repeated SearchResult results = 2;
    int32 total = 3;                           // Total results available
    int32 limit = 4;
    int32 offset = 5;
    int64 took_ms = 6;                         // Query execution time
    string error = 7;                          // Error message if failed
}

// Advanced Search Request
message AdvancedSearchRequest {
    string query = 1;
    repeated string types = 2;                 // Multiple types
    repeated string case_ids = 3;              // Multiple cases
    int64 date_from = 4;                       // Unix timestamp
    int64 date_to = 5;                         // Unix timestamp
    map<string, string> filters = 6;
    string sort_by = 7;                        // "relevance", "date", "title"
    string sort_order = 8;                     // "asc", "desc"
    int32 limit = 9;
    int32 offset = 10;
}

// Suggestions Request
message SuggestionsRequest {
    string query = 1;
    string type = 2;                           // Optional type filter
    int32 limit = 3;                           // Default 10
}

// Suggestions Response
message SuggestionsResponse {
    repeated string suggestions = 1;
    repeated string popular_searches = 2;
}

// Health Check
message HealthRequest {
    bool include_stats = 1;
}

message HealthResponse {
    string status = 1;                         // "healthy", "degraded", "unhealthy"
    int64 uptime_seconds = 2;
    int64 total_searches = 3;
    float avg_search_time_ms = 4;
    int32 indexed_documents = 5;
    string version = 6;
}

// Flatbuffer-compatible message for high-frequency data
message SearchResultBatch {
    repeated SearchResult results = 1;
    int64 batch_id = 2;
    int64 timestamp = 3;
}
