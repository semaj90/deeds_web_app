syntax = "proto3";

package legal_ai.tensors;

option go_package = "legal-ai-production/proto/tensors";

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

// Legal AI Tensor Service - eliminates stdin/stdout overhead with binary protocol
service LegalAITensorService {
  // Streaming inference with tensor support
  rpc StreamInference(stream InferenceRequest) returns (stream InferenceResponse);

  // Batch embedding generation with quantized tensors
  rpc StreamEmbedding(stream EmbeddingRequest) returns (stream EmbeddingResponse);

  // Vector similarity search with compressed tensors
  rpc StreamVectorSearch(stream VectorSearchRequest) returns (stream VectorSearchResponse);

  // Model management and switching
  rpc SwitchModel(ModelSwitchRequest) returns (ModelSwitchResponse);

  // Health check with performance metrics
  rpc GetServiceHealth(HealthRequest) returns (HealthResponse);
}

// Core tensor structures
message Tensor {
  TensorDType dtype = 1;
  repeated int32 shape = 2;

  oneof data {
    bytes raw_data = 3;           // Raw tensor bytes for maximum efficiency
    FloatTensorData float_data = 4;  // For float32 tensors
    IntTensorData int_data = 5;      // For quantized int8 tensors
  }

  CompressionInfo compression = 6;
  TensorMetadata metadata = 7;
}

message FloatTensorData {
  repeated float values = 1;    // Protobuf optimized float array
}

message IntTensorData {
  repeated int32 values = 1;    // For quantized embeddings
  float scale = 2;              // Quantization scale factor
  int32 zero_point = 3;         // Quantization zero point
}

message CompressionInfo {
  CompressionType type = 1;
  int64 original_size = 2;
  int64 compressed_size = 3;
  float compression_ratio = 4;
}

message TensorMetadata {
  string tensor_name = 1;
  string model_used = 2;
  bool is_quantized = 3;
  QuantizationType quantization_type = 4;
  google.protobuf.Timestamp created_at = 5;
}

// Inference Request/Response
message InferenceRequest {
  string request_id = 1;
  string prompt_text = 2;
  bytes prompt_tokens = 3;          // Pre-tokenized input

  InferenceParams params = 4;
  ModelSelection model = 5;
  bool enable_streaming = 6;
  CompressionType compression = 7;
}

message InferenceParams {
  float temperature = 1;
  int32 max_tokens = 2;
  float top_p = 3;
  int32 top_k = 4;
  repeated string stop_sequences = 5;
  bool use_quantized = 6;           // Use quantized model for speed
}

message ModelSelection {
  string model_name = 1;            // "embeddinggemma", "gemma3-legal:latest"
  bool auto_upgrade = 2;            // Upgrade to larger model if needed
  float complexity_threshold = 3;   // Threshold for auto-upgrade
  PreferredModel fallback = 4;
}

message InferenceResponse {
  string request_id = 1;
  bool is_final = 2;

  oneof response_data {
    string text_chunk = 3;          // For streaming text
    Tensor token_tensor = 4;        // For streaming tokens
    InferenceComplete completion = 5; // Final response
  }

  PerformanceMetrics metrics = 6;
  ModelInfo model_info = 7;
}

message InferenceComplete {
  string final_text = 1;
  int32 tokens_generated = 2;
  float confidence = 3;
  repeated LegalConcept extracted_concepts = 4;
  RiskAssessment risk_assessment = 5;
}

// Embedding Request/Response with quantization support
message EmbeddingRequest {
  string request_id = 1;
  repeated string texts = 2;        // Batch embedding support

  EmbeddingParams params = 3;
  bool return_quantized = 4;        // Return int8 quantized embeddings
  CompressionType compression = 5;
}

message EmbeddingParams {
  string model_name = 1;            // "embeddinggemma", "nomic-embed-text"
  bool normalize = 2;
  EmbeddingPooling pooling_strategy = 3;
  bool use_cache = 4;
}

message EmbeddingResponse {
  string request_id = 1;
  repeated Tensor embeddings = 2;   // One tensor per input text

  EmbeddingMetrics metrics = 3;
  ModelInfo model_info = 4;
}

message EmbeddingMetrics {
  int32 texts_processed = 1;
  int64 total_tokens = 2;
  float avg_similarity = 3;         // Average cosine similarity in batch
  google.protobuf.Duration processing_time = 4;

  // Performance comparisons
  int64 json_baseline_ms = 5;       // Baseline JSON performance
  int64 tensor_optimized_ms = 6;    // New tensor performance
  float improvement_percent = 7;    // Percentage improvement
}

// Vector Search Request/Response
message VectorSearchRequest {
  string request_id = 1;
  Tensor query_vector = 2;          // Query embedding as tensor

  VectorSearchParams params = 3;
  VectorDatabase target_db = 4;
}

message VectorSearchParams {
  int32 top_k = 1;
  float similarity_threshold = 2;
  DistanceMetric distance_metric = 3;
  bool return_embeddings = 4;       // Return full embeddings or just IDs
  repeated string filters = 5;      // Metadata filters
}

message VectorDatabase {
  string database_name = 1;         // "legal_cases", "precedents"
  string collection_name = 2;
  bool use_quantized_index = 3;     // Use quantized index for speed
}

message VectorSearchResponse {
  string request_id = 1;
  repeated VectorMatch matches = 2;

  SearchMetrics metrics = 3;
}

message VectorMatch {
  string document_id = 1;
  float similarity_score = 2;
  Tensor embedding = 3;             // Optional: full embedding
  LegalDocumentMetadata metadata = 4;
}

message SearchMetrics {
  int32 total_candidates = 1;
  int32 matches_returned = 2;
  google.protobuf.Duration search_time = 3;
  float avg_similarity = 4;
  IndexStats index_stats = 5;
}

message IndexStats {
  int64 total_vectors = 1;
  bool is_quantized = 2;
  float index_efficiency = 3;       // Query efficiency metric
}

// Model Management
message ModelSwitchRequest {
  string current_model = 1;
  string target_model = 2;          // "gemma3-legal:latest" for complex analysis
  SwitchReason reason = 3;
  bool preserve_cache = 4;
}

message ModelSwitchResponse {
  bool success = 1;
  string active_model = 2;
  ModelCapabilities capabilities = 3;
  LoadingMetrics loading_metrics = 4;
  string error_message = 5;
}

message ModelCapabilities {
  bool supports_streaming = 1;
  bool supports_quantization = 2;
  int32 context_window = 3;
  int32 embedding_dimensions = 4;
  repeated string supported_tasks = 5; // "inference", "embedding", "analysis"
  float legal_specialization_score = 6; // How specialized for legal tasks
}

message LoadingMetrics {
  google.protobuf.Duration model_load_time = 1;
  int64 memory_usage_mb = 2;
  int64 gpu_memory_mb = 3;
  float model_size_gb = 4;
}

// Health and Monitoring
message HealthRequest {
  bool include_performance = 1;
  bool include_model_info = 2;
}

message HealthResponse {
  ServiceStatus status = 1;
  repeated ModelInfo available_models = 2;
  SystemMetrics system_metrics = 3;
  PerformanceComparison performance = 4;
}

message SystemMetrics {
  float cpu_usage = 1;
  float memory_usage = 2;
  float gpu_usage = 3;
  float gpu_memory_usage = 4;
  int64 total_requests = 5;
  float avg_latency_ms = 6;
}

message PerformanceComparison {
  // JSON vs Binary Protocol Performance
  float json_avg_latency_ms = 1;
  float binary_avg_latency_ms = 2;
  float improvement_factor = 3;
  int64 total_data_saved_bytes = 4;  // Data saved through compression

  // Model performance comparisons
  repeated ModelPerformance model_stats = 5;
}

message ModelPerformance {
  string model_name = 1;
  float avg_inference_ms = 2;
  float avg_embedding_ms = 3;
  int64 memory_usage_mb = 4;
  float accuracy_score = 5;         // Legal task accuracy
}

// Supporting types
message ModelInfo {
  string model_name = 1;
  string version = 2;
  ModelType type = 3;
  ModelCapabilities capabilities = 4;
  bool is_loaded = 5;
  bool is_quantized = 6;
}

message LegalConcept {
  string concept_name = 1;
  float confidence = 2;
  repeated string related_cases = 3;
  ConceptType type = 4;
}

message RiskAssessment {
  float overall_risk = 1;
  RiskLevel level = 2;
  repeated string risk_factors = 3;
  repeated string mitigations = 4;
}

message LegalDocumentMetadata {
  string title = 1;
  string jurisdiction = 2;
  string legal_domain = 3;
  int32 year = 4;
  string court = 5;
  repeated string tags = 6;
  float complexity_score = 7;
}

// Enums
enum TensorDType {
  DTYPE_UNKNOWN = 0;
  DTYPE_FLOAT32 = 1;
  DTYPE_INT32 = 2;
  DTYPE_INT8 = 3;               // For quantized embeddings
  DTYPE_UINT8 = 4;
  DTYPE_FLOAT16 = 5;            // Half precision
}

enum CompressionType {
  COMPRESSION_NONE = 0;
  COMPRESSION_GZIP = 1;
  COMPRESSION_ZSTD = 2;         // Recommended for tensors
  COMPRESSION_LZ4 = 3;          // Fast compression
  COMPRESSION_BROTLI = 4;
}

enum QuantizationType {
  QUANTIZATION_NONE = 0;
  QUANTIZATION_INT8 = 1;        // 8-bit quantization
  QUANTIZATION_INT4 = 2;        // 4-bit quantization
  QUANTIZATION_DYNAMIC = 3;     // Dynamic quantization
}

enum PreferredModel {
  MODEL_FAST = 0;               // embeddinggemma, lightweight models
  MODEL_BALANCED = 1;           // Default gemma models
  MODEL_ACCURATE = 2;           // gemma3-legal:latest for complex tasks
}

enum EmbeddingPooling {
  POOLING_CLS = 0;             // Use CLS token
  POOLING_MEAN = 1;            // Mean pooling
  POOLING_MAX = 2;             // Max pooling
}

enum DistanceMetric {
  DISTANCE_COSINE = 0;
  DISTANCE_EUCLIDEAN = 1;
  DISTANCE_DOT_PRODUCT = 2;
}

enum ModelType {
  MODEL_INFERENCE = 0;          // Text generation
  MODEL_EMBEDDING = 1;          // Embedding generation
  MODEL_HYBRID = 2;             // Both inference and embedding
}

enum ServiceStatus {
  STATUS_HEALTHY = 0;
  STATUS_DEGRADED = 1;
  STATUS_UNHEALTHY = 2;
  STATUS_LOADING = 3;
}

enum SwitchReason {
  REASON_PERFORMANCE = 0;       // Switch for better performance
  REASON_COMPLEXITY = 1;        // Case requires more sophisticated analysis
  REASON_USER_REQUEST = 2;      // Explicit user request
  REASON_AUTOMATIC = 3;         // Automatic based on workload
}

enum ConceptType {
  CONCEPT_LEGAL_PRINCIPLE = 0;
  CONCEPT_CASE_LAW = 1;
  CONCEPT_STATUTE = 2;
  CONCEPT_REGULATION = 3;
  CONCEPT_PRECEDENT = 4;
}

enum RiskLevel {
  RISK_LOW = 0;
  RISK_MEDIUM = 1;
  RISK_HIGH = 2;
  RISK_CRITICAL = 3;
}

// Performance monitoring for Phase 5-7 targets
message PerformanceMetrics {
  google.protobuf.Duration total_time = 1;
  google.protobuf.Duration inference_time = 2;
  google.protobuf.Duration embedding_time = 3;
  google.protobuf.Duration vector_search_time = 4;

  int64 bytes_processed = 5;
  int64 bytes_transferred = 6;      // After compression
  float compression_ratio = 7;

  // Phase 5-7 improvement tracking
  int64 json_baseline_ms = 8;       // Original JSON performance
  int64 tensor_optimized_ms = 9;    // New tensor performance
  float improvement_percent = 10;   // Target: 60% improvement
  string protocol_used = 11;        // "gRPC-Tensor" vs "JSON-HTTP"
}