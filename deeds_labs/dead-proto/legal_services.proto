syntax = "proto3";
package yorha.legal;

option go_package = "github.com/yorha/legal-ai/proto/legal";

import "google/protobuf/timestamp.proto";
import "ingest.proto";
import "embedding.proto";

// Unified Legal AI Service - Main orchestrator
service LegalAIService {
  // Document processing workflow
  rpc ProcessLegalDocument(ProcessDocumentRequest) returns (ProcessDocumentResponse);
  
  // RAG query with legal context
  rpc QueryWithContext(ContextualQueryRequest) returns (ContextualQueryResponse);
  
  // Case analysis
  rpc AnalyzeCase(CaseAnalysisRequest) returns (CaseAnalysisResponse);
  
  // Entity relationship discovery
  rpc DiscoverEntities(EntityDiscoveryRequest) returns (EntityDiscoveryResponse);
  
  // System health and metrics
  rpc GetSystemHealth(SystemHealthRequest) returns (SystemHealthResponse);
}

message ProcessDocumentRequest {
  string document_id = 1;
  string case_id = 2;
  yorha.ingest.DocumentType document_type = 3;
  string minio_bucket = 4;
  string minio_key = 5;
  ProcessingOptions options = 6;
  map<string, string> metadata = 7;
}

message ProcessingOptions {
  bool extract_entities = 1;
  bool generate_summary = 2;
  bool create_embeddings = 3;
  bool update_knowledge_graph = 4;
  int32 chunk_size = 5;
  int32 chunk_overlap = 6;
  string embedding_model = 7;
}

message ProcessDocumentResponse {
  bool success = 1;
  string job_id = 2;
  string message = 3;
  ProcessingStats processing_stats = 4;
  repeated EntityExtraction extracted_entities = 5;
  DocumentSummary summary = 6;
}

message ProcessingStats {
  float total_time_seconds = 1;
  int32 chunks_created = 2;
  int32 entities_found = 3;
  int32 embeddings_generated = 4;
  int64 tokens_processed = 5;
}

message EntityExtraction {
  string name = 1;
  string type = 2; // case_party, statute, citation, jurisdiction, judge, contract_clause
  float confidence = 3;
  repeated EntityOccurrence occurrences = 4;
  map<string, string> attributes = 5;
}

message EntityOccurrence {
  int32 start_offset = 1;
  int32 end_offset = 2;
  string context = 3;
  int32 chunk_index = 4;
}

message DocumentSummary {
  string executive_summary = 1;
  repeated string key_points = 2;
  repeated string risk_factors = 3;
  repeated string recommendations = 4;
  float complexity_score = 5;
  string jurisdiction = 6;
}

message ContextualQueryRequest {
  string query = 1;
  string case_id = 2;
  repeated string document_ids = 3;
  QueryContext context = 4;
  QueryOptions options = 5;
}

message QueryContext {
  string jurisdiction = 1;
  string practice_area = 2;
  repeated string relevant_entities = 3;
  string temporal_context = 4; // dates, time periods relevant to query
  int32 max_context_chunks = 5;
}

message QueryOptions {
  float similarity_threshold = 1;
  int32 max_results = 2;
  bool include_entities = 3;
  bool include_summary = 4;
  bool use_knowledge_graph = 5;
  string response_style = 6; // legal_brief, summary, analysis, citation_list
}

message ContextualQueryResponse {
  string response = 1;
  repeated ContextChunk context_chunks = 2;
  repeated CitationReference citations = 3;
  repeated EntityMention mentioned_entities = 4;
  float confidence_score = 5;
  QueryMetadata metadata = 6;
}

message ContextChunk {
  string document_id = 1;
  string content = 2;
  float relevance_score = 3;
  int32 chunk_index = 4;
  map<string, string> metadata = 5;
}

message CitationReference {
  string citation_text = 1;
  string document_id = 2;
  string document_title = 3;
  int32 page_number = 4;
  string snippet = 5;
  string citation_type = 6; // case_law, statute, regulation, contract_clause
}

message EntityMention {
  string entity_name = 1;
  string entity_type = 2;
  float relevance = 3;
  repeated string relationships = 4;
}

message QueryMetadata {
  float processing_time = 1;
  int32 chunks_searched = 2;
  int32 entities_considered = 3;
  string model_used = 4;
  bool cache_hit = 5;
}

message CaseAnalysisRequest {
  string case_id = 1;
  repeated string document_ids = 2;
  AnalysisType analysis_type = 3;
  AnalysisOptions options = 4;
}

enum AnalysisType {
  ANALYSIS_TYPE_UNSPECIFIED = 0;
  RISK_ASSESSMENT = 1;
  COMPLIANCE_CHECK = 2;
  CONTRACT_REVIEW = 3;
  EVIDENCE_EVALUATION = 4;
  PRECEDENT_ANALYSIS = 5;
  TIMELINE_CONSTRUCTION = 6;
}

message AnalysisOptions {
  string jurisdiction = 1;
  repeated string focus_areas = 2;
  bool include_recommendations = 3;
  bool generate_timeline = 4;
  string output_format = 5; // structured, narrative, bullet_points
}

message CaseAnalysisResponse {
  CaseAnalysisResult analysis = 1;
  repeated Recommendation recommendations = 2;
  CaseTimeline timeline = 3;
  repeated RiskFactor risk_factors = 4;
  float overall_confidence = 5;
}

message CaseAnalysisResult {
  string summary = 1;
  repeated Finding findings = 2;
  repeated LegalIssue issues = 3;
  map<string, string> key_metrics = 4;
}

message Finding {
  string description = 1;
  float confidence = 2;
  repeated string supporting_documents = 3;
  string legal_basis = 4;
  FindingSeverity severity = 5;
}

enum FindingSeverity {
  FINDING_SEVERITY_UNSPECIFIED = 0;
  LOW = 1;
  MEDIUM = 2;
  HIGH = 3;
  CRITICAL = 4;
}

message LegalIssue {
  string issue_description = 1;
  string applicable_law = 2;
  repeated string precedents = 3;
  string recommended_action = 4;
  float urgency_score = 5;
}

message Recommendation {
  string title = 1;
  string description = 2;
  string rationale = 3;
  RecommendationPriority priority = 4;
  repeated string required_actions = 5;
  google.protobuf.Timestamp deadline = 6;
}

enum RecommendationPriority {
  RECOMMENDATION_PRIORITY_UNSPECIFIED = 0;
  LOW_PRIORITY = 1;
  MEDIUM_PRIORITY = 2;
  HIGH_PRIORITY = 3;
  URGENT = 4;
}

message CaseTimeline {
  repeated TimelineEvent events = 1;
  string narrative = 2;
  repeated string key_dates = 3;
}

message TimelineEvent {
  google.protobuf.Timestamp timestamp = 1;
  string description = 2;
  string event_type = 3;
  repeated string related_documents = 4;
  repeated string involved_parties = 5;
}

message RiskFactor {
  string description = 1;
  float probability = 2;
  float impact = 3;
  string mitigation_strategy = 4;
  repeated string related_findings = 5;
}

message EntityDiscoveryRequest {
  string case_id = 1;
  repeated string document_ids = 2;
  repeated string entity_types = 3; // filter by types
  DiscoveryOptions options = 4;
}

message DiscoveryOptions {
  int32 max_entities = 1;
  float min_confidence = 2;
  bool include_relationships = 3;
  bool generate_graph = 4;
  int32 relationship_depth = 5;
}

message EntityDiscoveryResponse {
  repeated DiscoveredEntity entities = 1;
  repeated EntityRelationship relationships = 2;
  EntityGraph graph = 3;
  DiscoveryMetrics metrics = 4;
}

message DiscoveredEntity {
  string id = 1;
  string name = 2;
  string type = 3;
  float confidence = 4;
  repeated EntityAttribute attributes = 5;
  repeated string document_mentions = 6;
  int32 mention_count = 7;
}

message EntityAttribute {
  string key = 1;
  string value = 2;
  float confidence = 3;
}

message EntityRelationship {
  string from_entity_id = 1;
  string to_entity_id = 2;
  string relationship_type = 3;
  float strength = 4;
  repeated string evidence_documents = 5;
  string description = 6;
}

message EntityGraph {
  repeated GraphNode nodes = 1;
  repeated GraphEdge edges = 2;
  map<string, string> metadata = 3;
}

message GraphNode {
  string id = 1;
  string label = 2;
  string type = 3;
  map<string, string> properties = 4;
}

message GraphEdge {
  string from = 1;
  string to = 2;
  string type = 3;
  float weight = 4;
  map<string, string> properties = 5;
}

message DiscoveryMetrics {
  int32 total_entities_found = 1;
  int32 total_relationships_found = 2;
  float processing_time = 3;
  map<string, int32> entities_by_type = 4;
  map<string, int32> relationships_by_type = 5;
}

message SystemHealthRequest {
  bool detailed = 1;
  repeated string services = 2; // filter by specific services
}

message SystemHealthResponse {
  bool overall_healthy = 1;
  repeated ServiceHealth services = 2;
  SystemMetrics metrics = 3;
  repeated string alerts = 4;
  google.protobuf.Timestamp last_updated = 5;
}

message ServiceHealth {
  string service_name = 1;
  bool healthy = 2;
  string status = 3;
  string version = 4;
  float uptime_seconds = 5;
  repeated string dependencies = 6;
  map<string, string> metrics = 7;
  repeated string recent_errors = 8;
}

message SystemMetrics {
  int64 total_documents_processed = 1;
  int64 total_queries_handled = 2;
  float average_response_time = 3;
  int64 cache_hit_ratio_percent = 4;
  int64 active_connections = 5;
  float cpu_usage_percent = 6;
  float memory_usage_percent = 7;
  float gpu_usage_percent = 8;
  int64 gpu_memory_used_bytes = 9;
  int64 gpu_memory_total_bytes = 10;
}