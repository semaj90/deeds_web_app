syntax = "proto3";

package legal_ai.qlora;

option go_package = "github.com/legal-ai/proto/qlora";

// ============================================================================
// Phase AST: QLoRA Training Microservice Protocol
// ============================================================================

service QLoRATrainer {
  // Start QLoRA training session
  rpc StartTraining(TrainingRequest) returns (TrainingSession);

  // Stream training progress and metrics
  rpc StreamTrainingProgress(TrainingSession) returns (stream TrainingProgress);

  // Stop training session
  rpc StopTraining(TrainingSession) returns (TrainingStatus);

  // Get training metrics and statistics
  rpc GetTrainingMetrics(TrainingSession) returns (TrainingMetrics);

  // Save trained adapter weights
  rpc SaveAdapter(SaveAdapterRequest) returns (SaveAdapterResponse);

  // Load adapter for inference
  rpc LoadAdapter(LoadAdapterRequest) returns (LoadAdapterResponse);

  // Health check for training service
  rpc HealthCheck(HealthRequest) returns (HealthResponse);
}

// Training configuration
message TrainingRequest {
  string model_name = 1;                    // Base model (e.g., "google/gemma-3-4b-it")
  string dataset_path = 2;                  // Path to training dataset
  QLoRAConfig qlora_config = 3;             // QLoRA hyperparameters
  TrainingConfig training_config = 4;       // Training parameters
  string output_dir = 5;                    // Output directory for checkpoints
  string experiment_name = 6;               // Experiment identifier
  map<string, string> metadata = 7;         // Additional metadata
}

// QLoRA-specific configuration
message QLoRAConfig {
  int32 lora_r = 1;                         // LoRA rank (default: 16)
  int32 lora_alpha = 2;                     // LoRA alpha (default: 32)
  repeated string target_modules = 3;       // Target modules for LoRA
  float lora_dropout = 4;                   // LoRA dropout (default: 0.05)
  string quant_type = 5;                    // Quantization type ("nf4", "fp4")
  bool use_double_quant = 6;                // Double quantization
  bool use_gradient_checkpointing = 7;      // Memory optimization
}

// Training hyperparameters
message TrainingConfig {
  int32 num_epochs = 1;                     // Number of training epochs
  int32 batch_size = 2;                     // Per-device batch size
  int32 gradient_accumulation_steps = 3;    // Gradient accumulation
  float learning_rate = 4;                  // Learning rate
  float warmup_ratio = 5;                   // Warmup ratio
  int32 save_steps = 6;                     // Checkpoint save frequency
  int32 logging_steps = 7;                  // Logging frequency
  int32 max_seq_length = 8;                 // Maximum sequence length
  bool fp16 = 9;                            // Use FP16 training
  bool bf16 = 10;                           // Use BF16 training
  string optimizer = 11;                    // Optimizer type
  float weight_decay = 12;                  // Weight decay
}

// Training session information
message TrainingSession {
  string session_id = 1;                    // Unique session identifier
  string status = 2;                        // Current status
  int64 start_time = 3;                     // Session start timestamp
  TrainingConfig config = 4;                // Training configuration
  string gpu_info = 5;                      // GPU information
}

// Training progress updates
message TrainingProgress {
  string session_id = 1;                    // Session identifier
  int32 epoch = 2;                          // Current epoch
  int32 step = 3;                           // Current step
  float loss = 4;                           // Current loss
  float learning_rate = 5;                  // Current learning rate
  float epoch_progress = 6;                 // Progress within epoch (0.0-1.0)
  TrainingMetrics metrics = 7;              // Detailed metrics
  int64 eta_seconds = 8;                    // Estimated time remaining
  repeated LogEntry logs = 9;               // Recent log entries
}

// Detailed training metrics
message TrainingMetrics {
  float train_loss = 1;                     // Training loss
  float eval_loss = 2;                      // Evaluation loss (if available)
  float perplexity = 3;                     // Model perplexity
  float grad_norm = 4;                      // Gradient norm
  float gpu_utilization = 5;                // GPU utilization %
  float gpu_memory_used = 6;                // GPU memory used (MB)
  float learning_rate = 7;                  // Current learning rate
  int32 tokens_processed = 8;               // Total tokens processed
  float tokens_per_second = 9;              // Processing throughput
  map<string, float> custom_metrics = 10;   // Custom metrics
}

// Log entry for training progress
message LogEntry {
  int64 timestamp = 1;                      // Log timestamp
  string level = 2;                         // Log level (INFO, WARN, ERROR)
  string message = 3;                       // Log message
  string component = 4;                     // Component that generated the log
}

// Training status
message TrainingStatus {
  string session_id = 1;                    // Session identifier
  string status = 2;                        // Final status
  string message = 3;                       // Status message
  TrainingMetrics final_metrics = 4;        // Final training metrics
  int64 end_time = 5;                       // Session end timestamp
  repeated string checkpoints = 6;          // Saved checkpoint paths
}

// Save adapter request
message SaveAdapterRequest {
  string session_id = 1;                    // Training session ID
  string adapter_path = 2;                  // Path to save adapter
  bool include_base_model = 3;              // Include base model weights
}

// Save adapter response
message SaveAdapterResponse {
  bool success = 1;                         // Save operation success
  string adapter_path = 2;                  // Actual saved path
  int64 adapter_size_bytes = 3;             // Adapter size in bytes
  string message = 4;                       // Response message
}

// Load adapter request
message LoadAdapterRequest {
  string adapter_path = 1;                  // Path to adapter weights
  string base_model_name = 2;               // Base model name
}

// Load adapter response
message LoadAdapterResponse {
  bool success = 1;                         // Load operation success
  string model_info = 2;                    // Loaded model information
  string message = 3;                       // Response message
}

// Health check messages
message HealthRequest {
  bool check_cuda = 1;                      // Check CUDA availability
  bool check_memory = 2;                    // Check memory status
  bool check_training = 3;                  // Check active training sessions
}

message HealthResponse {
  string status = 1;                        // Overall health status
  bool cuda_available = 2;                  // CUDA availability
  bool memory_ok = 3;                       // Memory status OK
  int32 active_sessions = 4;                // Number of active training sessions
  float gpu_memory_free_mb = 5;             // Free GPU memory (MB)
  map<string, string> details = 6;          // Detailed health information
}

// Dataset ingestion messages
message DatasetIngestionRequest {
  string dataset_path = 1;                  // Path to raw dataset
  DatasetConfig config = 2;                 // Ingestion configuration
  string output_path = 3;                   // Processed dataset output path
}

message DatasetConfig {
  string format = 1;                        // Dataset format (jsonl, csv, etc.)
  int32 max_seq_length = 2;                 // Maximum sequence length
  string tokenizer_name = 3;                // Tokenizer to use
  bool shuffle = 4;                         // Shuffle dataset
  float train_split = 5;                    // Train/validation split ratio
  map<string, string> preprocessing = 6;    // Preprocessing options
}

message DatasetIngestionResponse {
  bool success = 1;                         // Ingestion success
  string output_path = 2;                   // Processed dataset path
  int32 num_samples = 3;                    // Number of processed samples
  DatasetStats stats = 4;                   // Dataset statistics
  string message = 5;                       // Response message
}

message DatasetStats {
  int32 total_samples = 1;                  // Total number of samples
  int32 avg_seq_length = 2;                 // Average sequence length
  int32 max_seq_length = 3;                 // Maximum sequence length
  int32 vocab_size = 4;                     // Vocabulary size used
  map<string, int32> token_counts = 5;      // Token distribution stats
}