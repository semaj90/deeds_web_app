syntax = "proto3";

package legal_tensorrt;

option go_package = "github.com/legal-ai/proto/tensorrt";

// Legal TensorRT-LLM gRPC service for high-performance legal AI processing
service LegalTensorRT {
  // Single completion request with optimized response
  rpc ProcessCompletion(CompletionRequest) returns (CompletionResponse);

  // Batch processing for maximum throughput
  rpc ProcessBatchCompletion(BatchCompletionRequest) returns (BatchCompletionResponse);

  // Streaming completion for real-time legal analysis
  rpc StreamCompletion(CompletionRequest) returns (stream CompletionResponse);

  // Performance metrics and monitoring
  rpc GetMetrics(MetricsRequest) returns (MetricsResponse);

  // Health check endpoint
  rpc HealthCheck(HealthRequest) returns (HealthResponse);
}

// Request message for legal completion
message CompletionRequest {
  string prompt = 1;                    // Legal text to analyze
  int32 max_tokens = 2;                 // Maximum tokens to generate
  float temperature = 3;                // Sampling temperature (0.0-1.0)
  int32 top_k = 4;                      // Top-K sampling parameter
  float top_p = 5;                      // Top-P (nucleus) sampling parameter
  string session_id = 6;                // Optional session identifier
  map<string, string> metadata = 7;     // Additional request metadata
  bool stream = 8;                      // Enable streaming response
  string legal_domain = 9;              // Legal domain specialization
  repeated string document_types = 10;  // Document types for context
}

// Response message for legal completion
message CompletionResponse {
  string text = 1;                      // Generated legal analysis
  int32 tokens = 2;                     // Number of tokens generated
  float latency_ms = 3;                 // Processing latency in milliseconds
  float throughput_tps = 4;             // Throughput in tokens per second
  string session_id = 5;                // Session identifier
  map<string, string> metadata = 6;     // Response metadata
  PerformanceMetrics performance = 7;   // Detailed performance metrics
  repeated LegalInsight insights = 8;   // Legal insights extracted
}

// Batch completion request for high throughput processing
message BatchCompletionRequest {
  repeated CompletionRequest requests = 1;  // Batch of completion requests
  int32 max_concurrent = 2;                 // Maximum concurrent processing
  bool optimize_order = 3;                  // Optimize processing order
}

// Batch completion response
message BatchCompletionResponse {
  repeated CompletionResponse responses = 1;  // Batch of responses
  float batch_latency_ms = 2;                 // Total batch processing time
  int32 processed_count = 3;                  // Successfully processed requests
  int32 failed_count = 4;                     // Failed requests
  BatchPerformanceMetrics performance = 5;   // Batch performance metrics
}

// Performance metrics for monitoring
message PerformanceMetrics {
  float gpu_utilization = 1;           // GPU utilization percentage
  float memory_usage_mb = 2;           // Memory usage in MB
  float cuda_kernel_time_ms = 3;       // CUDA kernel execution time
  float preprocessing_time_ms = 4;     // Text preprocessing time
  float inference_time_ms = 5;         // Model inference time
  float postprocessing_time_ms = 6;    // Response postprocessing time
  string gpu_model = 7;                // GPU model information
  int32 cuda_cores_used = 8;           // Number of CUDA cores utilized
}

// Batch processing performance metrics
message BatchPerformanceMetrics {
  float avg_latency_ms = 1;            // Average request latency
  float max_latency_ms = 2;            // Maximum request latency
  float min_latency_ms = 3;            // Minimum request latency
  float total_throughput_tps = 4;      // Total batch throughput
  float gpu_efficiency = 5;            // GPU utilization efficiency
  int32 parallel_requests = 6;         // Number of parallel requests
}

// Legal insights extracted from analysis
message LegalInsight {
  string type = 1;                     // Type of legal insight
  string description = 2;              // Detailed description
  float confidence = 3;                // Confidence score (0.0-1.0)
  repeated string references = 4;      // Legal references or citations
  string risk_level = 5;               // Risk assessment (low/medium/high)
  map<string, string> attributes = 6;  // Additional attributes
}

// Metrics request
message MetricsRequest {
  bool include_detailed = 1;           // Include detailed metrics
  string time_range = 2;               // Time range for metrics
}

// Metrics response
message MetricsResponse {
  int64 requests_processed = 1;        // Total requests processed
  float avg_latency_ms = 2;            // Average latency
  float min_latency_ms = 3;            // Minimum latency
  float max_latency_ms = 4;            // Maximum latency
  int64 total_tokens_generated = 5;    // Total tokens generated
  float avg_throughput_tps = 6;        // Average throughput
  bool cuda_initialized = 7;           // CUDA initialization status
  int64 server_uptime = 8;             // Server uptime in seconds
  map<string, string> metadata = 9;    // Additional metrics metadata
  SystemMetrics system = 10;           // System-level metrics
}

// System-level performance metrics
message SystemMetrics {
  float cpu_usage = 1;                 // CPU usage percentage
  float memory_usage = 2;              // System memory usage
  float disk_usage = 3;                // Disk usage percentage
  int32 active_connections = 4;        // Active gRPC connections
  float network_bandwidth_mbps = 5;    // Network bandwidth utilization
  string golang_version = 6;           // Go version
  string tensorrt_version = 7;         // TensorRT version
}

// Health check request
message HealthRequest {
  bool check_cuda = 1;                 // Check CUDA availability
  bool check_tensorrt = 2;             // Check TensorRT status
  bool check_model = 3;                // Check model loading status
}

// Health check response
message HealthResponse {
  string status = 1;                   // Overall health status
  bool cuda_available = 2;             // CUDA availability
  bool tensorrt_ready = 3;             // TensorRT readiness
  bool model_loaded = 4;               // Model loading status
  map<string, string> details = 5;     // Detailed health information
  int64 timestamp = 6;                 // Health check timestamp
}

// Error details for failed requests
message ErrorDetails {
  string code = 1;                     // Error code
  string message = 2;                  // Error message
  string details = 3;                  // Detailed error information
  int64 timestamp = 4;                 // Error timestamp
  map<string, string> context = 5;     // Error context
}