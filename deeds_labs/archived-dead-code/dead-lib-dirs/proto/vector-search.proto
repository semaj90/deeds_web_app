syntax = "proto3";

package legal_ai.vector;

// Vector Search Request
message VectorSearchRequest {
  // Query vector or text
  oneof query {
    repeated float embedding = 1;
    string text = 2;
  }

  // Search parameters
  SearchParams params = 3;

  // Filters
  SearchFilters filters = 4;

  // Request metadata
  RequestMetadata metadata = 5;
}

// Search parameters
message SearchParams {
  // Number of results to return (default: 10, max: 100)
  int32 limit = 1;

  // Minimum similarity threshold (0.0 - 1.0)
  float min_similarity = 2;

  // Search algorithm
  SearchAlgorithm algorithm = 3;

  // Include vector embeddings in response
  bool include_embeddings = 4;
}

// Search algorithm options
enum SearchAlgorithm {
  COSINE_SIMILARITY = 0;
  EUCLIDEAN_DISTANCE = 1;
  DOT_PRODUCT = 2;
  MANHATTAN_DISTANCE = 3;
}

// Search filters
message SearchFilters {
  // Case ID filter
  repeated string case_ids = 1;

  // Document type filter
  repeated DocumentType doc_types = 2;

  // Date range filter
  DateRange date_range = 3;

  // Legal category filter
  repeated string legal_categories = 4;

  // Jurisdiction filter
  repeated string jurisdictions = 5;

  // Confidence threshold
  float min_confidence = 6;
}

// Document types
enum DocumentType {
  UNKNOWN = 0;
  CONTRACT = 1;
  EVIDENCE = 2;
  BRIEF = 3;
  MOTION = 4;
  RULING = 5;
  STATUTE = 6;
  CASE_LAW = 7;
  REGULATION = 8;
}

// Date range filter
message DateRange {
  // Unix timestamp
  int64 from = 1;
  int64 to = 2;
}

// Request metadata
message RequestMetadata {
  string user_id = 1;
  string session_id = 2;
  string client_version = 3;
  bool debug_mode = 4;
  int64 timestamp = 5;
}

// Vector Search Response
message VectorSearchResponse {
  // Search results
  repeated SearchResult results = 1;

  // Response metadata
  ResponseMetadata metadata = 2;

  // Query analytics
  QueryAnalytics analytics = 3;

  // Recommendations
  repeated Recommendation recommendations = 4;
}

// Individual search result
message SearchResult {
  // Document ID
  string id = 1;

  // Document metadata
  DocumentMetadata document = 2;

  // Similarity score (0.0 - 1.0)
  float similarity_score = 3;

  // Vector embedding (if requested)
  repeated float embedding = 4;

  // Highlighted snippets
  repeated TextSnippet snippets = 5;

  // Legal context
  LegalContext legal_context = 6;
}

// Document metadata
message DocumentMetadata {
  string title = 1;
  string content_preview = 2;
  DocumentType type = 3;
  int64 created_at = 4;
  int64 updated_at = 5;
  string case_id = 6;
  string jurisdiction = 7;
  repeated string legal_categories = 8;
  float confidence_score = 9;
  int32 page_count = 10;
  int32 word_count = 11;
}

// Text snippet with highlighting
message TextSnippet {
  string text = 1;
  repeated HighlightRange highlights = 2;
  float relevance_score = 3;
  int32 page_number = 4;
}

// Highlight range in text
message HighlightRange {
  int32 start = 1;
  int32 end = 2;
  string match_type = 3; // "exact", "semantic", "keyword"
}

// Legal context information
message LegalContext {
  repeated string precedents = 1;
  repeated Citation citations = 2;
  repeated string key_terms = 3;
  string practice_area = 4;
  float legal_weight = 5;
}

// Legal citation
message Citation {
  string citation_text = 1;
  string source = 2;
  string url = 3;
  float relevance = 4;
}

// Response metadata
message ResponseMetadata {
  // Query processing time (milliseconds)
  int64 processing_time_ms = 1;

  // Total number of matches found
  int64 total_results = 2;

  // Search algorithm used
  SearchAlgorithm algorithm_used = 3;

  // Cache hit indicator
  bool from_cache = 4;

  // Data source
  string data_source = 5; // "postgresql", "qdrant", "wasm", "cache"

  // Query vector dimensions
  int32 vector_dimensions = 6;

  // Search quality metrics
  SearchQuality quality = 7;
}

// Search quality metrics
message SearchQuality {
  float avg_similarity = 1;
  float query_clarity = 2;
  float result_diversity = 3;
  int32 exact_matches = 4;
  int32 semantic_matches = 5;
}

// Query analytics
message QueryAnalytics {
  string query_id = 1;
  string query_hash = 2;
  repeated string expansion_terms = 3;
  repeated SemanticCluster clusters = 4;
  QueryComplexity complexity = 5;
}

// Semantic cluster
message SemanticCluster {
  string cluster_id = 1;
  string theme = 2;
  float weight = 3;
  repeated string representative_terms = 4;
}

// Query complexity assessment
message QueryComplexity {
  float complexity_score = 1; // 0.0 - 1.0
  string complexity_level = 2; // "simple", "moderate", "complex"
  repeated string complexity_factors = 3;
}

// Recommendation for related searches
message Recommendation {
  string type = 1; // "related_cases", "similar_docs", "legal_research"
  string title = 2;
  string description = 3;
  string action_url = 4;
  float confidence = 5;
  repeated string tags = 6;
}

// Batch Vector Search (for multiple queries)
message BatchVectorSearchRequest {
  repeated VectorSearchRequest requests = 1;
  BatchParams batch_params = 2;
}

message BatchParams {
  bool parallel_processing = 1;
  int32 max_concurrent = 2;
  bool return_aggregated_analytics = 3;
}

message BatchVectorSearchResponse {
  repeated VectorSearchResponse responses = 1;
  BatchMetadata batch_metadata = 2;
}

message BatchMetadata {
  int32 total_queries = 1;
  int32 successful_queries = 2;
  int32 failed_queries = 3;
  int64 total_processing_time_ms = 4;
  float avg_processing_time_ms = 5;
}