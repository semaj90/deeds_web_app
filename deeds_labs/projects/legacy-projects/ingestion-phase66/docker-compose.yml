version: "3.9"

services:

  node-api:
    build: ./node-ingestion-api
    container_name: phase66-node-api
    ports: ["8082:8082"]
    restart: unless-stopped
    environment:
      RABBIT_URL: amqp://rabbit
      POSTGRES_URL: postgres://user:pass@postgres:5432/legal
      MINIO_URL: http://minio:9000
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379
    depends_on:
      rabbit:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  gpu-workers:
    build: ./gpu-workers
    container_name: phase66-gpu-workers
    entrypoint: []
    command: ["supervisord", "-c", "/etc/supervisor/supervisord.conf"]
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    restart: unless-stopped
    environment:
      RABBIT_URL: amqp://rabbit
      PADDLE_OCR_USE_GPU: 1
      GEMMA3_VISION_MODEL: gemma3-vision:latest
      EMBEDDINGS_MODEL: embeddinggemma:latest
    depends_on:
      rabbit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import torch; print('GPU available' if torch.cuda.is_available() else 'CPU only')"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 120s

  langextract:
    build: ../../../../docker/langextract-optimized
    container_name: phase66-langextract
    ports: ["8095:8095"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; r = urllib.request.urlopen('http://localhost:8095/health', timeout=5); sys.exit(0 if r.status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  rabbit:
    image: rabbitmq:3-management
    container_name: phase66-rabbitmq
    ports: ["5672:5672", "15672:15672"]
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  postgres:
    image: pgvector/pgvector:pg17
    container_name: phase66-postgres
    environment:
      POSTGRES_DB: legal
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports: ["5432:5432"]
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-postgres.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d legal"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  qdrant:
    image: qdrant/qdrant
    container_name: phase66-qdrant
    ports: ["6333:6333"]
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "pidof", "qdrant"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  minio:
    image: minio/minio
    container_name: phase66-minio
    command: server /data
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    ports: ["9000:9000", "9001:9001"]
    restart: unless-stopped
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    image: redis/redis-stack
    container_name: phase66-redis
    ports: ["6379:6379"]
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
  qdrant_data:
  minio_data:
  redis_data:
  rabbitmq_data: