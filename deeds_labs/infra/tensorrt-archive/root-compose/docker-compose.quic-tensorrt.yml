# Legal AI - QUIC + TensorRT-LLM Production Stack
# Integrates TensorRT-LLM with existing QUIC infrastructure
version: '3.8'

services:
  # PostgreSQL 17 + pgvector (existing)
  postgres:
    image: pgvector/pgvector:pg17
    container_name: legal-ai-postgres
    environment:
      POSTGRES_DB: legal_ai_db
      POSTGRES_USER: legal_admin
      POSTGRES_PASSWORD: 123456
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sveltekit-frontend/src/lib/server/db/migrations:/docker-entrypoint-initdb.d
    command: postgres -c shared_preload_libraries=vector
    networks:
      - legal-ai-net

  # Redis (existing with password)
  redis:
    image: redis:7-alpine
    container_name: legal-ai-redis
    command: redis-server --requirepass redis --maxmemory 2gb --maxmemory-policy allkeys-lru
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - legal-ai-net

  # MinIO (existing)
  minio:
    image: minio/minio:latest
    container_name: legal-ai-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    networks:
      - legal-ai-net

  # RabbitMQ (existing)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: legal-ai-rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - legal-ai-net

  # Caddy QUIC Proxy (existing)
  caddy-quic:
    image: caddy:2.8-alpine
    container_name: legal-ai-caddy-quic
    ports:
      - '5178:5178'  # QUIC proxy
      - '8082:8082'  # Admin API
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - sveltekit-dev
      - tensorrt-llm
    networks:
      - legal-ai-net

  # TensorRT-LLM Service (NEW - GPU-accelerated inference)
  tensorrt-llm:
    image: nvcr.io/nvidia/tensorrt-llm/release:latest
    container_name: legal-ai-tensorrt-llm
    environment:
      # Database connection
      DATABASE_URL: postgresql://legal_admin:123456@postgres:5432/legal_ai_db

      # Redis connection
      REDIS_URL: redis://:redis@redis:6379/0
      REDIS_PASSWORD: redis

      # GPU Configuration
      CUDA_VISIBLE_DEVICES: 0
      NVIDIA_VISIBLE_DEVICES: all
      RTX_3060_OPTIMIZATION: 'true'
      TENSOR_CORES_ENABLED: 'true'

      # TensorRT Settings
      TENSORRT_ENGINES_PATH: /opt/engines
      MODELS_PATH: /opt/models

      # Service Ports
      TENSORRT_PORT: 8096
      WEBSOCKET_PORT: 8097
      HEALTH_PORT: 8098

      # Python environment
      PYTHONPATH: /usr/local/lib/python3.12/dist-packages
    ports:
      - '8096:8096'  # TensorRT API
      - '8097:8097'  # WebSocket
      - '8098:8098'  # Health/metrics
    volumes:
      - ./models:/opt/models:ro
      - ./engines:/opt/engines
      - tensorrt_logs:/opt/logs
      - ./tensorrt-smoketest:/workspace/smoketest:ro
    working_dir: /workspace
    command: >
      bash -c "
        echo '🚀 Starting TensorRT-LLM Service...';
        python3 -m tensorrt_llm.hlapi.llm_server
        --host 0.0.0.0
        --port 8096
        --model /opt/models/gemma3-legal-latest
        --tensorrt_llm_model_path /opt/engines/gemma3-legal-latest
        --max_batch_size 8
        --max_input_len 2048
        --max_output_len 1024
      "
    depends_on:
      - postgres
      - redis
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - legal-ai-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8098/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # SvelteKit Development Server (updated with TensorRT env vars)
  sveltekit-dev:
    build:
      context: ./sveltekit-frontend
      dockerfile: Dockerfile.dev
    container_name: legal-ai-sveltekit
    environment:
      # Database
      DATABASE_URL: postgresql://legal_admin:123456@postgres:5432/legal_ai_db

      # Redis
      REDIS_URL: redis://:redis@redis:6379/0
      REDIS_PASSWORD: redis

      # MinIO
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_USE_SSL: 'false'

      # TensorRT-LLM Integration (NEW)
      TENSORRT_API_URL: http://tensorrt-llm:8096
      TENSORRT_WS_URL: ws://tensorrt-llm:8097
      TENSORRT_ENABLED: 'true'

      # RabbitMQ
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672

      # GPU Settings (for client-side)
      ENABLE_GPU: 'true'
      RTX_3060_OPTIMIZATION: 'true'
      CONTEXT7_MULTICORE: 'true'
      OLLAMA_GPU_LAYERS: '30'

      # QUIC Settings
      QUIC_ENABLED: 'true'
      QUIC_PROXY_URL: http://caddy-quic:5178

      # Development
      NODE_ENV: development
      VITE_DEV_MODE: 'true'
      HMR_PORT: 24678
    ports:
      - '5173:5173'  # Vite dev server
      - '24678:24678'  # HMR
    volumes:
      - ./sveltekit-frontend:/app
      - /app/node_modules
      - sveltekit_cache:/app/.svelte-kit
    depends_on:
      - postgres
      - redis
      - minio
      - rabbitmq
      - tensorrt-llm
    networks:
      - legal-ai-net
    develop:
      watch:
        - action: sync
          path: ./sveltekit-frontend/src
          target: /app/src
        - action: rebuild
          path: ./sveltekit-frontend/package.json

volumes:
  postgres_data:
  redis_data:
  minio_data:
  rabbitmq_data:
  caddy_data:
  caddy_config:
  tensorrt_logs:
  sveltekit_cache:

networks:
  legal-ai-net:
    driver: bridge
