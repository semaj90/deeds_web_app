syntax = "proto3";

package legalai.qlora;

message TrainingMetrics {
  int64 timestamp = 1;
  int64 step = 2;
  float loss = 3;
  float learning_rate = 4;
  float gradient_norm = 5;
  GPUMetrics gpu_metrics = 6;
  MemoryMetrics memory_metrics = 7;
  TimeMetrics time_metrics = 8;
}

message GPUMetrics {
  float gpu_utilization = 1;
  float gpu_memory_used = 2;
  float gpu_memory_total = 3;
  float gpu_temperature = 4;
}

message MemoryMetrics {
  float system_memory_used = 1;
  float system_memory_total = 2;
  float gpu_memory_used = 3;
  float gpu_memory_total = 4;
}

message TimeMetrics {
  float step_time = 1;
  float epoch_time = 2;
  float estimated_time_remaining = 3;
}