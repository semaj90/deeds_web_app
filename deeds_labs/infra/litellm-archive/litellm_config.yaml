# LiteLLM Proxy Configuration
# Routes all LLM calls through a unified OpenAI-compatible gateway
# Features: Redis semantic caching (28x speedup), model routing, usage tracking

model_list:
  # Primary LLM — Unsloth fine-tuned Gemma3 via native Ollama
  - model_name: gemma3-legal
    litellm_params:
      model: ollama/gemma3-legal:latest
      api_base: http://host.docker.internal:11434
      stream: true
      timeout: 120

  # Embedding model — 768-dim via Ollama
  - model_name: embeddinggemma
    litellm_params:
      model: ollama/embeddinggemma:latest
      api_base: http://host.docker.internal:11434

  # Fallback / general chat
  - model_name: gemma3
    litellm_params:
      model: ollama/gemma3:latest
      api_base: http://host.docker.internal:11434
      stream: true
      timeout: 120

litellm_settings:
  # Redis semantic cache — cache repeated/similar queries
  cache: true
  cache_params:
    type: redis
    host: host.docker.internal
    port: 6379
    ttl: 3600  # 1 hour cache TTL

  # Logging
  set_verbose: false
  drop_params: true
  num_retries: 2
  request_timeout: 120

general_settings:
  master_key: sk-deeds-litellm-2026
  database_url: null  # No persistent DB needed for dev