syntax = "proto3";

package legal.v1;

option go_package = "legal-ai-services/api/legal/v1;v1";

import "google/protobuf/timestamp.proto";

// Legal Analysis Service
service LegalAnalysisService {
  rpc AnalyzeDocument(AnalyzeDocumentRequest) returns (AnalyzeDocumentResponse);
  rpc ProcessDocumentStream(ProcessDocumentStreamRequest) returns (ProcessDocumentStreamResponse);
  rpc GetAnalysisHistory(GetAnalysisHistoryRequest) returns (GetAnalysisHistoryResponse);
}

// Vector Search Service  
service VectorSearchService {
  rpc SearchSimilar(SearchSimilarRequest) returns (SearchSimilarResponse);
  rpc IndexDocument(IndexDocumentRequest) returns (IndexDocumentResponse);
  rpc GetVectorStats(GetVectorStatsRequest) returns (GetVectorStatsResponse);
}

// Messages for Legal Analysis
message AnalyzeDocumentRequest {
  string document_id = 1;
  string content = 2;
  string document_type = 3;
  map<string, string> metadata = 4;
}

message AnalyzeDocumentResponse {
  string analysis_id = 1;
  string summary = 2;
  repeated string key_findings = 3;
  repeated Entity entities = 4;
  float confidence_score = 5;
  google.protobuf.Timestamp created_at = 6;
}

message ProcessDocumentStreamRequest {
  bytes data = 1;
  string format = 2;
}

message ProcessDocumentStreamResponse {
  bytes result = 1;
  string status = 2;
}

message GetAnalysisHistoryRequest {
  string document_id = 1;
  int32 limit = 2;
}

message GetAnalysisHistoryResponse {
  repeated AnalyzeDocumentResponse analyses = 1;
}

// Messages for Vector Search
message SearchSimilarRequest {
  string query = 1;
  repeated float embedding = 2;
  int32 limit = 3;
  float threshold = 4;
}

message SearchSimilarResponse {
  repeated VectorSearchResult results = 1;
}

message IndexDocumentRequest {
  string document_id = 1;
  string content = 2;
  repeated float embedding = 3;
  map<string, string> metadata = 4;
}

message IndexDocumentResponse {
  string status = 1;
  string vector_id = 2;
}

message GetVectorStatsRequest {}

message GetVectorStatsResponse {
  int64 total_vectors = 1;
  int64 total_documents = 2;
  int32 embedding_dimensions = 3;
}

// Common types
message Entity {
  string type = 1;
  string value = 2;
  float confidence = 3;
  int32 start_offset = 4;
  int32 end_offset = 5;
}

message VectorSearchResult {
  string document_id = 1;
  string content = 2;
  float similarity_score = 3;
  map<string, string> metadata = 4;
}