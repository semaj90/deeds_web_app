syntax = "proto3";

package inference;
option go_package = "github.com/legal-ai/inference-gateway/proto";

// Inference Service Definition
service InferenceService {
  // Unary text generation
  rpc Generate(GenerateRequest) returns (GenerateResponse);
  
  // Server-streaming text generation
  rpc StreamGenerate(GenerateRequest) returns (stream GenerateChunk);
  
  // Batch embedding generation
  rpc BatchEmbed(BatchEmbedRequest) returns (BatchEmbedResponse);
  
  // Similarity search with pgvector
  rpc SimilaritySearch(SimilarityRequest) returns (SimilarityResponse);
  
  // Health check
  rpc HealthCheck(HealthRequest) returns (HealthResponse);
  
  // Cache management
  rpc ClearCache(ClearCacheRequest) returns (ClearCacheResponse);
}

// Request/Response Messages
message GenerateRequest {
  string prompt = 1;
  string model = 2;
  float temperature = 3;
  int32 max_tokens = 4;
  bool stream = 5;
  map<string, string> metadata = 6;
  string user_id = 7;
  string session_id = 8;
}

message GenerateResponse {
  string id = 1;
  string text = 2;
  bool success = 3;
  int32 tokens_used = 4;
  float processing_time = 5;
  map<string, string> metadata = 6;
}

message GenerateChunk {
  string token = 1;
  bool done = 2;
  string request_id = 3;
  map<string, string> metadata = 4;
  float completion_progress = 5;
}

message BatchEmbedRequest {
  repeated string texts = 1;
  string model = 2;
  string user_id = 3;
  bool normalize = 4;
}

message BatchEmbedResponse {
  repeated Embedding embeddings = 1;
  int32 dimensions = 2;
  bool success = 3;
  float processing_time = 4;
}

message Embedding {
  repeated float vector = 1;
  string text = 2;
  string id = 3;
}

message SimilarityRequest {
  repeated float query_vector = 1;
  int32 limit = 2;
  float threshold = 3;
  string case_id = 4;
  string document_type = 5;
  map<string, string> filters = 6;
}

message SimilarityResponse {
  repeated SimilarityResult results = 1;
  bool success = 2;
  float processing_time = 3;
  bool cache_hit = 4;
}

message SimilarityResult {
  string id = 1;
  string document_id = 2;
  string text = 3;
  float distance = 4;
  map<string, string> metadata = 5;
}

message HealthRequest {
  bool detailed = 1;
}

message HealthResponse {
  bool healthy = 1;
  string version = 2;
  map<string, string> services = 3;
  SystemStats stats = 4;
}

message SystemStats {
  float cpu_usage = 1;
  float memory_usage = 2;
  float gpu_usage = 3;
  float gpu_memory = 4;
  int64 active_requests = 5;
  int64 total_requests = 6;
}

message ClearCacheRequest {
  string cache_type = 1; // "tokens", "embeddings", "results", "all"
  string pattern = 2;
}

message ClearCacheResponse {
  bool success = 1;
  int32 cleared_entries = 2;
  string message = 3;
}