syntax = \"proto3\";\n\npackage embedding;\n\noption go_package = \"github.com/deeds-web-app/backend/proto/embedding\";\noption java_multiple_files = true;\noption java_package = \"com.deeds.embedding\";\n\n/**\n * EmbeddingGemma gRPC Service\n * Batch inference for 768d embeddings\n * Optimized for RTX 3060 Ti (8GB, batch_size=4)\n */\n\nservice EmbeddingService {\n  // Batch embedding generation\n  rpc GenerateEmbeddings(EmbeddingRequest) returns (EmbeddingResponse);\n  \n  // Stream embeddings (SSE-like for real-time UI)\n  rpc StreamEmbeddings(stream EmbeddingChunk) returns (stream EmbeddingResult);\n  \n  // Health check\n  rpc Health(HealthRequest) returns (HealthResponse);\n  \n  // Get service stats\n  rpc GetStats(StatsRequest) returns (StatsResponse);\n}\n\n/**\n * Single embedding request\n */\nmessage EmbeddingChunk {\n  string chunk_id = 1;           // Unique chunk identifier\n  string text = 2;               // Text content to embed\n  string file_path = 3;          // Source file path\n  string language = 4;           // Language code (e.g., \"en\")\n  map<string, string> metadata = 5;  // Additional metadata\n}\n\n/**\n * Batch embedding request\n */\nmessage EmbeddingRequest {\n  repeated EmbeddingChunk chunks = 1;  // Batch of chunks (max 4 for RTX 3060 Ti)\n  int32 batch_size = 2;                // Override batch size (default 4)\n  bool normalize = 3;                  // L2 normalize output (default true)\n  int32 max_length = 4;                // Max token length (default 512)\n}\n\n/**\n * Single embedding result\n */\nmessage Embedding {\n  string chunk_id = 1;                 // Matches request chunk_id\n  repeated float vector = 2 [packed = true];  // 768-dimensional vector\n  float processing_time_ms = 3;        // Time to generate\n  int32 token_count = 4;               // Tokens in input\n  string status = 5;                   // \"success\" or error message\n}\n\n/**\n * Batch embedding response\n */\nmessage EmbeddingResponse {\n  repeated Embedding embeddings = 1;   // Results for each chunk\n  float total_time_ms = 2;             // Total batch processing time\n  string model_name = 3;               // Model used (e.g., \"EmbeddingGemma-1.1B\")\n  int32 embedding_dimension = 4;       // Always 768\n  string status = 5;                   // \"success\" or error\n}\n\n/**\n * Streaming embedding result (for SSE)\n */\nmessage EmbeddingResult {\n  string chunk_id = 1;                 // Chunk identifier\n  repeated float vector = 2 [packed = true];  // 768d vector\n  float processing_time_ms = 3;        // Time to generate\n  int32 token_count = 4;               // Tokens in input\n  string status = 5;                   // \"success\" or error\n  int32 sequence_number = 6;           // Order in stream\n}\n\n/**\n * Health check request\n */\nmessage HealthRequest {\n  string service = 1;  // Service name (optional)\n}\n\n/**\n * Health check response\n */\nmessage HealthResponse {\n  string status = 1;                   // \"healthy\" or \"unhealthy\"\n  string model_loaded = 2;             // \"true\" or \"false\"\n  float gpu_memory_used_gb = 3;        // GPU memory in use\n  float gpu_memory_total_gb = 4;       // Total GPU memory\n  string device = 5;                   // \"cuda\" or \"cpu\"\n  int64 timestamp = 6;                 // Unix timestamp\n}\n\n/**\n * Stats request\n */\nmessage StatsRequest {\n  bool include_memory = 1;  // Include memory stats\n}\n\n/**\n * Stats response\n */\nmessage StatsResponse {\n  string model_name = 1;               // Model name\n  string device = 2;                   // Device (cuda/cpu)\n  bool is_loaded = 3;                  // Model loaded\n  int32 embedding_dimension = 4;       // Always 768\n  int32 batch_size = 5;                // Current batch size\n  int32 max_length = 6;                // Max token length\n  int64 total_requests = 7;            // Total requests processed\n  float total_processing_time_s = 8;   // Total time in seconds\n  float avg_processing_time_ms = 9;    // Average per request\n  bool gpu_available = 10;             // GPU available\n  float gpu_memory_allocated_gb = 11;  // GPU memory allocated\n  float gpu_memory_reserved_gb = 12;   // GPU memory reserved\n  int32 uptime_seconds = 13;           // Service uptime\n}\n"