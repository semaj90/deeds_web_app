[supervisord]
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
nodaemon=true
user=%(ENV_USER)s

[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; ============================================================================
; Embedding Workers (2 processes for parallel embedding generation)
; ============================================================================
[program:embedding-worker]
command=python -m backend.mlp_worker
environment=MLP_QUEUE_TYPE=embedding,PYTHONUNBUFFERED=1,PYTHONPATH=/mnt/c/Users/james/Videos/deeds-web-app,CUDA_VISIBLE_DEVICES=0
directory=/mnt/c/Users/james/Videos/deeds-web-app/backend
autostart=true
autorestart=true
stderr_logfile=/tmp/embedding-worker.err.log
stdout_logfile=/tmp/embedding-worker.out.log
numprocs=2
process_name=%(program_name)s_%(process_num)02d
priority=999

; ============================================================================
; Mirror Workers (1 process for Qdrant + Postgres mirroring)
; ============================================================================
[program:mirror-worker]
command=python -m backend.mlp_worker
environment=MLP_QUEUE_TYPE=mirror,PYTHONUNBUFFERED=1,PYTHONPATH=/mnt/c/Users/james/Videos/deeds-web-app
directory=/mnt/c/Users/james/Videos/deeds-web-app/backend
autostart=true
autorestart=true
stderr_logfile=/tmp/mirror-worker.err.log
stdout_logfile=/tmp/mirror-worker.out.log
numprocs=1
process_name=%(program_name)s_%(process_num)02d
priority=998

; ============================================================================
; Rerank Workers (1 process for MiniLM-L6-v2 reranking)
; ============================================================================
[program:rerank-worker]
command=python -m backend.mlp_worker
environment=MLP_QUEUE_TYPE=rerank,PYTHONUNBUFFERED=1,PYTHONPATH=/mnt/c/Users/james/Videos/deeds-web-app
directory=/mnt/c/Users/james/Videos/deeds-web-app/backend
autostart=true
autorestart=true
stderr_logfile=/tmp/rerank-worker.err.log
stdout_logfile=/tmp/rerank-worker.out.log
numprocs=1
process_name=%(program_name)s_%(process_num)02d
priority=997

; ============================================================================
; Citation Workers (1 process for statute/citation extraction)
; ============================================================================
[program:citation-worker]
command=python -m backend.mlp_worker
environment=MLP_QUEUE_TYPE=citation,PYTHONUNBUFFERED=1,PYTHONPATH=/mnt/c/Users/james/Videos/deeds-web-app
directory=/mnt/c/Users/james/Videos/deeds-web-app/backend
autostart=true
autorestart=true
stderr_logfile=/tmp/citation-worker.err.log
stdout_logfile=/tmp/citation-worker.out.log
numprocs=1
process_name=%(program_name)s_%(process_num)02d
priority=996

; ============================================================================
; Group definitions for easy management
; ============================================================================
[group:workers]
programs=embedding-worker,mirror-worker,rerank-worker,citation-worker
priority=999
