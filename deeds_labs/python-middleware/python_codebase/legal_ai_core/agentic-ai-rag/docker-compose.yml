version: "3.8"

services:
  # 🧩 PostgreSQL (primary relational DB)
  postgres:
    image: postgres:17-alpine
    container_name: legal-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: legal_admin
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: legal_ai_db
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres-initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal_admin -d legal_ai_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 🧠 Redis cache (for embeddings, shader cache, etc.)
  redis:
    image: redis:7-alpine
    container_name: legal-ai-redis
    restart: unless-stopped
    command: >
      redis-server
      --save 60 1
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 🔍 Qdrant vector database (for semantic search / embeddings)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: legal-ai-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 📦 MinIO object storage (for legal document uploads / media)
  minio:
    image: quay.io/minio/minio:latest
    container_name: legal-ai-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ⚙️ NVIDIA Triton Inference Server (GPU model serving)
  triton:
    image: nvcr.io/nvidia/tritonserver:23.04-py3
    container_name: legal-ai-triton
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    shm_size: "2gb"
    ports:
      - "8000:8000" # HTTP
      - "8001:8001" # gRPC
      - "8002:8002" # Metrics
    volumes:
      - ./models:/models  # Mount model repository
    command: >
      tritonserver
      --model-repository=/models
      --model-control-mode=explicit
      --log-verbose=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v2/health/ready"]
      interval: 15s
      timeout: 10s
      retries: 5

  # 💻 (Optional) SvelteKit frontend / API gateway
  sveltekit:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: legal-ai-sveltekit
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
      triton:
        condition: service_started
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://legal_admin:123456@postgres:5432/legal_ai_db
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QDRANT_URL: http://qdrant:6333
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio123
      TRITON_URL: http://triton:8000
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  pg_data:
  redis_data:
  qdrant_data:
  minio_data:
