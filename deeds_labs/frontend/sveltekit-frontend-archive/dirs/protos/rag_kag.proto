syntax = "proto3";

package ragkag;

service RagKagService {
  rpc ContextQuery(ContextQueryRequest) returns (ContextQueryResponse);
  rpc IndexEvidence(IndexEvidenceRequest) returns (IndexEvidenceResponse);
}

message ContextQueryRequest {
  string case_id = 1;
  string user_id = 2;
  string query_text = 3;
  int32 top_k = 4;
}

message RagItem {
  string evidence_id = 1;
  string chunk_id = 2;
  double score = 3;
  string text = 4;
}

message KagFact {
  string node_id = 1;
  string label = 2;
  string relation = 3;
  string target_id = 4;
}

message Suggestion {
  string query = 1;
  string reason = 2;
  double score = 3;
}

message ContextQueryResponse {
  repeated RagItem rag_items = 1;
  repeated KagFact kag_facts = 2;
  repeated Suggestion suggestions = 3;
}

message IndexEvidenceRequest {
  string case_id = 1;
  string evidence_id = 2;
  string object_uri = 3;
}

message IndexEvidenceResponse {
  bool ok = 1;
}
