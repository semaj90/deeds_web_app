[workspace]
members = [
  "crates/atlas_packet_parser",
  "crates/turbovec-napi",
  "crates/omni-bridge",
  "simd-bridge/rust-simdjson",
]

resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[workspace.dependencies]
napi = { version = "2.16", features = ["serde-json"] }
napi-derive = "2.16"
tokio = { version = "1", features = ["full"] }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
