  - name: domain-classification-agentic-retrieval-alignment-v1
    owner: docs/.okf/architecture/domain-classification-and-agentic-retrieval-v1.md
    role: non-authoritative alignment note for domain taxonomy, ontology evidence, representations, docs retrieval, and MCP boundaries
    notes:
      - design_alignment_only
      - no_runtime_taxonomy_migration
      - no_canonical_identity_authority
      - langchain_local_snapshot_is_unadmitted
  - name: context-engineering-docs-v1
    owner: docs/.okf/dev/context-engineering-docs-v1.json
    role: bounded official-doc acquisition manifest for cache, serialization, RPC, data interchange, and context engineering references
    notes:
      - isolated_output_root_required
      - local_reference_only
      - canonical_authority_false
      - no_external_doc_admission_or_embedding
      - internal_ACE_and_BitFrost_contracts_remain_repo_owned
  - name: langchain-typescript-local-corpus-v1
    owner: docs/.okf/topics/langchain/corpus-typescript.json
    role: artifact-only official TypeScript/OpenWiki docs source scope for local retrieval
    notes:
      - local_snapshot_only
      - canonical_authority_false
      - no_dense_projection_or_datastore_writes
  - name: library-docs-prioritization-v1
    owner: docs/.okf/dev/library-docs-prioritization-v1.md
    role: preliminary lockfile-based library documentation priority and post-tournament consolidation plan
    notes:
      - manifest_census_not_installed_runtime_proof
      - official_docs_manifest: docs/.okf/dev/library-docs-manifest-v1.json
      - acquisition_not_yet_run
