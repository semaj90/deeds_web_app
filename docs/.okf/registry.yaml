schema_version: 1
registry_id: okf-contract-registry
description: >
  Entry-point registry for OKF-related contracts and schema artifacts.
  This registry points at the live owners without moving or duplicating them.
rules:
  - Do not relocate live artifacts just to satisfy directory layout.
  - Treat this registry as the navigation layer for OKF contracts.
  - Prefer the live owner in the referenced path over any copied summary.

# Cross-layer fabric alignment. These are references and admission rules only;
# they do not create a second packet schema or grant canonical authority.
fabric:
  schema: atlas.okf.fabric-registry.v1
  canonicalAuthority: false
  owners:
    # 2026-09-08 OKF-REGISTRY-REFERENCE-PARITY-01 correction: "CanonicalEnvelopeV1" does not exist
    # anywhere in the repo. The real, live owner is CanonicalFeatureEnvelope/
    # CanonicalFeatureEnvelopeSchema in sveltekit-frontend/src/lib/server/db/canonical-feature-envelope.ts.
    identity: CanonicalFeatureEnvelope
    structural: StructuralObservationV2
    semantic: semantic-packet-v2
    vectors: vector-manifest-v1
    tensors: RepresentationArtifactV1
    features: CandidateFeatureMatrixV1
    graph: StructuralGraphSnapshotV1
  providers:
    cst: node-tree-sitter
    structuralQuery: ast-grep
    compilerSemantic: ts-morph-or-lsp
    sidecar: treesitter-chunker-8095
    embedding: EmbeddingGemma
    classifier: XGBoost-baseline
    gpuClassifier: PyTorch-challenger
    clustering: cuML-KMeans
    graphReference: NetworkX
    graphProjection: Neo4j-GDS
    graphGpu: cuGraph
  join:
    required:
      - packetKey
      - sourceRef
      - sourceRevision
      - workspaceRevision
      - contentHash
    structural:
      - startByte
      - endByte
      - treeNodeId
      - symbolVersionId
    vector:
      representationId: semantic_768
      dimensions: 768
      ordinalMapRevision: required
  transport:
    control: JSONL
    bulk: ArrowIPC
    randomAccess: mmap
    rpc: protobuf-or-typed-json
    publication: checksum-then-seal-then-atomic-publish
  promotion:
    sourceHashMatch: required
    revisionMatch: required
    canonicalJoin: required
    artifactState: SEALED
    fabricatedValues: forbidden
  evidence:
    source_acquisition:
      providers: [BeautifulSoup, Firecrawl, SearXNG]
      required: [sourceRef, url, contentHash, retrievalTimestamp, provider]
      authority: evidence-candidate
    structural:
      providers: [Tree-sitter, ast-grep, LSP, ts-morph]
      required: [sourceRef, sourceRevision, startByte, endByte, providerRevision]
      authority: observation
    semantic:
      providers: [EmbeddingGemma, Python-Pydantic-sidecar]
      required: [packetKey, sourceRevision, workspaceRevision, representationRevision]
      representation: semantic_768
      authority: derived-until-canonical-join
    transport:
      providers: [Go-Retrieval, protobuf, typed-json, msgpack, ArrowIPC, mmap]
      required: [schemaVersion, checksum, revisionBinding]
      authority: transport-only
    analysis:
      providers: [DuckDB, NetworkX, cuGraph, cuML-KMeans, XGBoost, PyTorch]
      required: [inputChecksum, executionId, producerRevision, outputChecksum]
      authority: derived
    control:
      providers: [ACE, BitFrost, RabbitMQ, Ornith]
      required: [packetKey, sourceRef, workspaceRevision, evidenceRefs]
      hiddenReasoningPersistence: forbidden
contracts:
  - name: parent-atlas-code-exploration-index-v1
    owner: .okf/indexes/code-exploration.yaml
    role: rebuildable AST-grep and Tree-sitter exploration projection contract
    notes:
      - UTF-8 byte spans are canonical
      - LSP UTF-16 is transport-only
      - semantic_768 admission requires exact source/chunk/workspace lineage
  - name: metadata-contract-schema
    owner: docs/metadata-contract-schema.yaml
    role: indexed-field and mirror contract source of truth
    notes:
      - packet_key
      - som_cluster
      - community_id
      - retrieval_strategy
  - name: okf-v1-source
    owner: docs/okf-v1-source.okf
    role: source OKF artifact
  - name: feature-envelope-v3
    owner: sveltekit-frontend/schemas/atlas/feature-envelope/feature-envelope.v3.okf
    role: declarative feature-envelope schema
    notes:
      - tree_node_id
      - som_cluster
      - community_id
  - name: feature-matrix-schema
    owner: sveltekit-frontend/src/lib/server/atlas/feature-matrix-schema.ts
    role: legacy runtime FeatureMatrixRow schema; broad 768 assumptions remain until separate migration proof
    notes:
      - packet_key
      - tree_node_id
      - naive_bayes_score
      - logistic_regression_score
      - legacy_dense_768_contract
  - name: observation-feature-projection-v1
    owner: sveltekit-frontend/src/lib/server/atlas/contracts/observation-feature-projection-v1.ts
    role: ORF-1 deterministic observation-to-mask/tag projection
    notes:
      - ast_pattern_mask_32
      - ontology_mask_32
      - flattened_key_value_tags
      - source_version_receipt_id
      - representation_explicit
  - name: orf-ast-feature-registry-proposal-v1
    owner: docs/.okf/registries/orf-ast-feature-registry-proposal-v1.json
    role: Immutable review proposal for the five AST observation feature definitions
    notes:
      - REQUIRES_REVIEW
      - runtime_eligible false
      - canonical_authority false
      - no registry table or production loader
  - name: external-doc-projection-v1
    owner: sveltekit-frontend/src/lib/server/atlas/contracts/external-doc-projection-v1.ts
    role: ORF-3 target payload/index contract for one programming-doc evidence family
    notes:
      - external_programming_docs_hybrid_512_v1 (legacy/reference projection)
      - semantic_768 canonical; MRL 512/256/128 are derived views
      - flattened_key_value_tags
      - kmeans_cluster_id
      - community_id
      - migration_proof_required
  - name: cluster-feature-projection-v1
    owner: sveltekit-frontend/src/lib/server/atlas/contracts/cluster-feature-projection-v1.ts
    role: ORF-4 rebuildable KMeans/SOM/community routing projection
    notes:
      - semantic_768-derived routing features
      - semantic_mrl_512
      - semantic_mrl_256
      - semantic_mrl_128
      - latent_64
      - kmeans
      - som
      - community
      - evidence_authority_false
  - name: retrieval-router-feature-row-v1
    owner: sveltekit-frontend/src/lib/server/atlas/contracts/retrieval-router-feature-row-v1.ts
    role: ORF-5 representation-explicit router feature row
    notes:
      - semantic_768
      - semantic_mrl_512
      - semantic_mrl_256
      - semantic_mrl_128
      - latent_64
      - bm25_score
      - bm42_challenger_score
      - pagerank
      - ppr
      - kmeans
      - som
      - mutation_status
  - name: okf-mcp-resource-catalog-v1
    owner: sveltekit-frontend/src/lib/server/mcp/okf-resource-catalog.mjs
    role: ORF-6 stable atlas://okf resource identities plus protocol-neutral cache policy
    notes:
      - atlas://okf/registry
      - atlas://okf/schema
      - atlas://okf/feature-envelope/v3
      - mcp_v1_registration_adapter
      - mcp_2026_cache_hint_migration_pending
  - name: okf-topic-ingestion
    owner: sveltekit-frontend/src/lib/server/atlas/okf-topic-ingestion.ts
    role: OKF packetization and domain classification wiring
    notes:
      - domain_classification
      - naive_bayes_score
      - logistic_regression_score
      - ontology_ids
      - concept_ids
      - packet_key
  - name: ontology-linked-tuple-v1
    owner: sveltekit-frontend/src/lib/server/atlas/contracts/ontology-linked-tuple-v1.ts
    role: tuple bridge between ontology and structural identity
    notes:
      - ontology-linked-tuple.v1
      - treeNodeId
      - tree_node_id
  - name: mastra-workflows-okf
    owner: sveltekit-frontend/src/lib/server/okf/mastra-workflows.okf.yaml
    role: workflow contract and orchestration metadata
  - name: rtx-louvain-parity-note
    owner: docs/.okf/dev/rtx-louvain-parity.md
    role: docs note for frozen cuGraph/NetworkX Louvain parity proof
    notes:
