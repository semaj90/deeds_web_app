name: Error Analysis

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  error-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: sveltekit-frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sveltekit-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create log directories
        run: mkdir -p logs reports

      - name: Type and Svelte checks
        id: type-check
        run: |
          npm run check 2>&1 | tee logs/svelte-check.log || true
          npm run check:ts7 2>&1 | tee logs/ts7-check.log || true

      - name: Phase78 AST-rank (collects svelte-check.log → ranked errors)
        id: phase78-rank
        run: npm run phase78:ast-rank 2>&1 | tee logs/phase78-ast-rank.log || true

      - name: Phase78 insert errors into DB
        id: phase78-insert
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run phase78:insert 2>&1 | tee logs/phase78-insert.log || true

      - name: Phase78 cluster errors
        id: phase78-cluster
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run phase78:cluster 2>&1 | tee logs/phase78-cluster.log || true

      - name: Phase78 generate suggestions
        id: phase78-suggest
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL || 'http://localhost:11434' }}
        run: npm run phase78:suggest 2>&1 | tee logs/phase78-suggest.log || true

      # ── Inference observability gate ──────────────────────────────────────────
      # Checks that bifrostChat log calls include cache_tier (L1/L2/L3) and that
      # ACE assembly logs carry model_role. Neither is a hard failure — missing
      # metadata is surfaced as a warning in the PR comment so the gap shrinks
      # incrementally rather than being silently ignored.
      - name: Inference observability check
        id: observability
        run: |
          BIFROST_TIER=$(grep -rl "cache_tier\|cacheHitLevel\|L1_redis\|L2_qdrant\|L3_ollama" \
            src/lib/server/ollama.ts src/lib/server/ai/tiered-llm-cache.ts \
            src/routes/api/ai/agent/+server.ts 2>/dev/null | wc -l)
          ACE_ROLE=$(grep -rl "model_role\|modelRole\|pipeline.*role\|role.*pipeline" \
            src/lib/server/ace/context-assembler.ts \
            src/lib/server/ai/gemma4-agent.ts 2>/dev/null | wc -l)
          echo "bifrost_tier_files=$BIFROST_TIER" >> "$GITHUB_OUTPUT"
          echo "ace_role_files=$ACE_ROLE"         >> "$GITHUB_OUTPUT"
          echo "Bifrost cache-tier logging files: $BIFROST_TIER"
          echo "ACE model-role logging files: $ACE_ROLE"

      # ── ACP cross-feed smoke check ────────────────────────────────────────────
      # Verifies that knowledgeSearch in ACPToolRegistry actually delegates to a
      # live searcher (not an empty stub). grep for the getKnowledgeSearcher() call.
      - name: ACP knowledgeSearch live-path check
        id: acp-check
        run: |
          ACP_LIVE=$(grep -c "getKnowledgeSearcher\(\)" \
            src/lib/services/knowledge-search/ACPToolRegistry.ts 2>/dev/null || echo 0)
          ACE_ACP=$(grep -c "knowledgeSearch\|KnowledgeSearcher\|acpSearch" \
            src/lib/server/ace/context-assembler.ts 2>/dev/null || echo 0)
          echo "acp_live=$ACP_LIVE"   >> "$GITHUB_OUTPUT"
          echo "ace_acp=$ACE_ACP"     >> "$GITHUB_OUTPUT"
          echo "ACPToolRegistry live delegate calls: $ACP_LIVE"
          echo "ACE context-assembler ACP integration points: $ACE_ACP"

      - name: Summarize error counts
        id: summary
        run: |
          TS_ERRORS=$(grep -c "Error\b" logs/svelte-check.log 2>/dev/null || echo 0)
          TS7_ERRORS=$(grep -c "error TS" logs/ts7-check.log 2>/dev/null || echo 0)
          echo "ts_errors=$TS_ERRORS"   >> "$GITHUB_OUTPUT"
          echo "ts7_errors=$TS7_ERRORS" >> "$GITHUB_OUTPUT"
          echo "Svelte-check errors: $TS_ERRORS"
          echo "TS7 errors: $TS7_ERRORS"

      - name: Upload phase78 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase78-error-analysis-${{ github.run_number }}
          retention-days: 30
          path: |
            sveltekit-frontend/logs/svelte-check.log
            sveltekit-frontend/logs/ts7-check.log
            sveltekit-frontend/logs/phase78-*.log
            sveltekit-frontend/reports/phase78/**

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tsErrors      = '${{ steps.summary.outputs.ts_errors }}';
            const ts7Errors     = '${{ steps.summary.outputs.ts7_errors }}';
            const bifrostTier   = '${{ steps.observability.outputs.bifrost_tier_files }}';
            const aceRole       = '${{ steps.observability.outputs.ace_role_files }}';
            const acpLive       = '${{ steps.acp-check.outputs.acp_live }}';
            const aceAcp        = '${{ steps.acp-check.outputs.ace_acp }}';

            const obs = (n) => parseInt(n) > 0 ? '✅' : '⚠️ missing';

            const body = [
              '## Error Analysis Report',
              '',
              `**Svelte-check errors:** ${tsErrors}`,
              `**TS7 (tsgo) errors:** ${ts7Errors}`,
              '',
              '### Inference Observability',
              `- Bifrost cache-tier logging (L1/L2/L3): ${obs(bifrostTier)} (${bifrostTier} files)`,
              `- ACE model-role logging: ${obs(aceRole)} (${aceRole} files)`,
              '',
              '### ACP Cross-Feed',
              `- ACPToolRegistry live delegate: ${obs(acpLive)} (${acpLive} call sites)`,
              `- ACE ↔ ACP integration: ${obs(aceAcp)} (${aceAcp} references)`,
              '',
              `📊 [Full artifacts](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join('\n');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
