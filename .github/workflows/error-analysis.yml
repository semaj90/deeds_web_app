name: Error Analysis

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  error-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: sveltekit-frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sveltekit-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create log directories
        run: mkdir -p logs reports

      - name: Type and Svelte checks
        id: type-check
        run: |
          npm run check 2>&1 | tee logs/svelte-check.log || true
          npm run check:ts7 2>&1 | tee logs/ts7-check.log || true

      - name: Phase78 AST-rank (collects svelte-check.log → ranked errors)
        id: phase78-rank
        run: npm run phase78:ast-rank 2>&1 | tee logs/phase78-ast-rank.log || true

      - name: Phase78 insert errors into DB
        id: phase78-insert
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run phase78:insert 2>&1 | tee logs/phase78-insert.log || true

      - name: Phase78 cluster errors
        id: phase78-cluster
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run phase78:cluster 2>&1 | tee logs/phase78-cluster.log || true

      - name: Phase78 generate suggestions
        id: phase78-suggest
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL || 'http://localhost:11434' }}
        run: npm run phase78:suggest 2>&1 | tee logs/phase78-suggest.log || true

      - name: Summarize error counts
        id: summary
        run: |
          TS_ERRORS=$(grep -c "Error\b" logs/svelte-check.log 2>/dev/null || echo 0)
          TS7_ERRORS=$(grep -c "error TS" logs/ts7-check.log 2>/dev/null || echo 0)
          echo "ts_errors=$TS_ERRORS" >> "$GITHUB_OUTPUT"
          echo "ts7_errors=$TS7_ERRORS" >> "$GITHUB_OUTPUT"
          echo "Svelte-check errors: $TS_ERRORS"
          echo "TS7 errors: $TS7_ERRORS"

      - name: Upload phase78 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase78-error-analysis-${{ github.run_number }}
          retention-days: 30
          path: |
            sveltekit-frontend/logs/svelte-check.log
            sveltekit-frontend/logs/ts7-check.log
            sveltekit-frontend/logs/phase78-*.log
            sveltekit-frontend/reports/phase78/**

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tsErrors  = '${{ steps.summary.outputs.ts_errors }}';
            const ts7Errors = '${{ steps.summary.outputs.ts7_errors }}';
            const body = [
              '## Error Analysis Report',
              '',
              `**Svelte-check errors:** ${tsErrors}`,
              `**TS7 (tsgo) errors:** ${ts7Errors}`,
              '',
              `📊 [Full artifacts](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });