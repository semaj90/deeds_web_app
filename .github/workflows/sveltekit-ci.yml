name: SvelteKit CI

on:
  push:
    branches: [main]
    paths:
      - 'sveltekit-frontend/**'
      - '.github/workflows/sveltekit-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'sveltekit-frontend/**'
      - '.github/workflows/sveltekit-ci.yml'

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sveltekit-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: sveltekit-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Svelte Check (type errors)
        run: npx svelte-check --tsconfig tsconfig.json --fail-on-warnings

      - name: Vite Build
        run: npx vite build

      - name: Schema Drift Gate
        run: |
          node scripts/generate-schema-manifest.mjs
          node scripts/schema-drift-check.mjs

  playwright:
    runs-on: ubuntu-latest
    needs: check-and-build
    defaults:
      run:
        working-directory: sveltekit-frontend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: legal_admin
          POSTGRES_PASSWORD: 123456
          POSTGRES_DB: legal_ai_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: sveltekit-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Enable pgvector extension
        run: PGPASSWORD=123456 psql -h localhost -U legal_admin -d legal_ai_db -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Push DB schema (Drizzle)
        run: npx drizzle-kit push --force
        env:
          DATABASE_URL: postgresql://legal_admin:123456@localhost:5432/legal_ai_db

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test --project=chromium
        env:
          CI: true
          DATABASE_URL: postgresql://legal_admin:123456@localhost:5432/legal_ai_db
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-secret-not-for-production
          SERVICE_AUTH_TOKEN: ci-test-token-not-for-production
          DEV_BYPASS_AUTH: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: sveltekit-frontend/playwright-report/
          retention-days: 14
