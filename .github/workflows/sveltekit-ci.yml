name: SvelteKit CI

on:
  push:
    branches: [main]
    paths:
      - 'sveltekit-frontend/**'
      - '.github/workflows/sveltekit-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'sveltekit-frontend/**'
      - '.github/workflows/sveltekit-ci.yml'

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sveltekit-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: sveltekit-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Svelte Check (type errors)
        run: npx svelte-check --tsconfig tsconfig.json --fail-on-warnings

      - name: Vite Build
        run: npx vite build
