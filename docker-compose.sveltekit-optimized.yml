# SvelteKit Production Deployment (Session 93r28i Optimized)
# Uses Dockerfile.optimized with all performance enhancements:
# - Transferable ArrayBuffers (500× speedup)
# - SSR-enabled routes (5× FCP improvement)
# - Memory optimizations (3GB heap, GC tuning)
# - Worker thread pool (8 threads)
# - Security hardening (non-root user, dumb-init)

version: '3.8'

services:
  # SvelteKit Frontend (Production Build with Optimizations)
  sveltekit-frontend:
    build:
      context: ./sveltekit-frontend
      dockerfile: Dockerfile.optimized
      args:
        BUILD_TIME: "${BUILD_TIME:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}"
        GIT_COMMIT: "${GIT_COMMIT:-$(git rev-parse --short HEAD)}"
        VERSION: "${VERSION:-1.0.0}"
    container_name: deeds-sveltekit-prod
    ports:
      - "3000:3000"
    environment:
      # SvelteKit
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - ORIGIN=http://localhost:3000
      - LOG_LEVEL=info

      # Feature Flags
      - ERROR_BRAIN_ENABLED=false
      - ERROR_BRAIN_REQUIRE_AUTH=true
      - ERROR_BRAIN_LOG_LEVEL=warn
      - LEGAL_AI_ENABLED=true
      - LEGAL_AI_REQUIRE_AUTH=true
      - LEGAL_AI_LOG_LEVEL=warn

      # Database (connects to existing deeds-postgres-prod)
      - DATABASE_URL=postgresql://legal_admin:123456@host.docker.internal:5432/legal_ai_db

      # Redis (connects to existing deeds-redis-prod)
      - REDIS_URL=redis://host.docker.internal:6379

      # Qdrant (connects to existing deeds-qdrant-prod)
      - QDRANT_URL=http://host.docker.internal:6333

      # MinIO (connects to existing phase66-minio)
      - MINIO_ENDPOINT=host.docker.internal:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=password
      - MINIO_USE_SSL=false
      - MINIO_BUCKET=legal-documents

      # Ollama (native GPU instance)
      - OLLAMA_URL=http://host.docker.internal:11434
      - OLLAMA_BASE_URL=http://host.docker.internal:11434

      # RabbitMQ (connects to existing phase66-rabbitmq)
      - RABBITMQ_URL=amqp://guest:guest@host.docker.internal:5672

      # Neo4j (if running)
      - NEO4J_URI=bolt://host.docker.internal:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password

      # CouchDB (connects to existing phase66-couchdb)
      - COUCHDB_URL=http://admin:password@host.docker.internal:5984

      # TensorRT (optional, if running)
      - TENSORRT_SERVICE_URL=http://host.docker.internal:8099

      # Memory & Performance
      - NODE_OPTIONS=--max-old-space-size=3072 --optimize-for-size --gc-interval=100
      - UV_THREADPOOL_SIZE=8

    extra_hosts:
      - "host.docker.internal:host-gateway"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

    restart: unless-stopped

    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G

    networks:
      - deeds-network

networks:
  deeds-network:
    driver: bridge
    name: deeds-prod-network
