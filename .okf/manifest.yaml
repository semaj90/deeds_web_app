# OpenSpec Knowledge Framework (OKF) Manifest
# Versioned ontology and feature-classification contract for code analysis

version: 1
created_at: 2026-07-11T17:37:00Z
updated_at: 2026-07-11T17:37:00Z

# Scope: This manifest defines the canonical schema for:
# - Supported languages and their symbol extraction rules
# - Domain classifications and evidence paths
# - Feature extraction hierarchy
# - Ontology and relationship tuples

registries:
  languages:
    path: languages/
    description: Language-specific AST rules, extensions, exclusions
    schemas:
      - typescript.yaml

  domains:
    path: domains/
    description: Domain classifications with feature evidence paths
    schemas:
      - retrieval.yaml
      - cache.yaml
      - database.yaml

  symbols:
    path: symbols/
    description: Symbol kinds, weights, and evidence patterns
    schemas:
      - functions.yaml
      - routes.yaml

  tools:
    path: tools/
    description: External tool integrations (ast-grep, qdrant, etc.)
    schemas:
      - ast-grep.yaml

  predicates:
    path: predicates/
    description: Ontology and relationship classification rules
    schemas:
      - ontology.yaml

# Extractor versions (bump on breaking changes)
extractors:
  ast_grep_synthetic_fix:
    version: ast-grep-synthetic-fix-v1
    description: Canonical AST extraction from canonical packet_key + source_ref
    supported_languages:
      - typescript
      - javascript
      - svelte
    symbol_kinds:
      - function
      - class
      - interface
      - type_alias
      - route_handler
      - schema

  lexical:
    version: lexical-v1
    description: Lexical feature extraction (keywords, path terms, imports)
    features:
      - keywords
      - path_terms
      - imports
      - domain_hints

  langextract:
    version: langextract-v1
    description: LangExtract entity extraction and semantic analysis
    entities:
      - named_entities
      - technical_terms
      - error_patterns

# Classification pipeline order (strict sequence)
pipeline:
  1: source_identity           # (atlas_packets: packet_key + source_ref)
  2: language_classifier       # (file extension + path rules)
  3: ast_symbol_classifier     # (ast-grep extraction)
  4: lexical_classifier        # (keywords, path, imports)
  5: import_dependency         # (import/require analysis)
  6: documentation_concept     # (docstring + comment extraction)
  7: domain_model              # (multi-evidence domain scoring)
  8: ontology_tuple_builder    # (feature relationships)
