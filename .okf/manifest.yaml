# OpenSpec Knowledge Framework (OKF) Manifest
# Versioned ontology and feature-classification contract for code analysis

version: 2
created_at: 2026-07-11T17:37:00Z
updated_at: 2026-08-18T19:36:00Z

# Scope: This manifest defines the canonical schema for:
# - Supported languages and their symbol extraction rules
# - Domain classifications and evidence paths
# - Feature extraction hierarchy
# - Ontology and relationship tuples
# - Physical index/projection ownership without making projections canonical

registries:
  languages:
    path: languages/
    description: Language-specific AST rules, extensions, exclusions
    schemas:
      - typescript.yaml

  domains:
    path: domains/
    description: Domain classifications with feature evidence paths
    schemas:
      - retrieval.yaml
      - cache.yaml
      - database.yaml
      - feature-intelligence.yaml
      - parent-atlas-execution.yaml

  corpora:
    path: corpora/
    description: Keyword corpus, semantic ontology, and NLP-derived feature snapshots
    schemas:
      - keyword-corpus.yaml

  symbols:
    path: symbols/
    description: Symbol kinds, weights, and evidence patterns
    schemas:
      - functions.yaml
      - routes.yaml

  concepts:
    path: concepts/
    description: >-
      Evidence-linked gap records (missing lineage, fragmented ownership,
      undecided schema). status is always NOT_PROVEN until closed by a
      real fix with a receipt; never PROVEN by a concept file alone.
    schemas:
      - domain-lineage-gap.yaml
      - concept-edge-ledger-gap.yaml
      - representation-fragmentation-gap.yaml
      - topology-schema-drift-gap.yaml
      - cluster-run-lineage-gap.yaml
      - som-run-lineage-gap.yaml

  tools:
    path: tools/
    description: External tool integrations (ast-grep, qdrant, etc.)
    schemas:
      - ast-grep.yaml

  predicates:
    path: predicates/
    description: Ontology and relationship classification rules
    schemas:
      - ontology.yaml
      - feature-relationships.yaml

  indexes:
    path: indexes/
    description: Canonical store and rebuildable index/executor ownership policies
    schemas:
      - feature-intelligence.yaml

# Extractor versions (bump on breaking changes)
extractors:
  ast_grep_synthetic_fix:
    version: ast-grep-synthetic-fix-v1
    description: Canonical AST extraction from canonical packet_key + source_ref
    supported_languages:
      - typescript
      - javascript
      - svelte
    symbol_kinds:
      - function
      - class
      - interface
      - type_alias
      - route_handler
      - schema

  lexical:
    version: lexical-v1
    description: Lexical feature extraction (keywords, path terms, imports)
    features:
      - keywords
      - path_terms
      - imports
      - domain_hints

  langextract:
    version: langextract-v1
    description: LangExtract entity extraction and semantic analysis
    entities:
      - named_entities
      - technical_terms
      - error_patterns

  semantic_ontology:
    version: semantic-ontology-v1
    description: LDR + LangExtract + mixedbread-derived keyword corpus and ontology metadata
    features:
      - keyword_corpus
      - domain_classification
      - semantic_ontology

# Classification pipeline order (strict sequence)
pipeline:
  1: source_identity           # (atlas_packets: packet_key + source_ref)
  2: language_classifier       # (file extension + path rules)
  3: ast_symbol_classifier     # (ast-grep extraction)
  4: lexical_classifier        # (keywords, path, imports)
  5: import_dependency         # (import/require analysis)
  6: documentation_concept     # (docstring + comment extraction)
  7: domain_model              # (multi-evidence domain scoring)
  8: ontology_tuple_builder    # (feature relationships)
  9: canonical_identity_promotion
  10: projection_materialization

# Parent Atlas contextual-graph projection policy. This is configuration only;
# PostgreSQL remains the canonical graph snapshot and feature relationship store.
relationships:
  - contains
  - materializes
  - imports
  - calls
  - references
  - depends_on
  - implements
  - specifies
  - uses_concept
  - uses_table
  - uses_column
  - auth_guards
  - validates
  - blocks
  - observed_at_runtime
  - participates_in
  - authorized_resource_mutation

graph_projection:
  node_types:
    - file
    - symbol
    - packet
    - feature
    - evidence
    - relationship
  pagerank_edges:
    - imports
    - calls
    - references
    - depends_on
    - implements
    - uses_table
    - uses_column
    - auth_guards
    - blocks
  traversal_edges:
    - contains
    - materializes
    - imports
    - calls
    - references
    - depends_on
    - implements
    - specifies
    - uses_concept
    - uses_table
    - uses_column
    - auth_guards
    - validates
    - blocks
    - observed_at_runtime
    - participates_in
    - authorized_resource_mutation
  excluded_edges:
    - semantic_similar
  default_weight: 1.0
  minimum_confidence: 0.65
  max_hops: 2
  max_fanout: 20

index_policy:
  schema_ref: indexes/feature-intelligence.yaml
  canonical_store: postgresql18
  semantic_lane:
    executors:
      - pgvector_exact
      - pgvector_hnsw
      - pgvector_ivfflat
      - qdrant
      - cuvs_cagra
    fusion_votes: 1
  graph_lane:
    executors:
      - networkx
      - neo4j
      - cugraph
    canonical_relationships: postgresql18
