      - scripts/atlas/lib/symbol-toc-owner-readback-v1.mts
      - openspec/changes/parent-atlas-workstation-domain-classifier/tasks.md
    retrieval_policy: require_independent_ordinal_map_source_readback_and_search_runtime_owner; never_admit_or_rank_from_lut_alone

  - id: directory-source-lut
    terms: [directory LUT, source tree lookup, directory fanout, per-directory retrieval]
    definition: >-
      A proposed rebuildable directory-context lookup derived from qualified source
      bindings. It may group file and symbol candidates by directory, but directory
      paths are not canonical identities, inherited context is not an extra ranking
      vote, and stale or ambiguous source revisions must be excluded. The design
      remains blocked until GPH-13 AST parity and source-binding qualification pass.
    evidence_status: DESIGN_ONLY_GPH13_AND_SOURCE_BINDING_GATED
    source_refs:
      - docs/parent-atlas-workstation-gpu-runtime-backlog.md
      - .okf/indexes/parent-atlas-code-explore.yaml
      - sveltekit-frontend/src/lib/server/atlas/identity/workspace-source-binding-v1.ts
      - openspec/changes/parent-atlas-workstation-domain-classifier/tasks.md
    retrieval_policy: no_build_or_search_until_ast_parity_and_revision_qualified_source_bindings_pass

  - id: qdrant-projection
    terms: [Qdrant, vector projection, semantic retrieval, collection alias]
    definition: >-
      Qdrant is a rebuildable vector projection. Point IDs and vector hits are not
      canonical packet, source, chunk, or symbol identities; results require an
      exact revision-qualified PostgreSQL/source readback before evidence use.
    evidence_status: implementation_present_lineage_not_fully_proven
    source_refs:
      - .okf/indexes/parent-atlas-code-explore.yaml
      - sveltekit-frontend/src/lib/server/retrieval/identity-resolution.ts
      - sveltekit-frontend/src/lib/server/search/qdrant-search.ts
