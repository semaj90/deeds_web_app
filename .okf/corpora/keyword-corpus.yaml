    retrieval_policy: projection_hits_require_canonical_identity_revision_and_source_span_join

  - id: agentic-query-to-prefill-workflow
    terms: [agentic error fixing, query routing, DAG prefill, MCP tool call, ACE context, synthesis]
    definition: >-
      The repository has a CLI recommendation workflow with intent classification, local search,
      identity lookup, ACE context assembly, retrieval, reranking, synthesis, and recommendation
      stages. This is not yet a proven production search-to-prefill pipeline: its L4 code calls
      lexical, dense, and graph tools separately instead of delegating fusion to SearchRuntime;
      source now loads the existing SvelteKit env files and requires the configured Ornith 1.5
      alias to appear in llama-server GET /v1/models, but no live call has verified that binding;
      and the workflow writes diagnostic reports even when invoked with its documented --dry-run
      flag. Tool recommendations and model output do not authorize execution or evidence admission.
    evidence_status: CLI_WORKFLOW_PRESENT_PRODUCTION_CALLER_LINEAGE_AND_RUNTIME_ALIGNMENT_UNPROVEN
    source_refs:
      - scripts/atlas/agentic-recommendation-workflow.mjs
      - scripts/atlas/run-agentic-error-fixing-v1.mjs
      - sveltekit-frontend/src/lib/server/retrieval/search-runtime.ts
      - sveltekit-frontend/src/lib/server/retrieval/mcp-tool-policy-classifier-v1.ts
      - sveltekit-frontend/src/lib/server/llm/runtime-contract.ts
      - openspec/changes/parent-atlas-neural-prefill-encoder/tasks.md
    retrieval_policy: qualify_evidence_through_existing_identity_and_contextmanifest_owners_then_use_searchruntime_single_fusion; verify_side_effects_before_dry_run

  - id: parameter-artifact-lookup
    terms: [parameter fetching, parameter artifact, model revision, representation revision, DAG parameters]
    definition: >-
      The existing parameter resolver matches supplied revision-qualified artifact receipts and
      returns RESOLVED, UNAVAILABLE, or AMBIGUOUS without writes. It does not fetch artifacts or
      choose among multiple matches, and source inspection found no production caller beyond tests.
      Retrieval must bind parameters to the requested producer, model, adapter, and representation
      revisions rather than query intent or dimensions alone.
    evidence_status: CONTRACT_AND_FIXTURES_PRESENT_PRODUCTION_CALLER_UNPROVEN
    source_refs:
      - sveltekit-frontend/src/lib/server/atlas/agentic/contracts/parameter-resolver-v1.ts
      - sveltekit-frontend/src/lib/server/atlas/agentic/contracts/parameter-resolver-v1.spec.ts
      - sveltekit-frontend/src/lib/server/atlas/contracts/parameter-artifact-lookup-v1.ts
    retrieval_policy: exact_revision_compatibility_only; ambiguous_or_unavailable_parameters_fail_closed

  - id: web-search-research-dag
    terms: [web search, SearXNG, DuckDuckGo, web-search fallback, research DAG, T4 external evidence]
    definition: >-
      Web search exists through multiple callers, not one unified DAG: research.web_search and
      kag.web_search use the shared SearXNG/DuckDuckGo adapter; the agent tool-loop has an explicit
      opt-in web_search path with cache, SearXNG, and Qdrant research_summaries fallback; ACE also
      exposes a web-search fallback. A separate citation dependency DAG topologically orders
      documents in retrieval/synthesis callers; it is not the agent tool-execution DAG. External
      snippets are observations, not admitted source evidence. Search discovery, document
      fetch/capture (Firecrawl), source/license review, corpus admission, and ContextManifest
      inclusion are separate stages and are not proven by a successful search response.
    evidence_status: MULTIPLE_CALLERS_AND_SHARED_ADAPTER_PRESENT_UNIFIED_DAG_AND_ADMISSION_UNPROVEN
    source_refs:
      - sveltekit-frontend/src/lib/server/retrieval/web-search.ts
      - sveltekit-frontend/src/mcp/research_tools.ts
      - sveltekit-frontend/src/mcp/trace-mcp-server.ts
      - sveltekit-frontend/src/lib/server/llm/gemma4-tool-loop.ts
      - sveltekit-frontend/src/routes/api/v1/agentic/tool-loop/+server.ts
      - sveltekit-frontend/src/lib/server/ace/ace-agent.ts
      - sveltekit-frontend/src/lib/server/retrieval/document-dag.ts
      - sveltekit-frontend/src/lib/server/retrieval/orchestrator.ts
      - sveltekit-frontend/src/lib/server/atlas/docs/firecrawl-v2-capture.ts
    retrieval_policy: external_results_are_untrusted_observations; require_source_capture_license_scope_revision_and_admission_before_corpus_or_prompt_authority

  - id: query-router-mlp-tournament
    terms: [query router, classifier MLP, retrieval plan, MLP tournament, XGBoost baseline, shadow routing]
    definition: >-
      The query-router contract plans domain, operation, retrieval needs, and bounded budgets;
      it is not a candidate ranker, evidence authority, or tool-execution permission. OpenSpec
      records a 154-wide v1 tensor contract, while the v2 PyTorch trainer and v2 manifest declare
      a separate 234-wide tensor. Their crosswalk and dataset-owner relationship are unresolved.
      Non-toy revision-qualified training data, calibration, same-split XGBoost comparison,
      held-out evaluation, shadow runtime, and promotion remain open. Do not use MLP output to
      override SearchRuntime, MCP permission checks, or source/evidence admission.
    evidence_status: V1_V2_TENSOR_WIDTH_CONFLICT_TOURNAMENT_AND_RUNTIME_PROMOTION_OPEN
    source_refs:
      - openspec/changes/parent-atlas-query-routing-classifier/tasks.md
      - sveltekit-frontend/src/lib/server/atlas/neural-routing/query-classification-v2.ts
      - sveltekit-frontend/src/lib/server/atlas/neural-routing/query-routing-v2.spec.ts
      - sveltekit-frontend/scripts/atlas/train-query-router-pytorch-v2.py
      - sveltekit-frontend/src/lib/server/retrieval/search-runtime.ts
    retrieval_policy: classifier_outputs_are_shadow_route_recommendations_only_until_revisioned_dataset_calibration_held_out_comparison_and_promotion_gates_pass

  - id: swiglu-transformer-activation
    terms: [SwiGLU, SiLU gate, transformer feed-forward activation, gated MLP]
    definition: >-
      SwiGLU is a gated feed-forward activation inside a transformer architecture. It is not a
      post-hoc transform for EmbeddingGemma vectors, MiniLM vectors, or autoencoder latents, and
      it does not establish that the active Ornith model uses SwiGLU. The supplied llama-server
      model listing reports ornith-1.5-9b, n_embd 4096, n_ctx_train 262144, and completion
      capability; those fields do not expose the activation implementation or prove the
      effective runtime context window.
    evidence_status: REFERENCE_DEFINITION_PRESENT_ACTIVE_MODEL_ACTIVATION_UNVERIFIED
    source_refs:
      - openspec/changes/parent-atlas-neural-prefill-encoder/tasks.md
      - .okf/systems/parent-atlas-compute-ownership.md
      - docs/.okf/research/deltanet-swiglu/manifest.json
      - docs/.okf/research/deltanet-swiglu/published-current.json
    retrieval_policy: architecture_reference_only; verify_exact_model_artifact_or_config_before_claiming_activation; never_use_as_embedding_conversion

  - id: deltanet-attention-architecture
    terms: [DeltaNet, Gated DeltaNet, delta-rule attention, recurrent linear attention]
    definition: >-
      DeltaNet refers to a delta-rule attention/memory architecture family; gated variants
      combine state-update mechanisms with gating and may be hybridized with other attention
      layers. It is model-internal, not a Parent Atlas retrieval lane, routing algorithm,
      packet identity, embedding conversion, or evidence source. See the reference-only
      primary-paper corpus under docs/.okf/research/deltanet-swiglu/.
    evidence_status: PRIMARY_PAPER_REFERENCE_CAPTURED_MODEL_SPECIFIC_USE_REQUIRES_ARTIFACT_EVIDENCE
    source_refs:
      - docs/.okf/research/deltanet-swiglu/manifest.json
      - docs/.okf/research/deltanet-swiglu/published-current.json
      - openspec/changes/parent-atlas-neural-prefill-encoder/tasks.md
    retrieval_policy: architecture_reference_only; never_treat_as_retrieval_representation_or_packet_routing_contract

  - id: atlas-topk-selection-receipt
    terms: [selection receipt, TopK selection receipt, routing manifest binding, candidate selection provenance]
    definition: >-
      A proposed checksum- and revision-bound record linking a query/run, candidate feature
      snapshot and ordinal map, optional routing manifest, ordered Top-K canonical candidates,
      source/evidence and ontology tuple references, execution phase/gate, and ContextManifest
      identity/admission. Routing IDs identify routing decisions/artifacts, not canonical
      packets. Candidate lane masks record provenance and do not create extra logical-lane votes.
      This is a design term; production end-to-end wiring is not proven.
    evidence_status: DESIGN_ONLY_BINDING_AND_INTEGRATION_TESTS_OPEN
    source_refs:
      - docs/architecture/parent-atlas-selection-receipt-and-model-boundaries-v1.md
      - sveltekit-frontend/src/lib/server/atlas/features/candidate-feature-row-v1.ts
      - sveltekit-frontend/src/lib/server/atlas/tensors/tensor-artifact-contract.ts
      - sveltekit-frontend/src/lib/server/atlas/retrieval/topk-algorithm-tournament.ts
      - sveltekit-frontend/src/lib/server/atlas/graph/context-manifest-v2.ts
    retrieval_policy: design_reference_only; preserve_canonical_identity_and_one_vote_per_logical_lane

  - id: transformer-hidden-state-boundary
    terms: [transformer hidden state, intermediate activation, hidden-state feature, activation extraction]
    definition: >-
      Intermediate model activations are distinct from canonical semantic embeddings and
      source-derived AST/NLP features. They may be considered only through an explicitly
      supported, revision-qualified experimental interface; do not persist hidden states,
      tensors, KV cache, or hidden reasoning, and do not use activations as identity or evidence.
    evidence_status: POLICY_BOUNDARY_DOCUMENTED_EXPORT_INTERFACE_UNVERIFIED
    source_refs:
      - openspec/changes/parent-atlas-neural-prefill-encoder/tasks.md
      - .okf/systems/parent-atlas-compute-ownership.md
    retrieval_policy: ephemeral_experiment_only; model_layer_token_mapping_and_revision_required; no_persistent_state_or_evidence_authority

  - id: synthesis-dag-kag-hypergraph
    terms: [synthesis DAG, KAG, HyperGraphRAG, knowledge hypergraph, ContextManifest, PromptPlan]
    definition: >-
      The synthesis DAG plans bounded, ordered work and dependencies; KAG/HyperGraphRAG represent
      typed, evidence-backed relations, including role-preserving n-ary relations. Keep these
      structures separate. Similarity or cluster membership cannot create ontology facts.
      Synthesis consumes verified ContextManifest evidence and may propose actions, but does not
      authorize persistent mutations. Existing OpenSpec owners define the integration gates;
      a complete live retrieval-to-synthesis proof remains open.
    evidence_status: EXISTING_CONTRACTS_AND_OPENSPEC_PRESENT_LIVE_END_TO_END_PROOF_OPEN
    source_refs:
      - .okf/systems/hyperrag.md
      - openspec/changes/parent-atlas-agentic-completion/proposal.md
      - openspec/changes/parent-atlas-agentic-completion/design.md
      - openspec/changes/parent-atlas-neural-prefill-encoder/tasks.md
    retrieval_policy: require_admitted_revision_qualified_evidence_and_contextmanifest; dag_is_not_write_authority; preserve_hyperedge_roles

  - id: topology-som-kmeans-advisory-features
    terms: [TopologyFeature4, 4D topology coordinates, SOM 20x20, K-means, cluster assignment, feature remapping]
    definition: >-
      K-means assignments, SOM cells, and four-dimensional topology coordinates are separate,
      revision-qualified derived features. They may be evaluated as advisory routing or ranking
      features on a frozen, source-qualified cohort; they do not create canonical identity,
      ontology edges, prompt evidence, or additional semantic retrieval votes. The 20x20 grid is
      an existing experiment parameter, not a universal requirement or proof of production value.
    evidence_status: IMPLEMENTATIONS_AND_OPENSPEC_GATES_PRESENT_COHORT_ADMISSION_AND_PROMOTION_OPEN
    source_refs:
      - openspec/changes/parent-atlas-topology-representation-admission/proposal.md
      - openspec/changes/parent-atlas-gpu-sidecar-patch-tournament/proposal.md
      - openspec/changes/parent-atlas-neural-prefill-encoder/tasks.md
      - python/atlas_compute/som.py
      - python/atlas_compute/aligned_snapshot_experiment.py
      - .okf/systems/parent-atlas-compute-ownership.md
    retrieval_policy: advisory_only_until_frozen_cohort_revision_feature_schema_and_held_out_ablation_pass; no_identity_or_evidence_promotion
