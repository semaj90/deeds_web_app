  - id: symbol-document-diagnostic-lut
    terms: [symbol TOC, symbol LUT, reverse lookup, qualified symbol lookup, document crosswalk]
    definition: >-
      A bounded diagnostic projection provides exact-key, one-to-many symbol/document
      candidate lookups against a supplied integrity-checked ordinal map. Its results
      remain NOT_ADMITTED and are not wired to SearchRuntime; it is distinct from both
      MCP tool selection and the proposed per-directory context LUT.
    evidence_status: IMPLEMENTATION_AND_FIXTURES_PRESENT_LIVE_PROVIDER_AND_SEARCH_RUNTIME_UNPROVEN
    source_refs:
      - scripts/atlas/lib/symbol-toc-diagnostic-projection-v1.mts
