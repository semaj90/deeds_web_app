summary: >-
  atlas_topology_index has no som_run_id column, the same gap as
  cluster-run-lineage-gap but for SOM (self-organizing map) grid
  assignments. A row's SOM coordinate cannot be traced to the training
  run (seed, grid size, epochs) that produced it.
