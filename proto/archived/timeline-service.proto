syntax = "proto3";

package timeline_service;

option go_package = "github.com/legal-ai/proto/timeline";
option java_package = "com.legal_ai.proto.timeline";
option java_outer_classname = "TimelineServiceProto";

// High-performance timeline service for event streaming
// Optimized for real-time event aggregation
service TimelineService {
    // Get timeline events for a case or user
    rpc GetTimeline(TimelineRequest) returns (TimelineResponse);

    // Stream timeline events in real-time
    rpc StreamTimeline(TimelineRequest) returns (stream TimelineEvent);

    // Get timeline statistics
    rpc GetTimelineStats(TimelineStatsRequest) returns (TimelineStatsResponse);

    // Add event to timeline
    rpc AddEvent(AddEventRequest) returns (AddEventResponse);

    // Get events by type
    rpc GetEventsByType(EventTypeRequest) returns (TimelineResponse);
}

// Timeline Event
message TimelineEvent {
    string id = 1;
    string type = 2;                           // "evidence", "case", "message", "update"
    string title = 3;
    string description = 4;
    string case_id = 5;
    int64 timestamp = 6;                       // Unix timestamp (milliseconds)
    int32 position = 7;                        // Position in timeline
    map<string, string> metadata = 8;
    string actor_id = 9;                       // User who triggered event
    string actor_name = 10;
    repeated string tags = 11;                 // Event tags
    float importance_score = 12;               // 0.0 - 1.0
}

// Timeline Request
message TimelineRequest {
    string case_id = 1;                        // Required: case ID
    int32 limit = 2;                           // Default 50, max 500
    string order = 3;                          // "asc" or "desc"
    int64 from_timestamp = 4;                  // Optional: start time
    int64 to_timestamp = 5;                    // Optional: end time
    repeated string event_types = 6;           // Filter by types
    bool include_metadata = 7;
}

// Timeline Response
message TimelineResponse {
    bool success = 1;
    repeated TimelineEvent events = 2;
    int32 total = 3;
    int64 took_ms = 4;                         // Query time
    string error = 5;
}

// Timeline Statistics
message TimelineStatsRequest {
    string case_id = 1;
    int64 from_timestamp = 2;
    int64 to_timestamp = 3;
}

message TimelineStatsResponse {
    int32 total_events = 1;
    map<string, int32> events_by_type = 2;     // Type → count
    int64 earliest_event = 3;                  // Unix timestamp
    int64 latest_event = 4;                    // Unix timestamp
    float avg_events_per_day = 5;
    repeated EventTypeStats type_stats = 6;
}

message EventTypeStats {
    string type = 1;
    int32 count = 2;
    float percentage = 3;
    int64 first_occurrence = 4;
    int64 last_occurrence = 5;
}

// Add Event Request
message AddEventRequest {
    string case_id = 1;
    string type = 2;
    string title = 3;
    string description = 4;
    map<string, string> metadata = 5;
    string actor_id = 6;
    repeated string tags = 7;
}

message AddEventResponse {
    bool success = 1;
    string event_id = 2;
    int64 timestamp = 3;
    string error = 4;
}

// Get Events by Type
message EventTypeRequest {
    string case_id = 1;
    string event_type = 2;
    int32 limit = 3;
    int32 offset = 4;
}

// Batch Timeline Events (for streaming)
message TimelineEventBatch {
    repeated TimelineEvent events = 1;
    int64 batch_id = 2;
    int64 timestamp = 3;
    bool is_final = 4;                         // Last batch indicator
}

// Timeline Cursor for pagination
message TimelineCursor {
    string case_id = 1;
    int64 last_timestamp = 2;
    string last_event_id = 3;
    int32 position = 4;
}
