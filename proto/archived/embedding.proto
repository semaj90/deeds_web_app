syntax = "proto3";

package yorha.embedding;
option go_package = "github.com/yorha/embedding-service/proto";

// Embedding Service Definition
service EmbeddingService {
  // Single text embedding
  rpc Embed(EmbedRequest) returns (EmbedResponse);
  
  // Batch embedding for efficiency
  rpc BatchEmbed(BatchEmbedRequest) returns (BatchEmbedResponse);
  
  // Similarity search using embeddings
  rpc SearchSimilar(SimilarityRequest) returns (SimilarityResponse);
  
  // Health check
  rpc HealthCheck(HealthRequest) returns (HealthResponse);
  
  // Model management
  rpc LoadModel(LoadModelRequest) returns (LoadModelResponse);
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
}

// Request/Response Messages
message EmbedRequest {
  string id = 1;
  string text = 2;
  string model = 3; // e.g., "nomic-embed-text", "bge-small-en"
  map<string, string> metadata = 4;
}

message EmbedResponse {
  string id = 1;
  repeated float vector = 2;
  int32 dimensions = 3;
  string model = 4;
  bool success = 5;
  float processing_time = 6;
  map<string, string> metadata = 7;
}

message BatchEmbedRequest {
  repeated EmbedRequest requests = 1;
  string batch_id = 2;
  bool normalize = 3;
}

message BatchEmbedResponse {
  repeated EmbedResponse embeddings = 1;
  string batch_id = 2;
  int32 total_processed = 3;
  int32 total_failed = 4;
  float total_processing_time = 5;
  bool success = 6;
}

message SimilarityRequest {
  repeated float query_vector = 1;
  int32 limit = 2;
  float threshold = 3;
  string collection = 4; // e.g., "legal-documents", "case-files"
  map<string, string> filters = 5;
}

message SimilarityResponse {
  repeated SimilarityResult results = 1;
  bool success = 2;
  float processing_time = 3;
  int32 total_candidates = 4;
}

message SimilarityResult {
  string id = 1;
  string text = 2;
  repeated float vector = 3;
  float similarity_score = 4;
  map<string, string> metadata = 5;
}

message HealthRequest {
  bool detailed = 1;
}

message HealthResponse {
  bool healthy = 1;
  string status = 2;
  map<string, string> models = 3; // model_name -> status
  SystemStats stats = 4;
  int64 uptime_seconds = 5;
}

message SystemStats {
  float cpu_usage = 1;
  float memory_usage_mb = 2;
  float gpu_usage = 3;
  float gpu_memory_mb = 4;
  int64 total_embeddings = 5;
  int64 active_requests = 6;
  float average_latency_ms = 7;
}

message LoadModelRequest {
  string model_name = 1;
  string model_path = 2; // path to GGUF file
  map<string, string> config = 3; // model-specific config
}

message LoadModelResponse {
  bool success = 1;
  string message = 2;
  ModelInfo model_info = 3;
}

message ListModelsRequest {
  bool include_stats = 1;
}

message ListModelsResponse {
  repeated ModelInfo models = 1;
}

message ModelInfo {
  string name = 1;
  string path = 2;
  int32 dimensions = 3;
  string type = 4; // "embedding", "generation"
  bool loaded = 5;
  ModelStats stats = 6;
}

message ModelStats {
  int64 total_requests = 1;
  float average_latency_ms = 2;
  int64 memory_usage_mb = 3;
  string last_used = 4;
}