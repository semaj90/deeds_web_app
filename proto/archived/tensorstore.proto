syntax = "proto3";

package tensorstore;

option go_package = "github.com/deeds-web/legal-ai/proto";

// TensorService for streaming quantized tensor data
service TensorService {
  // Stream tensor chunks with manifest
  rpc StreamTensor(stream TensorChunk) returns (TensorResponse);
  
  // Retrieve tensor metadata by ID
  rpc GetTensorMetadata(TensorRequest) returns (TensorMetadata);
  
  // Health check
  rpc Health(HealthRequest) returns (HealthResponse);
}

// Tensor chunk for streaming large tensors
message TensorChunk {
  string tensor_id = 1;
  string user_id = 2;
  TensorManifest manifest = 3;  // Only in first chunk
  bytes data = 4;               // Binary tensor data
  bool is_final = 5;           // Last chunk marker
  int32 chunk_index = 6;       // For ordering
}

// Tensor metadata and configuration
message TensorManifest {
  string model_name = 1;        // e.g., "legal-embeddings-v1"
  repeated int32 shape = 2;     // Tensor dimensions
  string dtype = 3;            // Data type: float32, int8, etc.
  CompressionType compression = 4;
  int32 quantization_bits = 5; // 8, 16, 32
  repeated string tags = 6;    // Legal domain tags
  map<string, string> metadata = 7; // Custom fields
}

enum CompressionType {
  NONE = 0;
  GZIP = 1;
  LZ4 = 2;
  ZSTD = 3;
}

message TensorResponse {
  bool success = 1;
  string tensor_id = 2;
  string cache_key = 3;        // Redis key for retrieval
  int64 total_size = 4;        // Bytes stored
  string error_message = 5;
}

message TensorRequest {
  string tensor_id = 1;
}

message TensorMetadata {
  string tensor_id = 1;
  string user_id = 2;
  TensorManifest manifest = 3;
  string cache_key = 4;
  int64 size_bytes = 5;
  int64 created_at = 6;        // Unix timestamp
  repeated float embedding = 7; // pgvector embedding
}

message HealthRequest {}

message HealthResponse {
  string status = 1;           // "healthy" or "unhealthy"
  map<string, string> details = 2;
}