syntax = "proto3";

package yorha.shared;

option go_package = "github.com/deeds-web-app/proto/shared";

// ─────────────────────────────────────────────────────────────────────────────
// shared_ids.proto — Canonical cross-service identity primitives.
//
// Import this in every service proto that needs to reference run artifacts,
// chunks, symbols, or errors. All IDs are stable UUIDs or content hashes.
// ─────────────────────────────────────────────────────────────────────────────

// RunIds carries the canonical set of IDs that travel with every pipeline run.
// Attach to any request/response that participates in a run artifact.
message RunIds {
  // Stable run UUID — identifies a single pipeline execution (k-means, SOM, ACE, etc.)
  string run_id = 1;

  // Content-addressed chunk identity (sha256 of normalised chunk text)
  string chunk_id = 2;

  // Cluster/community group identity — GPU k-means cluster or SOM BMU group
  string group_id = 3;

  // Symbol identity — function/class/export in the codebase AST
  string symbol_id = 4;

  // Stable error fingerprint (sha256 of file:line:col:code:message)
  string error_hash = 5;

  // Content hash — sha256 of raw source bytes for change detection
  string content_hash = 6;

  // Embedding model tag that produced vectors in this run
  // e.g. "embeddinggemma:latest", "nomic-embed-text"
  string embedding_model = 7;

  // Dimensionality of vectors produced in this run (e.g. 768)
  int32 embedding_dim = 8;
}

// AtlasRequestContext carries caller-owned identity into an adapter boundary.
// Empty values are invalid for Stage 13 receipt admission; proto3 optional
// fields are reserved for values that are genuinely unavailable.
message AtlasRequestContextV2 {
  string tool_call_id = 1;
  string run_id = 2;
  string workspace_id = 3;
  string workspace_revision = 4;
  string packet_key = 5;
  string packet_revision = 6;
}

// AtlasToolReceipt is an observation projection, not a canonical write owner.
message AtlasToolReceiptV2 {
  string schema = 1;
  string tool_call_id = 2;
  string tool_name = 3;
  string run_id = 4;
  string workspace_id = 5;
  string workspace_revision = 6;
  string packet_key = 7;
  string packet_revision = 8;
  bool succeeded = 9;
  optional float retrieval_confidence = 10;
  int32 evidence_count = 11;
  string validation_status = 12;
  optional string output_checksum = 13;
  optional string error_code = 14;
  bool canonical_authority = 15;
  bool writes_performed = 16;
  string receipt_id = 17;
  string receipt_checksum = 18;
}

// ArtifactRef is a pointer to a file written under memory/runs/<run_id>/
message ArtifactRef {
  string run_id = 1;
  // Relative path under memory/runs/<run_id>/ — e.g. "embeddings.arrow"
  string relative_path = 2;
  // MIME type or format hint — "application/vnd.apache.arrow.file", "application/json", etc.
  string format = 3;
  int64 size_bytes = 4;
  string content_hash = 5;
  int64 created_at_unix = 6;
}
