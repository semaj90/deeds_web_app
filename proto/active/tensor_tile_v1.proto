syntax = "proto3";

package atlas.tensor.v1;

message TensorTileV1 {
  string schema_version = 1;
  string workspace_revision = 2;
  string source_snapshot_digest = 3;
  string ordinal_map_digest = 4;
  string representation_revision = 5;
  uint32 logical_dimension = 6;
  Quantization quantization = 7;
  TileLayout layout = 8;
  bytes payload = 9;
  string payload_sha256 = 10;
  uint32 candidate_ordinal = 11;
  bool proposal_only = 12;

  enum Quantization {
    QUANTIZATION_UNSPECIFIED = 0;
    SIGN_BITSET_1 = 1;
    INT2_AFFINE = 2;
    INT4_AFFINE = 3;
    MIXED_LOD = 4;
  }

  enum TileLayout {
    TILE_LAYOUT_UNSPECIFIED = 0;
    SIGN_BITSET_128 = 1;
    TURBOVEC_INT2_128 = 2;
    TURBOVEC_INT4_128 = 3;
    LOD_TILE_128B = 4;
  }
}
