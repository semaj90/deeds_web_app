syntax = "proto3";

package yorha.atlas;

option go_package = "github.com/deeds-web-app/proto/atlas";

// ── AeTrainService ────────────────────────────────────────────────────────────
// gRPC service for the 768→64 sparse autoencoder training control plane.
// The worker behind this service:
//   1. Fetches embeddings from Qdrant (codebase_chunks_768).
//   2. Trains the JS autoencoder (ae-train.mjs logic).
//   3. Saves weights to Redis (ace:autoencoder:weights).
//   4. Writes sae_latent FeatureRecord rows via upsertFeatureRecord.

service AeTrainService {
  // Single-shot blocking train call. Returns when training is complete
  // or has failed. Suitable for CLI / scripted invocation.
  rpc TrainAe(AeTrainRequest) returns (AeTrainResponse);

  // Server-streaming status updates during training.
  // The client receives one AeTrainStatusEvent per epoch/batch milestone.
  rpc StreamTrainStatus(AeTrainRequest) returns (stream AeTrainStatusEvent);

  // Returns the current state of the training queue without starting a run.
  rpc GetQueueStatus(QueueStatusRequest) returns (QueueStatusResponse);
}

// ── Request / Response messages ───────────────────────────────────────────────

message AeTrainRequest {
  // Version tag for the AE weights to be produced (semver, e.g. "1.0.0").
  string ae_version = 1;

  // Qdrant collection supplying training embeddings.
  // Defaults to "codebase_chunks_768" if empty.
  string qdrant_collection = 2;

  // Input embedding dimension. Must be 768.
  int32 embed_dim = 3;

  // Output latent dimension. Must be 64.
  int32 target_dim = 4;

  // Training hyper-parameters (zero values → use server defaults).
  int32  epochs     = 5;
  int32  batch_size = 6;
  double lr         = 7;
  double l2         = 8;

  // Max embeddings to fetch from Qdrant (0 = all).
  int32 limit = 9;

  // Dry-run: validate data pipeline without training or saving.
  bool dry_run = 10;

  // Overwrite existing Redis weights if already present.
  bool force = 11;

  // Manifest path to write (relative to repo root).
  // Defaults to "docs/reports/ae-train-manifest.json".
  string manifest_path = 12;
}

message AeTrainResponse {
  // "ok" | "error" | "dry_run_ok"
  string status = 1;

  // Human-readable summary.
  string message = 2;

  // Produced weights version (matches AeTrainRequest.ae_version).
  string ae_version = 3;

  // Number of embeddings used in training.
  int32 vector_count = 4;

  // Epochs completed.
  int32 epochs_completed = 5;

  // Final reconstruction loss.
  double final_loss = 6;

  // Wall-clock training duration in milliseconds.
  int64 duration_ms = 7;

  // Number of feature_records rows written.
  int32 feature_records_written = 8;

  // Whether weights were saved to Redis.
  bool weights_saved = 9;

  // Non-empty on error.
  string error = 10;
}

// ── Streaming status event ────────────────────────────────────────────────────

enum TrainPhase {
  TRAIN_PHASE_UNSPECIFIED = 0;
  TRAIN_PHASE_FETCHING    = 1;  // Fetching embeddings from Qdrant
  TRAIN_PHASE_TRAINING    = 2;  // Running AE training loop
  TRAIN_PHASE_SAVING      = 3;  // Writing weights to Redis
  TRAIN_PHASE_RECORDING   = 4;  // Upserting feature_records rows
  TRAIN_PHASE_DONE        = 5;
  TRAIN_PHASE_ERROR       = 6;
}

message AeTrainStatusEvent {
  // ISO-8601 timestamp of this event.
  string timestamp = 1;

  // Current phase of the training pipeline.
  TrainPhase phase = 2;

  // Epoch index (0-based); populated during TRAIN_PHASE_TRAINING.
  int32 epoch = 3;

  // Loss at this epoch.
  double loss = 4;

  // Number of batches processed in the current epoch.
  int32 batches_done = 5;

  // Total batches in the current epoch.
  int32 batches_total = 6;

  // Embeddings fetched so far (populated during TRAIN_PHASE_FETCHING).
  int32 vectors_fetched = 7;

  // Feature records written so far.
  int32 feature_records_written = 8;

  // Human-readable status line.
  string message = 9;
}

// ── Queue status ─────────────────────────────────────────────────────────────

message QueueStatusRequest {
  // Leave empty to use the default manifest path.
  string manifest_path = 1;
}

message QueueStatusResponse {
  // "present" | "absent" | "invalid"
  string manifest_status = 1;

  string contract_version = 2;
  string generated_at     = 3;
  string ae_version       = 4;

  int32 total_records = 5;
  int32 pending       = 6;
  int32 done          = 7;
  int32 errors        = 8;
}
