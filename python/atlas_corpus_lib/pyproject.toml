[build-system]
requires = ["setuptools>=68", "pybind11==2.13.6", "cmake>=3.24"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-corpus-lib"
version = "0.1.0"
description = "Versioned Parent Atlas corpus and structural evidence contracts"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.13.4,<2.14"]

[project.optional-dependencies]
arrow = ["pyarrow==24.0.0"]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["atlas_corpus_lib*"]
