# Legal AI Platform — Docker Compose (Profiled)
#
# Architecture: Docker data services + native Ollama + native Node.js
#
# NATIVE (do NOT run in Docker):
#   - Ollama       → port 11434 (native ollama.exe, GPU-accelerated)
#   - Node.js      → port 5173 (npm run dev)
#
# DOCKER (all data services):
#   Default:       postgres, redis, qdrant, minio, rabbitmq    (~6GB)
#   --profile full: + couchdb, neo4j, nats, go-search, go-embed (~8GB)
#   --profile gpu:  + tensorrt-llm (stop Ollama first!)        (~16GB)
#
# IMPORTANT: Stop native postgres.exe and rabbitmq before starting!
#   taskkill /F /IM postgres.exe   (or net stop postgresql-x64-17)
#   rabbitmqctl stop
#
# Usage:
#   docker compose up -d                          # Essential only (~6GB)
#   docker compose --profile full up -d           # All services (~8GB)
#   docker compose --profile gpu up -d            # + TensorRT (~16GB)
#   docker compose --profile full --profile gpu up -d  # Everything

services:
  # ═══════════════════════════════════════════════════════════════════
  # ESSENTIAL SERVICES (always start) — ~6GB total
  # ═══════════════════════════════════════════════════════════════════

  # PostgreSQL 17 + pgvector — primary database
  # NOTE: Stop native postgres.exe first to free port 5432
  postgres:
    image: pgvector/pgvector:pg17
    container_name: legal-ai-postgres
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    environment:
      - POSTGRES_DB=legal_ai_db
      - POSTGRES_USER=legal_admin
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-123456}
      - POSTGRES_HOST_AUTH_METHOD=md5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal_admin -d legal_ai_db"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # RabbitMQ — message broker (7 queues, 5 exchanges)
  # NOTE: Stop native rabbitmq first to free port 5672
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: legal-ai-rabbitmq
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    environment:
      - RABBITMQ_DEFAULT_USER=legal_admin
      - RABBITMQ_DEFAULT_PASS=secret123
      - RABBITMQ_DEFAULT_VHOST=/
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Redis — caching, sessions, semantic cache, pub/sub
  # Using redis-stack-server (no RedisInsight UI = less memory)
  redis:
    image: redis/redis-stack-server:latest
    container_name: legal-ai-redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 3G  # Increased to accommodate 2GB maxmemory + overhead
        reservations:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    ports:
      - "6379:6379"
    command: >
      redis-server
      --appendonly yes
      --port 6379
      --protected-mode no
      --bind 0.0.0.0
      --loadmodule /opt/redis-stack/lib/redisearch.so
      --loadmodule /opt/redis-stack/lib/redistimeseries.so
      --loadmodule /opt/redis-stack/lib/rejson.so
      --loadmodule /opt/redis-stack/lib/redisbloom.so
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
      --lazyfree-lazy-eviction yes
      --lazyfree-lazy-expire yes
      --slowlog-log-slower-than 10000
      --slowlog-max-len 128
    volumes:
      - redis_data:/data
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Qdrant — vector search (72 INT8-quantized collections)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: legal-ai-qdrant
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - legal-ai-network
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333' 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MinIO — evidence file storage (S3-compatible)
  minio:
    image: minio/minio:latest
    container_name: legal-ai-minio
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minio
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minio123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Caddy — HTTP/3 reverse proxy (QUIC-enabled)
  # Fronts SvelteKit with H3, SSE streaming, compression, security headers
  caddy:
    image: caddy:2.8-alpine
    container_name: legal-ai-caddy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    ports:
      - "${CADDY_PORT:-5178}:${CADDY_PORT:-5178}"
      - "${CADDY_PORT:-5178}:${CADDY_PORT:-5178}/udp"  # QUIC/HTTP3
    volumes:
      - ./sveltekit-frontend/docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:-localhost}
      CADDY_PORT: ${CADDY_PORT:-5178}
      SVELTEKIT_UPSTREAM: ${SVELTEKIT_UPSTREAM:-host.docker.internal:5173}
      VECTOR_BACKEND: ${VECTOR_BACKEND:-host.docker.internal:8095}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:${CADDY_PORT:-5178}/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ═══════════════════════════════════════════════════════════════════
  # FULL PROFILE — optional services (~2GB additional)
  # Usage: docker compose --profile full up -d
  # ═══════════════════════════════════════════════════════════════════

  # CouchDB — document store (Phase 87)
  couchdb:
    image: couchdb:3.3
    container_name: legal-ai-couchdb
    restart: unless-stopped
    profiles: ["full"]
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    ports:
      - "5984:5984"
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:-legal_ai_pass}
    volumes:
      - couchdb_data:/opt/couchdb/data
      - couchdb_config:/opt/couchdb/etc/local.d
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5984/_up"]
      interval: 30s
      timeout: 5s
      retries: 5

  # Neo4j — graph database (knowledge graph, case relationships)
  neo4j:
    image: neo4j:5-community
    container_name: legal-ai-neo4j
    restart: unless-stopped
    profiles: ["full"]
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    environment:
      - NEO4J_AUTH=neo4j/neo4j123
      - NEO4J_PLUGINS=["graph-data-science"]
      - NEO4J_dbms_memory_heap_initial__size=256m
      - NEO4J_dbms_memory_heap_max__size=512m
      - NEO4J_dbms_memory_pagecache_size=256m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "neo4j123", "MATCH () RETURN count(*) limit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # SearXNG — privacy-respecting metasearch engine for agent web search
  searxng:
    image: searxng/searxng:latest
    container_name: legal-ai-searxng
    restart: unless-stopped
    profiles: ["full"]
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    ports:
      - "8888:8080"
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # NATS — low-latency message transport (QUIC bridge)
  nats:
    image: nats:latest
    container_name: legal-ai-nats
    restart: unless-stopped
    profiles: ["full"]
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["--js", "--sd", "/data", "-m", "8222"]
    volumes:
      - nats_data:/data
    networks:
      - legal-ai-network

  # Bifrost — Go AI gateway (replaces LiteLLM, 50x faster, built-in semantic cache)
  # OpenAI-compatible /v1/chat/completions → routes to native Ollama
  bifrost:
    image: maximhq/bifrost:latest
    container_name: legal-ai-bifrost
    restart: unless-stopped
    profiles: ["full"]
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    ports:
      - "3040:8080"
    volumes:
      - ./docker/bifrost/config.json:/app/data/config.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Docling VLM — Document understanding + YOLO object detection + Whisper transcription
  # FastAPI service consolidating: docling-parse, ultralytics, whisper
  docling-vlm:
    build:
      context: ./docker/docling-vlm
      dockerfile: Dockerfile
    container_name: legal-ai-docling-vlm
    restart: unless-stopped
    profiles: ["full"]
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    ports:
      - "8085:8085"
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Langfuse ClickHouse — OLAP store for traces/observations/scores (required by Langfuse v3)
  langfuse-clickhouse:
    image: clickhouse/clickhouse-server
    container_name: langfuse-clickhouse
    restart: unless-stopped
    profiles: ["full"]
    user: "101:101"
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse_langfuse}
      # Cap ClickHouse memory to prevent OOM crashes (was 1G, kept segfaulting)
      CLICKHOUSE_MAX_SERVER_MEMORY_USAGE_RATIO: "0.8"
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    ports:
      - "127.0.0.1:8124:8123"
      - "127.0.0.1:9009:9000"
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # Langfuse Worker — async trace processing
  langfuse-worker:
    image: langfuse/langfuse-worker:3
    container_name: langfuse-worker
    restart: unless-stopped
    profiles: ["full"]
    depends_on:
      langfuse-clickhouse:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    environment: &langfuse-env
      DATABASE_URL: postgresql://legal_admin:${POSTGRES_PASSWORD:-123456}@postgres:5432/langfuse?connect_timeout=10&pool_timeout=10
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:${CLICKHOUSE_PASSWORD:-clickhouse_langfuse}@langfuse-clickhouse:9000
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse_langfuse}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minio123}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minio123}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      LANGFUSE_USE_AZURE_BLOB: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_TLS_ENABLED: "false"
      NEXTAUTH_URL: http://localhost:3030
      SALT: langfuse-salt-change-in-production
      ENCRYPTION_KEY: 8754be3c748398a38dd9a797fbb84747cb8b94d34dd15a2d5237851dbbe1b671
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "true"
    networks:
      - legal-ai-network

  # Langfuse Web — LLM observability UI + API on port 3030
  langfuse-web:
    image: langfuse/langfuse:3
    container_name: langfuse-server
    restart: unless-stopped
    profiles: ["full"]
    depends_on:
      langfuse-clickhouse:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    ports:
      - "3030:3000"
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: langfuse-secret-key-change-in-production-min-32-chars
      LANGFUSE_INIT_ORG_ID: deeds-legal-ai
      LANGFUSE_INIT_ORG_NAME: Deeds Legal AI
      LANGFUSE_INIT_PROJECT_ID: deeds-observability
      LANGFUSE_INIT_PROJECT_NAME: Deeds LLM Observability
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-4e3db8a0107de7872b894e309494252b
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-3941aba7500ce9fabbe0c513ad6c3a58
      LANGFUSE_INIT_USER_EMAIL: admin@deeds-legal.ai
      LANGFUSE_INIT_USER_NAME: Admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_ADMIN_PASSWORD:-admin123}
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://$(hostname):3000/api/public/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Go Legal Library Search Service
  go-search-service:
    build:
      context: ./services/go-search-service
      dockerfile: Dockerfile
    container_name: legal-ai-go-search
    restart: unless-stopped
    profiles: ["full"]
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    ports:
      - "8096:8096"
      - "50055:50055"
    environment:
      DATABASE_URL: postgresql://legal_admin:123456@postgres:5432/legal_ai_db
      QDRANT_URL: http://qdrant:6333
      QDRANT_GRPC_HOST: qdrant
      QDRANT_GRPC_PORT: "6334"
      REDIS_URL: redis://redis:6379
      OLLAMA_URL: http://host.docker.internal:11434
      GRPC_PORT: "50055"
      HTTP_PORT: "8096"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - redis
      - qdrant
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8096/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Go gRPC Embedding Server (Ollama proxy + Redis cache, port 50051)
  go-embedding-service:
    build:
      context: ./services/go-embedding-service
      dockerfile: Dockerfile
    container_name: legal-ai-go-embedding
    restart: unless-stopped
    profiles: ["full", "gpu"]
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    ports:
      - "50051:50051"
      - "8097:8097"
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
      REDIS_URL: redis://redis:6379
      EMBED_MODEL: "embeddinggemma:latest"
      EMBED_BATCH_MAX: "4"
      GRPC_PORT: "50051"
      HTTP_PORT: "8097"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8097/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ═══════════════════════════════════════════════════════════════════
  # GPU PROFILE — TensorRT-LLM (stop Ollama first!)
  # Usage: docker compose --profile gpu up -d
  # WARNING: Cannot run simultaneously with native Ollama (GPU contention)
  # ═══════════════════════════════════════════════════════════════════

  tensorrt-llm:
    image: nvcr.io/nvidia/tensorrt-llm/release:latest
    container_name: legal-ai-tensorrt-llm
    runtime: nvidia
    profiles: ["gpu"]
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
      - HF_HUB_CACHE=/workspace/cache
      - DATABASE_URL=postgresql://legal_admin:123456@postgres:5432/legal_ai_db
      - REDIS_URL=redis://redis:6379/0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${TENSORRT_HTTP_PORT:-8099}:8096"
      - "${TENSORRT_HEALTH_PORT:-8098}:8098"
    volumes:
      - ${TENSORRT_MODEL_DIR:-./docker/tensorrt-llm/models}:/workspace/models
      - ${TENSORRT_ENGINE_DIR:-./docker/tensorrt-llm/engines}:/workspace/engines
      - ${TENSORRT_CACHE_DIR:-./.cache/tensorrt-llm}:/workspace/cache
    command:
      - bash
      - -lc
      - |
        set -e
        echo 'Starting TensorRT-LLM server...'
        python3 -m tensorrt_llm.hlapi.llm_server \
          --host 0.0.0.0 \
          --port 8096 \
          --model ${TENSORRT_PRIMARY_MODEL:-/workspace/models} \
          --tensorrt_llm_model_path /workspace/engines \
          --max_batch_size ${TENSORRT_MAX_BATCH:-2} \
          --max_input_len ${TENSORRT_MAX_INPUT:-2048} \
          --max_output_len ${TENSORRT_MAX_OUTPUT:-1024}
    healthcheck:
      test:
        - CMD-SHELL
        - curl -f http://localhost:8098/health || curl -f http://localhost:8096/health
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - redis
    networks:
      - legal-ai-network
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════
  # GPU PROFILE — LangGraph Synthesis (RAG + KAG + LangChain + LibTorch)
  # Usage: docker compose --profile gpu up -d langgraph-synthesis
  # Port: 8091 (REST + SSE)   Endpoints: /synthesize  /synthesize/stream  /health
  # ═══════════════════════════════════════════════════════════════════
  langgraph-synthesis:
    build:
      context: ./docker/langgraph-synthesis
      dockerfile: Dockerfile
    container_name: legal-ai-langgraph
    runtime: nvidia
    profiles: ["gpu"]
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 2G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
      - OLLAMA_URL=http://host.docker.internal:11434
      - QDRANT_URL=http://qdrant:6333
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - DATABASE_URL=postgresql://legal_admin:123456@postgres:5432/legal_ai_db
      - REDIS_URL=redis://redis:6379/1
      - LLM_MODEL=${LLM_MODEL:-gemma4-legal:latest}
      - EMBED_MODEL=${EMBED_MODEL:-embeddinggemma:latest}
      - LANGFUSE_HOST=http://langfuse-web:3000
      - CONFIDENCE_THRESHOLD=${CONFIDENCE_THRESHOLD:-0.65}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${LANGGRAPH_PORT:-8091}:8091"
    depends_on:
      - redis
      - qdrant
    networks:
      - legal-ai-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8091/health || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3

