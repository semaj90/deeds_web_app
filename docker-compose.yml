  quic-server:
    build:
      context: .
      dockerfile: Dockerfile.quic
    container_name: legal-ai-quic
    ports:
      - "4433:4433/udp"
      - "4434:4434/udp"
      - "8095:8095"
    environment:
      - DATABASE_URL=postgresql://legal_admin:123456@postgres:5432/legal_ai_db
      - REDIS_URL=redis://:redis@redis:6379/0
      - REDIS_PASSWORD=redis
      - QUIC_PORT=4433
      - OLLAMA_URL=http://host.docker.internal:11434
      - ENABLE_GPU=true
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minio
      - MINIO_SECRET_KEY=minio123
      - MINIO_USE_SSL=false
      - MINIO_BUCKET_NAME=legal-documents
    volumes:
      - ./go-services:/app/services
      - ./protobuf:/app/protobuf
    networks:
      - legal-ai-network
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  # Neo4j graph database
  neo4j:
    image: neo4j:5-community
    container_name: legal-ai-neo4j
    environment:
      - NEO4J_AUTH=neo4j/neo4j123
      - NEO4J_PLUGINS=["graph-data-science"]
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_memory_pagecache_size=1G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "neo4j123", "MATCH () RETURN count(*) limit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

