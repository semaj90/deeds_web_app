# NOTE: The top-level `services:` block was consolidated into a single section
# later in this file. The original duplicated block was removed to prevent
# "mapping key 'services' already defined" YAML errors when parsing.

# Temporarily commented out due to missing native/autoencoder directory
# x-phaseh-bridge-build: &phaseh-bridge-build
#   context: .
#   dockerfile: native/autoencoder/Dockerfile.bridge

services:
  # SvelteKit Frontend Service - Main
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legal-ai-frontend
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
    ports:
      # Main SvelteKit ports
      - "5173:5173"
      - "5174:5174"
      - "5175:5175"
      - "5176:5176"
      - "5177:5177"
      - "5178:5178"
      - "5179:5179"
      # HMR WebSocket ports (original + 1000)
      - "6173:6173"
      - "6174:6174"
      - "6175:6175"
      - "6176:6176"
      - "6177:6177"
      - "6178:6178"
      - "6179:6179"
      # Custom WebSocket ports (original + 2000)
      - "7173:7173"
      - "7174:7174"
      - "7175:7175"
      - "7176:7176"
      - "7177:7177"
      - "7178:7178"
      - "7179:7179"
    environment:
      - NODE_ENV=development
      - PUBLIC_API_URL=http://localhost:8080
      # ── Core data stores ──
      - DATABASE_URL=postgresql://legal_admin:123456@postgres:5432/legal_ai_db
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
      - RABBITMQ_URL=amqp://legal_admin:secret123@rabbitmq:5672
      # ── AI / Embedding ──
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - EMBEDDING_GRPC_URL=embedding-service:50051
      - EMBEDDING_GRPC_ENABLED=true
      # ── MinIO (server-side uses Docker DNS, browser uses host port) ──
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=minio
      - MINIO_SECRET_KEY=minio123
      - MINIO_USE_SSL=false
      - MINIO_EVIDENCE_BUCKET=legal-evidence
    volumes:
      - ./src:/app/src
      - ./static:/app/static
      - ./svelte.config.js:/app/svelte.config.js
      - ./vite.config.js:/app/vite.config.js
    depends_on:
      - postgres
      - redis
      - qdrant
      - minio
      - rabbitmq
    networks:
      - legal-ai-network

  # Caddy Reverse Proxy
  caddy:
    image: caddy:latest
    container_name: legal-ai-caddy
    ports:
      - "443:443/tcp"    # HTTPS
      - "443:443/udp"    # QUIC/HTTP3
      - "80:80/tcp"      # HTTP redirect
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./Caddyfile.ws:/etc/caddy/Caddyfile.ws
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - legal-ai-network
    restart: unless-stopped

  postgres:
    image: postgres:17
    container_name: postgres-pgvector
    environment:
      - POSTGRES_DB=legal_ai_db
      - POSTGRES_USER=legal_admin
      - POSTGRES_PASSWORD=123456
      - POSTGRES_HOST_AUTH_METHOD=md5
    ports:
      - "5432:5432"  # Map to 5432 to match user requirements
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init/00-init-db.sql:/docker-entrypoint-initdb.d/00-init-db.sql
      - ./sql/init/01-install-pgvector.sql:/docker-entrypoint-initdb.d/01-install-pgvector.sql
      - ./sql/init:/docker-entrypoint-initdb.d
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal_admin -d legal_ai_db"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  minio:
    image: minio/minio:latest
    container_name: legal-ai-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minio
      - MINIO_ROOT_PASSWORD=minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  redis:
    image: redis/redis-stack:latest
    container_name: legal-ai-redis
    ports:
      - "6379:6379"   # Redis port
      - "18001:8001"   # RedisInsight port (shifted to avoid analytics bridge port)
    command: >
      redis-server
      --appendonly yes
      --port 6379
      --protected-mode no
      --bind 0.0.0.0
      --loadmodule /opt/redis-stack/lib/redisearch.so
      --loadmodule /opt/redis-stack/lib/redistimeseries.so
      --loadmodule /opt/redis-stack/lib/rejson.so
      --loadmodule /opt/redis-stack/lib/redisbloom.so
      --maxmemory 2gb
      --maxmemory-policy allkeys-lfu
      --save 900 1
      --save 300 10
      --save 60 10000
    volumes:
      - redis_data:/data
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # RabbitMQ message broker
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: legal-ai-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=legal_admin
      - RABBITMQ_DEFAULT_PASS=secret123
      - RABBITMQ_DEFAULT_VHOST=/
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI port
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Optional: Qdrant vector database for advanced vector operations
  qdrant:
    image: qdrant/qdrant:latest
    container_name: legal-ai-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - legal-ai-network
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/collections"]
      interval: 30s
      timeout: 10s
      retries: 3

