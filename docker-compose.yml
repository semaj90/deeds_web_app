# Legal AI Platform — Docker Compose (Profiled)
#
# Architecture: Docker data services + native Ollama + native Node.js
#
# NATIVE (do NOT run in Docker):
#   - Ollama       → port 11434 (native ollama.exe, GPU-accelerated)
#   - Node.js      → port 5173 (npm run dev)
#
# DOCKER (all data services):
#   Default:       postgres, redis, qdrant, rabbitmq    (~6GB)
#   SeaweedFS:     add the seaweedfs profile for canonical object storage
#   --profile full: + couchdb, neo4j, nats, go-search, go-embed (~8GB)
#   --profile gpu:  + tensorrt-llm (stop Ollama first!)        (~16GB)
#
# IMPORTANT: Stop native postgres.exe and rabbitmq before starting!
#   taskkill /F /IM postgres.exe   (or net stop postgresql-x64-17)
#   rabbitmqctl stop
#
# Usage:
#   docker compose up -d                          # Essential only (~6GB)
#   docker compose --profile full up -d           # All services (~8GB)
#   docker compose --profile gpu up -d            # + TensorRT (~16GB)
#   docker compose --profile full --profile gpu up -d  # Everything

services:
  # ═══════════════════════════════════════════════════════════════════
  # ESSENTIAL SERVICES (always start) — ~6GB total
  # ═══════════════════════════════════════════════════════════════════

  # PostgreSQL 18 + pgvector — primary database
  # NOTE: Stop native postgres.exe first to free port 5432
  # Optimizations: AIO (async I/O), skip-scan indexes, temporal constraints
  postgres:
    image: pgvector/pgvector:pg18
    container_name: legal-ai-postgres
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "io_method=worker"
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '1.0'
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    environment:
      - POSTGRES_DB=legal_ai_db
      - POSTGRES_USER=legal_admin
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-123456}
      - POSTGRES_HOST_AUTH_METHOD=md5
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./sql/init:/docker-entrypoint-initdb.d
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal_admin -d legal_ai_db"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # RabbitMQ — message broker (7 queues, 5 exchanges)
  # NOTE: Stop native rabbitmq first to free port 5672
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: legal-ai-rabbitmq
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    environment:
      - RABBITMQ_DEFAULT_USER=legal_admin
      - RABBITMQ_DEFAULT_PASS=secret123
      - RABBITMQ_DEFAULT_VHOST=/
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Valkey Bundle — caching, sessions, semantic cache, pub/sub
  # Open-source Redis-compatible bundle with JSON/Search/Bloom support.
  valkey:
    image: valkey/valkey-bundle:8.1.1
    container_name: legal-ai-valkey
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G  # Increased to accommodate 2GB maxmemory + overhead + Atlas
        reservations:
          memory: 1G
          cpus: '1.0'
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    ports:
      - "127.0.0.1:6379:6379"
    command: >
      valkey-server
      --appendonly yes
      --port 6379
      --protected-mode yes
      --bind 0.0.0.0
      --requirepass ${REDIS_PASSWORD:-redis}
      --io-threads 4
      --io-threads-do-reads yes
      --maxmemory 2gb
      --maxmemory-policy noeviction
      --save 900 1
      --save 300 10
      --save 60 10000
      --lazyfree-lazy-eviction yes
      --lazyfree-lazy-expire yes
      --slowlog-log-slower-than 10000
      --slowlog-max-len 128
    volumes:
      - valkey_data:/data
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a ${REDIS_PASSWORD:-redis} ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Qdrant — vector search (72 INT8-quantized collections)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: legal-ai-qdrant
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1536M
          cpus: '1.0'
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - legal-ai-network
    healthcheck:
      # Check both HTTP and gRPC ports are accepting TCP connections
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333 && echo > /dev/tcp/localhost/6334'"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Legacy MinIO-compatible evidence file storage (S3-compatible adapter only)
  # SeaweedFS is the canonical object-store backend in this repo.
  minio:
    profiles: ["legacy-minio"]
    image: minio/minio:latest
    container_name: legal-ai-minio
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minio
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minio123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ═══════════════════════════════════════════════════════════════════
  # SEAWEEDFS PROFILE — MIT/Apache object-store backend
  # Usage: docker compose --profile seaweedfs up -d
  # Then set in .env:
  #   SEAWEED_ENDPOINT=127.0.0.1
  #   SEAWEED_S3_PORT=8333
  #   SEAWEED_ACCESS_KEY=minio
  #   SEAWEED_SECRET_KEY=minio123
  # No call-site changes needed — the existing S3-compatible adapter can target SeaweedFS.
  # ═══════════════════════════════════════════════════════════════════

  # SeaweedFS Master — cluster metadata + volume assignment
  seaweedfs-master:
    image: chrislusf/seaweedfs:latest
    container_name: legal-ai-seaweed-master
    restart: unless-stopped
    profiles: ["seaweedfs"]
    command: master -mdir=/data -ip=seaweedfs-master -port=9333
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "9333:9333"
    volumes:
      - seaweed_master_data:/data
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://seaweedfs-master:9333/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # SeaweedFS Volume — actual blob storage
  seaweedfs-volume:
    image: chrislusf/seaweedfs:latest
    container_name: legal-ai-seaweed-volume
    restart: unless-stopped
    profiles: ["seaweedfs"]
    command: volume -mserver=seaweedfs-master:9333 -ip=seaweedfs-volume -port=8080 -dir=/data -dataCenter=dc1
    depends_on:
      seaweedfs-master:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "8080:8080"
    volumes:
      - seaweed_volume_data:/data
    networks:
      - legal-ai-network

  # SeaweedFS Filer — metadata index (required by S3 gateway)
  seaweedfs-filer:
    image: chrislusf/seaweedfs:latest
    container_name: legal-ai-seaweed-filer
    restart: unless-stopped
    profiles: ["seaweedfs"]
    command: filer -master=seaweedfs-master:9333 -port=8888
    depends_on:
      seaweedfs-master:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "8888:8888"
    networks:
      - legal-ai-network

  # SeaweedFS S3 — canonical S3-compatible API gateway (port 8333)
  # Existing S3-compatible client code connects here when SEAWEED_* env vars are set.
  seaweedfs-s3:
    image: chrislusf/seaweedfs:latest
    container_name: legal-ai-seaweed-s3
    restart: unless-stopped
    profiles: ["seaweedfs"]
    command: s3 -filer=seaweedfs-filer:8888 -port=8333 -config=/etc/seaweedfs/s3.json
    depends_on:
      seaweedfs-filer:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
        reservations:
          memory: 32M
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "8333:8333"
    volumes:
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -S -O /dev/null http://seaweedfs-s3:8333/ 2>&1 | grep -qE '(HTTP/1.1 200|HTTP/1.1 403)'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Caddy — HTTP/3 reverse proxy (QUIC-enabled)
  # Fronts SvelteKit with H3, SSE streaming, compression, security headers
  caddy:
    image: caddy:2.8-alpine
    container_name: legal-ai-caddy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
        reservations:
          memory: 64M
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    ports:
      - "${CADDY_PORT:-5178}:${CADDY_PORT:-5178}"
      - "${CADDY_PORT:-5178}:${CADDY_PORT:-5178}/udp"  # QUIC/HTTP3
    volumes:
      - ./sveltekit-frontend/docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:-localhost}
      CADDY_PORT: ${CADDY_PORT:-5178}
      SVELTEKIT_UPSTREAM: ${SVELTEKIT_UPSTREAM:-host.docker.internal:5173}
      VECTOR_BACKEND: ${VECTOR_BACKEND:-host.docker.internal:8095}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --no-check-certificate -O /dev/null https://localhost:${CADDY_PORT:-5178}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ═══════════════════════════════════════════════════════════════════
  # FULL PROFILE — optional services (~2GB additional)
  # Usage: docker compose --profile full up -d
  # ═══════════════════════════════════════════════════════════════════

  # CouchDB — document store (Phase 87)
  couchdb:
    image: couchdb:3.3
    container_name: legal-ai-couchdb
    restart: unless-stopped
    profiles: ["full"]
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    ports:
      - "5984:5984"
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:-legal_ai_pass}
      # Discard Erlang crash dumps instead of writing multi-GB files to disk
      ERL_CRASH_DUMP: /dev/null
      ERL_CRASH_DUMP_SECONDS: 0
      # Cap Erlang process/port table — default +P 1M and +Q 65K over-allocate
      # memory for a single-node dev instance; 128K processes + 4K ports is plenty
      ERL_FLAGS: "+P 131072 +Q 4096"
    volumes:
      - couchdb_data:/opt/couchdb/data
      - couchdb_config:/opt/couchdb/etc/local.d
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5984/_up"]
      interval: 30s
      timeout: 5s
      retries: 5

  # Neo4j — graph database (knowledge graph, case relationships)
  neo4j:
    image: neo4j:5-community
    container_name: legal-ai-neo4j
    restart: unless-stopped
    profiles: ["full"]
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 2G
          cpus: '1.0'
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    environment:
      - NEO4J_AUTH=neo4j/neo4j123
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*,gds.*
      - NEO4J_dbms_memory_heap_initial__size=2g
      - NEO4J_dbms_memory_heap_max__size=4g
      - NEO4J_dbms_memory_pagecache_size=1g
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "neo4j123", "MATCH () RETURN count(*) limit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # SearXNG — privacy-respecting metasearch engine for agent web search
  searxng:
    image: searxng/searxng:latest
    container_name: legal-ai-searxng
    restart: unless-stopped
    profiles: ["full"]
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    ports:
      - "${SEARXNG_PORT:-8889}:8080"
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # NATS — low-latency message transport (QUIC bridge)
  nats:
    image: nats:latest
    container_name: legal-ai-nats
    restart: unless-stopped
    profiles: ["full"]
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["--js", "--sd", "/data", "-m", "8222"]
    volumes:
      - nats_data:/data
    networks:
      - legal-ai-network

  # Bifrost — Go AI gateway (replaces LiteLLM, 50x faster, built-in semantic cache)
  # OpenAI-compatible /v1/chat/completions → routes to native Ollama
  bifrost:
    image: maximhq/bifrost:latest
    container_name: legal-ai-bifrost
    restart: unless-stopped
    profiles: ["full"]
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.50'
        reservations:
          memory: 32M
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    ports:
      - "3040:8080"
    volumes:
      # Named volume: gives Bifrost a writable /app/data/ for its SQLite
      # semantic-cache DB, request logs, and stats. The bind-mount below
      # overlays config.json on top (Docker applies bind mounts after named-
      # volume initialisation, so the file-level override works correctly).
      - bifrost_data:/app/data
      - ./docker/bifrost/config.json:/app/data/config.json:ro
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Docling VLM — Document understanding + YOLO object detection + Whisper transcription
  # FastAPI service consolidating: docling-parse, ultralytics, whisper
  docling-vlm:
    image: deeds-web-app-docling-vlm:latest
    build:
      context: ./docker/docling-vlm
      dockerfile: Dockerfile
    container_name: legal-ai-docling-vlm
    restart: unless-stopped
    profiles: ["full"]
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    ports:
      - "8085:8085"
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      # VLM OCR — Gemma4 via Ollama (gemma4:e4b or gemma4:e4b-it-q4_K_M)
      VLM_MODEL: ${VLM_MODEL:-gemma4:e4b}
      # YOLO GPU model — drop yolov8x.pt in docker/docling-vlm/models/ and set YOLO_MODELS_DIR
      YOLO_MODEL_PATH: ${YOLO_MODEL_PATH:-yolov8x.pt}
      # YOLO CPU fallback — nano stays as TurboQuant / ONNX export target
      YOLO_CPU_FALLBACK_PATH: ${YOLO_CPU_FALLBACK_PATH:-yolov8n.pt}
      MAX_IMAGE_LONG_EDGE: ${MAX_IMAGE_LONG_EDGE:-1536}
      PRELOAD_MODELS: ${PRELOAD_MODELS:-false}
    volumes:
      # Mount directory containing large YOLO .pt model files
      # Set YOLO_MODEL_PATH=/models/<filename>.pt in .env to use
      - ${YOLO_MODELS_DIR:-./docker/docling-vlm/models}:/models:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Image Synthesis + 3D Crime Scene Reconstruction (port 8092)
  # Pipeline: FLUX.1-schnell (keyframe) → Wan2.1-1.3B (video) → DepthAnything v2 (depth)
  # Multi-image: POST /reconstruct/gaussian-splat (needs ENABLE_GAUSSIAN_SPLATTING=true)
  image-synthesis:
    image: deeds-web-app-image-synthesis:latest
    build:
      context: ./docker/image-synthesis
    container_name: legal-ai-image-synthesis
    restart: unless-stopped
    profiles: ["full", "gpu"]
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 2G
    ports:
      - "8092:8092"
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
      LLM_MODEL: ${LLM_MODEL:-gemma4-legal:latest}
      # Wan2.1-1.3B: text-to-video, Apache 2.0, ~6GB VRAM bfloat16 + TorchAO INT8
      WAN_MODEL_ID: ${WAN_MODEL_ID:-Wan-AI/Wan2.1-T2V-1.3B}
      # FLUX.1-schnell: keyframe image, Apache 2.0, ~4GB VRAM NF4/INT8
      FLUX_MODEL_ID: ${FLUX_MODEL_ID:-black-forest-labs/FLUX.1-schnell}
      # DepthAnything v2 Large: monocular depth from single image, ~1.3GB VRAM
      DEPTH_MODEL_ID: ${DEPTH_MODEL_ID:-depth-anything/Depth-Anything-V2-Large-hf}
      IMAGE_WIDTH: ${IMAGE_WIDTH:-512}
      IMAGE_HEIGHT: ${IMAGE_HEIGHT:-512}
      VIDEO_FRAMES: ${VIDEO_FRAMES:-25}
      VIDEO_FPS: ${VIDEO_FPS:-24}
      WAN_STEPS: ${WAN_STEPS:-30}
      FLUX_STEPS: ${FLUX_STEPS:-4}
      # TorchAO TurboQuant: "int8" | "int4" | "nf4" | "none"
      QUANT_MODE: ${QUANT_MODE:-int8}
      # FlashAttention 2 via xformers (Ampere RTX 3060 Ti)
      USE_FLASH_ATTN: ${USE_FLASH_ATTN:-true}
      GENERATION_MODE: ${GENERATION_MODE:-i2v}
      PRELOAD_MODELS: ${PRELOAD_MODELS:-false}
      # Set true + install gsplat for multi-image Gaussian Splatting
      ENABLE_GAUSSIAN_SPLATTING: ${ENABLE_GAUSSIAN_SPLATTING:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8092/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # Langfuse ClickHouse — OLAP store for traces/observations/scores (required by Langfuse v3)
  langfuse-clickhouse:
    image: clickhouse/clickhouse-server
    container_name: langfuse-clickhouse
    restart: unless-stopped
    profiles: ["full"]
    user: "101:101"
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse_langfuse}
      # Cap ClickHouse memory to prevent OOM crashes (was 1G, kept segfaulting)
      CLICKHOUSE_MAX_SERVER_MEMORY_USAGE_RATIO: "0.8"
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    ports:
      - "127.0.0.1:8124:8123"
      - "127.0.0.1:9009:9000"
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # Langfuse Worker — async trace processing
  langfuse-worker:
    image: langfuse/langfuse-worker:3
    container_name: langfuse-worker
    restart: unless-stopped
    profiles: ["full"]
    depends_on:
      langfuse-clickhouse:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    environment: &langfuse-env
      DATABASE_URL: postgresql://legal_admin:${POSTGRES_PASSWORD:-123456}@postgres:5432/langfuse?connect_timeout=10&pool_timeout=10
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:${CLICKHOUSE_PASSWORD:-clickhouse_langfuse}@langfuse-clickhouse:9000
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse_langfuse}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${SEAWEED_ACCESS_KEY:-admin}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${SEAWEED_SECRET_KEY:-admin}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://seaweedfs-s3:8333
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${SEAWEED_ACCESS_KEY:-admin}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${SEAWEED_SECRET_KEY:-admin}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://seaweedfs-s3:8333
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      LANGFUSE_USE_AZURE_BLOB: "false"
      REDIS_HOST: valkey
      REDIS_PORT: "6379"
      REDIS_AUTH: ${REDIS_PASSWORD:-redis}
      REDIS_TLS_ENABLED: "false"
      NEXTAUTH_URL: http://localhost:3030
      SALT: langfuse-salt-change-in-production
      ENCRYPTION_KEY: 8754be3c748398a38dd9a797fbb84747cb8b94d34dd15a2d5237851dbbe1b671
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "true"
      NODE_OPTIONS: --max-old-space-size=1536
    networks:
      - legal-ai-network

  # Langfuse Web — LLM observability UI + API on port 3030
  langfuse-web:
    image: langfuse/langfuse:3
    container_name: langfuse-server
    restart: unless-stopped
    profiles: ["full"]
    depends_on:
      langfuse-clickhouse:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    ports:
      - "3030:3000"
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: langfuse-secret-key-change-in-production-min-32-chars
      LANGFUSE_INIT_ORG_ID: deeds-legal-ai
      LANGFUSE_INIT_ORG_NAME: Deeds Legal AI
      LANGFUSE_INIT_PROJECT_ID: deeds-observability
      LANGFUSE_INIT_PROJECT_NAME: Deeds LLM Observability
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-4e3db8a0107de7872b894e309494252b
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-3941aba7500ce9fabbe0c513ad6c3a58
      LANGFUSE_INIT_USER_EMAIL: admin@deeds-legal.ai
      LANGFUSE_INIT_USER_NAME: Admin
      LANGFUSE_INIT_USER_PASSWORD: admin123
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://$(hostname):3000/api/public/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Go Legal Library Search Service
  go-search-service:
    build:
      context: ./services/go-search-service
      dockerfile: Dockerfile
    container_name: legal-ai-go-search
    restart: unless-stopped
    profiles: ["full"]
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    ports:
      - "8096:8096"
      - "50055:50055"
    environment:
      DATABASE_URL: postgresql://legal_admin:123456@postgres:5432/legal_ai_db
      QDRANT_URL: http://qdrant:6333
      QDRANT_GRPC_HOST: qdrant
      QDRANT_GRPC_PORT: "6334"
      REDIS_URL: redis://:redis@valkey:6379
      OLLAMA_URL: http://host.docker.internal:11434
      GRPC_PORT: "50055"
      HTTP_PORT: "8096"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - valkey
      - qdrant
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8096/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Go gRPC Embedding Server (Ollama proxy + Redis cache, port 50051)
  go-embedding-service:
    build:
      context: ./services/go-embedding-service
      dockerfile: Dockerfile
    container_name: legal-ai-go-embedding
    restart: unless-stopped
    profiles: ["full", "gpu"]
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    ports:
      - "50051:50051"
      - "8097:8097"
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
      REDIS_URL: redis://:redis@valkey:6379
      EMBED_MODEL: "embeddinggemma:latest"
      EMBED_BATCH_MAX: "4"
      GRPC_PORT: "50051"
      HTTP_PORT: "8097"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      valkey:
        condition: service_healthy
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8097/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Go gRPC Retrieval Service (RAG+KAG+DAG, GPU embed, port 50053)
  go-retrieval-service:
    build:
      context: ./services/go-retrieval-service
      dockerfile: Dockerfile
    container_name: legal-ai-go-retrieval
    restart: unless-stopped
    profiles: ["full", "gpu"]
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    ports:
      - "50053:50053"
      - "8100:8100"
    environment:
      DATABASE_URL: postgresql://legal_admin:123456@postgres:5432/legal_ai_db
      QDRANT_URL: http://qdrant:6333
      QDRANT_GRPC_HOST: qdrant
      QDRANT_GRPC_PORT: "6334"
      REDIS_URL: redis://:redis@valkey:6379
      OLLAMA_URL: http://host.docker.internal:11434
      EMBED_SERVICE_URL: http://legal-ai-go-embedding:8097
      EMBED_MODEL: "embeddinggemma:latest"
      GPU_EMBED_ENABLED: "true"
      GRPC_PORT: "50053"
      HTTP_PORT: "8100"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      valkey:
        condition: service_healthy
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      go-embedding-service:
        condition: service_started
    networks:
      - legal-ai-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8100/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ═══════════════════════════════════════════════════════════════════
  # GPU PROFILE — TensorRT-LLM (stop Ollama first!)
  # Usage: docker compose --profile gpu up -d
  # WARNING: Cannot run simultaneously with native Ollama (GPU contention)
  # ═══════════════════════════════════════════════════════════════════

  tensorrt-llm:
    image: nvcr.io/nvidia/tensorrt-llm/release:latest
    container_name: legal-ai-tensorrt-llm
    # runtime: nvidia is needed alongside deploy.resources for NVIDIA_DRIVER_CAPABILITIES
    # to be honoured by the container toolkit (legacy flag, still required for driver caps).
    runtime: nvidia
    profiles: ["gpu"]
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
      - HF_HUB_CACHE=/workspace/cache
      - DATABASE_URL=postgresql://legal_admin:123456@postgres:5432/legal_ai_db
      - REDIS_URL=redis://:redis@valkey:6379/0
      # torch.compile() persistent kernel cache — avoids 10-30 min recompile on restart
      - TORCHINDUCTOR_CACHE_DIR=/workspace/.cache/torchinductor
      - TRITON_CACHE_DIR=/workspace/.cache/triton
      - TORCHINDUCTOR_COMPILE_THREADS=4
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${TENSORRT_HTTP_PORT:-8099}:8096"
      - "${TENSORRT_HEALTH_PORT:-8098}:8098"
    volumes:
      - ${TENSORRT_MODEL_DIR:-./docker/tensorrt-llm/models}:/workspace/models
      - ${TENSORRT_ENGINE_DIR:-./docker/tensorrt-llm/engines}:/workspace/engines
      - ${TENSORRT_CACHE_DIR:-./.cache/tensorrt-llm}:/workspace/cache
      - torchinductor_cache:/workspace/.cache/torchinductor
      - triton_cache:/workspace/.cache/triton
    command:
      - bash
      - -lc
      - |
        set -e
        echo 'Starting TensorRT-LLM server...'
        python3 -m tensorrt_llm.hlapi.llm_server \
          --host 0.0.0.0 \
          --port 8096 \
          --model ${TENSORRT_PRIMARY_MODEL:-/workspace/models} \
          --tensorrt_llm_model_path /workspace/engines \
          --max_batch_size ${TENSORRT_MAX_BATCH:-2} \
          --max_input_len ${TENSORRT_MAX_INPUT:-2048} \
          --max_output_len ${TENSORRT_MAX_OUTPUT:-1024}
    healthcheck:
      test:
        - CMD-SHELL
        - curl -f http://localhost:8098/health || curl -f http://localhost:8096/health
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - valkey
    networks:
      - legal-ai-network
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════
  # GPU PROFILE — LangGraph Synthesis (RAG + KAG + LangChain + LibTorch)
  # Usage: docker compose --profile gpu up -d langgraph-synthesis
  # Port: 8091 (REST + SSE)   Endpoints: /synthesize  /synthesize/stream  /health
  # ═══════════════════════════════════════════════════════════════════
  langgraph-synthesis:
    build:
      context: ./docker/langgraph-synthesis
      dockerfile: Dockerfile
    container_name: legal-ai-langgraph
    runtime: nvidia
    profiles: ["gpu"]
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 2G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
      - OLLAMA_URL=http://host.docker.internal:11434
      - QDRANT_URL=http://qdrant:6333
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - DATABASE_URL=postgresql://legal_admin:123456@postgres:5432/legal_ai_db
      - REDIS_URL=redis://:redis@valkey:6379/1
      - LLM_MODEL=${LLM_MODEL:-gemma4-legal-vlm:latest}
      - EMBED_MODEL=${EMBED_MODEL:-embeddinggemma:latest}
      - LANGFUSE_HOST=http://langfuse-web:3000
      - CONFIDENCE_THRESHOLD=${CONFIDENCE_THRESHOLD:-0.65}
      # torch.compile() persistent kernel cache — avoids 10-30 min recompile on restart
      - TORCHINDUCTOR_CACHE_DIR=/app/.cache/torchinductor
      - TRITON_CACHE_DIR=/app/.cache/triton
      - TORCHINDUCTOR_COMPILE_THREADS=4
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${LANGGRAPH_PORT:-8091}:8091"
    volumes:
      - torchinductor_cache:/app/.cache/torchinductor
      - triton_cache:/app/.cache/triton
    depends_on:
      - valkey
      - qdrant
    networks:
      - legal-ai-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8091/health || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3

  # ═══════════════════════════════════════════════════════════════════
  # ATLAS RUNNER — Trusted maintenance worker for graph/retrieval jobs
  # ═══════════════════════════════════════════════════════════════════
  # Runs inside Docker network to access Postgres/Neo4j/Qdrant via DNS
  # Use: docker compose --profile tools run --rm atlas-runner sh -c "..."
  # Or:  npm run atlas:runner -- "..."
  atlas-runner:
    image: node:22-alpine
    profiles: ["tools"]
    working_dir: /workspace
    volumes:
      - ./:/workspace
    environment:
      - DATABASE_URL=postgresql://legal_admin:${POSTGRES_PASSWORD:-123456}@legal-ai-postgres:5432/legal_ai_db
      - NEO4J_URI=bolt://legal-ai-neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-neo4j}
      - REDIS_HOST=legal-ai-valkey
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - QDRANT_URL=http://legal-ai-qdrant:6333
      - OLLAMA_URL=http://host.docker.internal:11434
      - LLAMA_URL=http://host.docker.internal:8090
      - NODE_ENV=production
    networks:
      - legal-ai-network
    depends_on:
      legal-ai-postgres:
        condition: service_healthy
      legal-ai-neo4j:
        condition: service_healthy
      legal-ai-qdrant:
        condition: service_healthy
      legal-ai-valkey:
        condition: service_healthy
    stdin_open: true
    tty: true

# ═══════════════════════════════════════════════════════════════════
# VOLUMES — names preserved for existing data compatibility
# ═══════════════════════════════════════════════════════════════════
volumes:
  bifrost_data:
    driver: local
  valkey_data:
    driver: local
  qdrant_data:
    driver: local
  minio_data:
    driver: local
  couchdb_data:
    driver: local
  couchdb_config:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  nats_data:
    driver: local
  langfuse_clickhouse_data:
    driver: local
  langfuse_clickhouse_logs:
    driver: local
  # Legacy volumes (kept for data preservation, referenced by older compose files)
  postgres_data:
    driver: local
  rabbitmq_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  fastapi_cache:
    driver: local
  tensorrt_engines:
    driver: local
  tokenizers:
    driver: local
  models:
    driver: local
  chroma_db:
    driver: local
  training_data:
    driver: local

  # SeaweedFS volumes (profile: seaweedfs)
  seaweed_master_data:
    driver: local
    name: ${SEAWEED_MASTER_VOLUME_NAME:-deeds-web-app_seaweed_master_data}
  seaweed_volume_data:
    driver: local
    name: ${SEAWEED_VOLUME_NAME:-deeds-web-app_seaweed_volume_data}

  # torch.compile() / Triton kernel caches — shared between GPU containers.
  # Persists compiled sm_86 .cubin/.ttgir artefacts so containers don't recompile
  # TorchInductor/Triton kernels on every restart (saves 10-30 min cold-start penalty).
  torchinductor_cache:
    driver: local
  triton_cache:
    driver: local

networks:
  legal-ai-network:
    driver: bridge
