[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-gemm"
version = "0.1.0"
description = "Prime Agent bridge for Parent Atlas NumPy/CUDA GEMM parity receipts"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["atlas_gemm*"]
